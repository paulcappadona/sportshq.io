  safe_group_runs:
    meta_title: "Corrida em grupo mais segura para mulheres | Sports HQ"
    meta_desc: "Prefere não correr sozinha? Crie um evento com parceiros de confiança, privado se quiser, veja quem confirmou e, se desejar, compartilhe a localização ao vivo."
    crumb: "Corridas em Grupo Mais Seguras"
    badge: "Para mulheres e qualquer pessoa que prefira não correr sozinha"
    title: "Corridas em Grupo Mais Seguras <span>com Pessoas de Confiança</span>"
    sub: "Correr deveria trazer uma sensação de liberdade, não de medo. Você não deveria precisar mudar sua rotina por causa de assédio — mas se prefere companhia em corridas de manhã cedo, à noite, ou em rotas mais tranquilas, o Sports HQ ajuda você a criar um evento com amigos, família e parceiros de corrida em quem confia, marcá-lo como privado se preferir que fique só entre vocês, e ver exatamente quem confirmou antes de sair de casa."
    sub2: "Seja correndo ao seu lado ou acompanhando de bicicleta, você vai saber quando alguém de confiança se comprometeu a ir com você."
    cta_primary: "Crie Seu Evento de Corrida"
    cta_secondary: "Veja Como Funcionam as Corridas em Grupo"
    intro: "você prefere não correr sozinha — principalmente de manhã cedo, depois de escurecer, ou em rotas mais tranquilas — mas as agendas dos seus parceiros de corrida nunca batem. O Sports HQ coordena pessoas que você já conhece e em quem confia e, se você quiser, pode compartilhar sua localização em tempo real durante uma atividade; não é um serviço de emergência nem garantia de segurança."
    row1_tag: "Seu Círculo de Confiança"
    row1_title: "Um evento construído ao redor de pessoas em quem você já confia, pronto sempre que precisar"
    row1_body: "Crie um evento para as pessoas que você realmente gostaria ao seu lado numa corrida — parceiros de treino, amigos, família, ou alguém que te acompanhe de bicicleta, como faz o parceiro de uma corredora de Gold Coast quando ele não pode correr com ela. Adicione-os como membros, marque o evento como privado se quiser que fique só no seu círculo, e ele fica pronto para reutilizar em toda corrida futura."
    row1_li1: "Marque seu evento como privado se quiser que só os membros convidados possam vê-lo"
    row1_li2: "Adicione membros com um link ou código QR, sem precisar criar conta separada"
    row1_li3: "Funciona tanto para um parceiro de corrida fixo quanto para uma turma inteira do bairro"
    row2_tag: "Confirmações em Tempo Real"
    row2_title: "Tem alguém livre para sua próxima corrida? Descubra em segundos"
    row2_body: "Proponha uma corrida e todo o seu círculo é notificado na hora. Conforme as respostas chegam, você vê tudo atualizar ao vivo — sem precisar cobrar ninguém, e sem sair de casa sem saber quem, se alguém, vai com você."
    row2_step1_title: "Proponha sua próxima corrida"
    row2_step1_body: "Defina horário, ponto de encontro e rota — qualquer membro pode fazer isso."
    row2_step2_title: "Seu círculo é notificado na hora"
    row2_step2_body: "Uma notificação push chega a todos no momento em que é publicada."
    row2_step3_title: "As confirmações chegam ao vivo"
    row2_step3_body: "Veja quem confirmou e quem não confirmou sendo atualizado em tempo real, até a hora de você sair."
    row3_tag: "Contagem ao Vivo"
    row3_title: "Veja quem vai, e quantos, antes de se comprometer"
    row3_body: "Um total ao vivo de confirmados e recusados significa que você não precisa adivinhar. Seja saindo ao amanhecer ou depois do pôr do sol, você vê rapidinho se é um grupo completo, um único parceiro, ou ainda ninguém — para decidir o que fazer."
    row3_li1: "Confirme ou recuse com um toque — sem ida e volta de mensagens"
    row3_li2: "Contagem de participantes ao vivo para você decidir com informação antes de sair"
    row3_li3: "Reutilize o mesmo evento em toda corrida futura — sem precisar começar do zero"
    row4_tag: "Compartilhamento de localização em tempo real"
    row4_title: "Compartilhe sua localização em tempo real com quem você confia, só durante a corrida"
    row4_body: "Comece a compartilhar pela atividade e escolha quem pode acompanhar você: os participantes confirmados ou contatos de segurança que aceitaram seu pedido. O compartilhamento só está disponível em torno da atividade, você pode parar a qualquer momento e ele não é um serviço de emergência."
    row4_li1: "Escolha participantes confirmados ou seus contatos de segurança aceitos"
    row4_li2: "Disponível de uma hora antes do início da atividade até o fim"
    row4_li3: "Pare quando quiser; ele também termina quando essa janela se encerra"
    row4_alt: "Tela de compartilhamento de localização em tempo real do Sports HQ com opções de público para participantes confirmados ou contatos de segurança"
    faq_tag: "Perguntas Frequentes"
    faq_title: "Perguntas sobre correr em grupo"
    faq1_q: "Como o Sports HQ me ajuda a organizar uma corrida em grupo mais segura?"
    faq1_a: "Crie um evento com pessoas que você já conhece e confia, marque como privado se quiser que fique só entre vocês, proponha horário e rota para sua próxima corrida, e veja em tempo real quem confirmou antes de sair."
    faq2_q: "Posso marcar meu evento de corrida como privado?"
    faq2_a: "Sim. Os eventos são públicos por padrão, mas você pode marcar o seu como privado a qualquer momento, para que só os membros convidados possam vê-lo ou participar."
    faq3_q: "O que acontece se ninguém confirmar?"
    faq3_a: "Você vai ver isso claramente antes de sair, para decidir se espera, convida alguém diretamente, ou escolhe outro horário ou rota. O Sports HQ não pode garantir que sempre vai ter alguém livre para ir com você."
    faq4_q: "Um amigo pode me acompanhar de bicicleta em vez de correr?"
    faq4_a: "Sim. Qualquer membro do seu evento pode confirmar presença numa corrida, seja correndo ao seu lado ou acompanhando de bicicleta como companhia e um par de olhos extra."
    faq5_q: "O Sports HQ oferece compartilhamento de localização em tempo real e é um serviço de emergência?"
    faq5_a: "Sim para o primeiro, não para o segundo. Durante uma atividade, você pode escolher compartilhar sua localização em tempo real com os participantes confirmados ou com contatos de segurança que aceitaram seu pedido, e pode parar a qualquer momento. O compartilhamento só está disponível em torno da atividade — de uma hora antes do início até o fim — e para quando você toca em Parar ou a janela se encerra. O Sports HQ não aciona serviços de emergência, não envia alertas de emergência nem garante a segurança de ninguém; mantenha à mão os recursos de emergência do seu celular ou um serviço de segurança dedicado, se precisar."
    download_headline: "Saiba quem confirmou, <span class=\"download__accent\">antes de sair de casa.</span>"
    download_sub: "Baixe o Sports HQ de graça e construa um círculo de corrida de confiança com quem você pode contar."
  youth_sports:
