    row1_li2: "Pedidos de participação geridos pelo responsável no esporte de base"
    row1_li3: "Filtros de idade ajudam a manter os eventos adequados à faixa etária"
    row2_tag: "Fluxos de aprovação"
    row2_title: "Controle quem entra no seu time de base"
