    alt2: "Sports HQ-skärmar för att dela ett evenemang med inbjudningslänk eller QR-kod"
    alt3: "Sports HQ-integritetsinställningar för ett evenemang med privat evenemang och anslutningsbegränsningar"
    alt4: "Sports HQ-inställningar för återkommande pass"
  fill_the_last_spot:
    meta_title: "Hitta en ersättare snabbt: fyll varje plats | Sports HQ"
    meta_desc: "Saknas en spelare? Aviseringar om att en till behövs, påminnelser till dem som inte svarat och kölistor hjälper din match eller liga att fylla varje plats."
    badge: "För arrangörer som hatar att ställa in"
