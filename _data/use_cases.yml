    intro: "du äger eller driver en anläggning, ett komplex, eller en lokal — en tennisklubb, ett gym, en sporthall, ett klättercenter, eller en gemensam plan — och du vill bygga en aktiv, återkommande gemenskap av besökare istället för anonyma engångsbokningar."
