    download_sub: "Scarica Sports HQ gratis e organizza la corsa di stasera in pochi secondi."
  venue_owners:
    crumb: "Proprietari di Strutture"
    badge: "Per Proprietari di Strutture e Impianti"
    title: "Trasforma i Clienti in una <span>Community.</span>"
    sub: "Gestisci un circolo di tennis, una palestra di arrampicata, un complesso multi-campo, o un campo comunitario — e sai che i tuoi membri giocherebbero di più, e resterebbero più a lungo, se si conoscessero tra loro. Sports HQ dà a ogni struttura un livello di community integrato: registrazione, scoperta, programmazione e comunicazione, tutto in un'unica app."
    cta_primary: "Registra la Tua Struttura"
    intro: "possiedi o gestisci una struttura, un complesso, o un impianto — un circolo di tennis, una palestra, un palazzetto, un centro di arrampicata, o un campo comunitario — e vuoi costruire una community attiva e fidelizzata di clienti invece di prenotazioni anonime e occasionali."
    row1_tag: "Iscrizione Senza Attriti"
    row1_title: "Registrazione in pochi secondi, non burocrazia"
    row1_body: "Ogni struttura ottiene sia un codice QR che un link condivisibile verso la stessa pagina di registrazione — usa quello più adatto al mezzo. Stampa il QR per la reception, una bacheca, o a bordo campo; condividi il link direttamente in un gruppo WhatsApp, email, o post social. In entrambi i casi, i clienti arrivano alla stessa pagina e si registrano in pochi secondi."
    row1_li1: "Codice QR da stampare — locandine, segnaposto, cartellonistica a bordo campo"
    row1_li2: "Link per il digitale — WhatsApp, email, social, il tuo sito"
    row1_li3: "I nuovi membri appaiono automaticamente nella tua lista di membri registrati, comunque si siano iscritti"
    row2_tag: "Scoperta"
    row2_title: "Fatti trovare da atleti già nelle vicinanze"
    row2_body: "Sports HQ mostra la tua struttura agli atleti che cercano sulla mappa un posto dove giocare. Ogni membro che iscrivi, e ogni evento che ospiti, aumenta la visibilità della tua struttura verso nuovi clienti nella tua zona."
    row2_li1: "Compare nella ricerca basata sulla posizione per il tuo sport e la tua zona"
    row2_li2: "Mostra i servizi — campi, docce, armadietti, parcheggio — sulla pagina della tua struttura"
    row2_li3: "Gli eventi ospitati nella tua struttura sono scopribili in modo indipendente, portando partecipanti che non sono mai venuti prima"
    row3_tag: "Costruzione di Community"
    row3_title: "Lascia che i tuoi membri si trovino tra loro"
    row3_body: "Una lista membri non è solo uno strumento amministrativo — è la base di una community. I membri possono vedere chi altro gioca nella tua struttura, seguirsi a vicenda, e organizzare le proprie partite e ritrovi, tutto ancorato alla tua struttura."
    row3_li1: "Elenco consultabile dei membri registrati alla struttura"
    row3_li2: "I membri possono scriversi, seguirsi e connettersi direttamente nell'app"
    row3_li3: "Favorisce visite ripetute e crescita organica tramite passaparola"
    row4_tag: "Eventi Ufficiali"
    row4_title: "Ospita gli eventi che fanno tornare le persone"
    row4_body: "Organizza un ritrovo sociale settimanale, un campionato della domenica, o un torneo mensile — crealo una volta come programma ricorrente e lascia che Sports HQ generi automaticamente ogni futura occorrenza."
    row4_step1_title: "Crea il programma ricorrente"
    row4_step1_body: "Imposta giorno, ora, e quante settimane in anticipo generare le occorrenze."
    row4_step2_title: "I membri confermano o rifiutano"
    row4_step2_body: "Le notifiche push partono automaticamente man mano che ogni occorrenza si avvicina."
    row4_step3_title: "Le liste d'attesa colmano i posti dell'ultimo minuto"
    row4_step3_body: "Se un membro confermato rinuncia, la persona successiva in lista viene avvisata all'istante."
    download_headline: "Metti la tua struttura sulla <span class=\"download__accent\">mappa.</span>"
    download_sub: "Unisciti ai proprietari di strutture che già usano Sports HQ per trasformare clienti occasionali in una community fedele e attiva."
  office_sports_organizer:
    crumb: "Organizzatori Sportivi in Ufficio"
    badge: "Per Organizzatori Sportivi in Ufficio"
    title: "Basta Rincorrere Conferme su <span>Slack.</span>"
    sub: "Ti sei offerto volontario per organizzare il calcetto d'ufficio, la corsa della pausa pranzo, o l'aperitivo del venerdì — e in qualche modo ti ritrovi a gestirlo tra tre chat di gruppo e un foglio di calcolo. Sports HQ ti dà un unico posto per programmare, pubblicizzare, e monitorare la presenza, con le notifiche push che fanno il sollecito al posto tuo."
    intro: "sei l'organizzatore non ufficiale di un'attività sportiva sul lavoro — una corsa della pausa pranzo, una squadra di calcetto, una scaletta di badminton, un campionato di softball — e sei stanco di pubblicizzare manualmente le sessioni e sollecitare colleghi che non hanno risposto."
    row1_tag: "Iscrizione Facile"
    row1_title: "Coinvolgi tutta la squadra con una scansione"
    row1_body: "Pubblica un link di adesione nel canale Slack del team o nell'email di benvenuto, oppure stampa il codice QR per la bacheca dell'ufficio — stessa pagina di registrazione in entrambi i casi. I nuovi colleghi si uniscono al tuo evento istantaneamente, senza liste manuali, senza nomi dimenticati."
    row1_li1: "Link per Slack, Teams, o email — un tocco per unirsi dalla scrivania"
    row1_li2: "Codice QR per la bacheca o il kit di benvenuto stampato"
    row1_li3: "L'adesione è gestita interamente nell'app — nessun foglio di calcolo separato"
    row2_tag: "Programmazione Flessibile"
    row2_title: "Ricorrente, occasionale, o entrambi"
    row2_body: "Imposta una fascia settimanale ricorrente per la sessione abituale, poi aggiungi date occasionali manuali per tornei, eventi sociali, o cambi di programma dovuti a festività — tutto dallo stesso evento."
    row2_li1: "Genera automaticamente settimane di occorrenze da un programma continuo"
    row2_li2: "Inserisci attività occasionali manuali che non seguono lo schema"
    row2_li3: "Ogni creazione o modifica attiva una notifica push al team"
    row3_tag: "Monitoraggio Presenze"
    row3_title: "Sai chi viene, senza dover chiedere"
    row3_body: "Osserva conferme e rifiuti arrivare automaticamente man mano che i colleghi rispondono alle notifiche push. Basta con i messaggi \"chi c'è questa settimana?\" — il conteggio è proprio lì."
    row3_step1_title: "L'attività va live"
    row3_step1_body: "Ogni membro riceve una notifica push nel momento in cui una sessione viene programmata o aggiornata."
    row3_step2_title: "Arrivano le conferme"
    row3_step2_body: "Vedi un conteggio in tempo reale e la lista di chi ha confermato, rifiutato, o è ancora in sospeso."
    row3_step3_title: "Sollecita con un tocco"
    row3_step3_body: "Invia una notifica push di promemoria a chi è ancora in sospeso — direttamente dall'app."
    row4_tag: "Liste d'Attesa"
    row4_title: "Le sessioni al completo si gestiscono da sole"
    row4_body: "Imposta una capacità massima per il tuo calcetto o la prenotazione del campo. Una volta pieno, le nuove iscrizioni entrano automaticamente in lista d'attesa — e avanzano non appena qualcuno rinuncia."
    row4_li1: "Basta doppie prenotazioni o discussioni su chi ha un posto"
    row4_li2: "I membri in lista d'attesa vengono avvisati all'istante quando si libera un posto"
    row4_li3: "Funziona automaticamente su ogni occorrenza ricorrente"
    download_headline: "Gestisci la tua squadra senza il <span class=\"download__accent\">foglio di calcolo.</span>"
    download_sub: "Scarica Sports HQ gratis e programma la tua prossima sessione in pochi minuti."
  social_sports_group:
    crumb: "Gruppi Sportivi Sociali"
    badge: "Per Grandi Gruppi Sportivi Sociali"
    title: "Un Grande Gruppo, Gestito <span>Senza Caos.</span>"
    sub: "Una volta che un gruppo sportivo sociale supera qualche decina di membri, le chat di gruppo smettono di funzionare — i messaggi si perdono, i nuovi membri non sanno come iscriversi, e nessuno è sicuro di chi si presenterà davvero. Sports HQ dà struttura al tuo gruppo: adesione controllata, sessioni con limite di posti, e promemoria automatici."
    intro: "amministri un gruppo sportivo che è cresciuto oltre il punto in cui una chat di gruppo può tenere il passo — una squadra sociale di calcio, un gruppo di touch rugby, un campionato di netball, un ritrovo di arrampicata — con decine o centinaia di membri su più sessioni regolari."
    row1_tag: "Controllo dell'Adesione"
    row1_title: "Pubblico, privato, o una via di mezzo"
    row1_body: "Crea l'attività del tuo gruppo come modello di evento. Rendila pubblica e scopribile per una crescita organica, oppure privata così l'adesione è completamente controllata — visibile solo a chi decidi tu."
    row1_li1: "Gli eventi privati sono completamente nascosti da ricerca e scoperta"
    row1_li2: "Le impostazioni di sicurezza e adesione si configurano per singolo evento"
    row1_li3: "Passa un gruppo da solo su invito a crescita aperta quando sei pronto"
    row2_tag: "Adesione Senza Sforzo"
    row2_title: "Un link fa tutto il lavoro"
    row2_body: "Condividi un unico link in un gruppo WhatsApp, una firma email, o un post social — oppure stampa il codice QR corrispondente per locandine e bacheche. In entrambi i casi un nuovo membro arriva alla stessa pagina di iscrizione con un tocco o una scansione."
    row2_li1: "Basta spiegare \"come mi iscrivo\" a ogni nuovo membro"
    row2_li2: "Scegli link o codice QR a seconda di dove stai reclutando"
    row2_li3: "Funziona sia che il destinatario abbia già Sports HQ oppure no"
    row3_tag: "Programmazione a Modo Tuo"
    row3_title: "Controllo manuale, comodità ricorrente"
    row3_body: "Programma attività manualmente per sessioni estemporanee, oppure imposta uno schema ricorrente per la tua partita settimanale abituale — e passa dall'uno all'altro secondo le esigenze del calendario del tuo gruppo."
    row3_li1: "Le notifiche push arrivano a ogni membro nel momento in cui una sessione viene creata o cambiata"
    row3_li2: "I membri confermano o rifiutano la presenza con un solo tocco"
    row3_li3: "I promemoria partono automaticamente man mano che la sessione si avvicina"
    row4_tag: "Capacità e Liste d'Attesa"
    row4_title: "Limita la dimensione del gruppo senza rifiutare nessuno"
    row4_body: "Imposta un numero massimo di partecipanti in linea con la capacità del tuo campo o della tua struttura. Una volta piena una sessione, le nuove iscrizioni entrano automaticamente in lista d'attesa invece di andare perse."
    row4_step1_title: "Imposta la dimensione massima del gruppo"
    row4_step1_body: "Le sessioni smettono di accettare conferme una volta raggiunto il limite."
    row4_step2_title: "Le iscrizioni extra entrano in lista d'attesa"
    row4_step2_body: "Nessuno viene rifiutato direttamente — vengono messi automaticamente in coda."
    row4_step3_title: "I posti si riempiono da soli"
    row4_step3_body: "Quando un membro confermato rifiuta, il membro successivo in lista d'attesa viene avvisato all'istante."
    download_headline: "Metti ordine in un <span class=\"download__accent\">grande gruppo.</span>"
    download_sub: "Scarica Sports HQ gratis e dai al tuo gruppo sportivo sociale la struttura che ha ormai superato le possibilità di una chat di gruppo."
  communal_field_community:
    crumb: "Community di Campi Comuni"
    badge: "Per Community di Campi e Strutture Comuni"
    title: "Stesso Campo. Stesse Facce. <span>Ora una Community.</span>"
    sub: "Tu e alcuni habitué condividete lo stesso campo pubblico, campetto di parco, o campo comunitario — ma non avete mai davvero conosciuto tutti quelli che ci giocano. Sports HQ trasforma quello spazio condiviso in una community reale e organizzata, senza bisogno di possedere la struttura."
    intro: "giochi regolarmente sullo stesso campo comune, campetto, o parco — e non hai bisogno di possedere la struttura per costruirci una community. Ti serve solo un modo perché chi si presenta possa trovare gli altri."
    row1_tag: "Comincia"
    row1_title: "Crea il tuo evento, poi scegli come condividerlo"
    row1_body: "Crea il tuo evento in Sports HQ e ottieni un codice QR e un link di adesione alla stessa pagina. Stampa il codice QR e lascia una copia o due sul campo — attaccata a un palo, una panchina, o una bacheca — oppure condividi il link nella chat di gruppo per chi non è ancora sul posto."
    row1_li1: "Nessuna proprietà della struttura o processo di iscrizione richiesto per iniziare"
    row1_li2: "Codice QR per il campo stesso; link per la chat di gruppo — usa uno, o entrambi"
    row1_li3: "I nuovi giocatori si uniscono nel momento in cui scansionano o toccano — senza aspettare un amministratore"
    row2_tag: "Scopribilità"
    row2_title: "Trovato da chiunque cerchi nelle vicinanze"
    row2_body: "Oltre al codice QR, il tuo evento è scopribile tramite ricerca basata sulla posizione — così un corridore, calciatore, o cestista di passaggio nella zona può trovare la tua community e venire a giocare."
    row2_li1: "Compare nei risultati di ricerca mappa per il tuo sport e la tua zona"
    row2_li2: "Fai crescere i tuoi habitué oltre chi ha visto per caso il cartello"
    row2_li3: "Funziona insieme al codice QR, non al suo posto"
    row3_tag: "Vera Community"
    row3_title: "Metti un nome alle facce che vedi ogni settimana"
    row3_body: "Una volta registrate all'evento del tuo campo, le persone possono sfogliare i profili degli altri, seguire gli habitué, e scriversi direttamente — trasformando \"le persone che giocano al parco\" in una vera rete."
    row3_li1: "L'elenco membri mostra tutti quelli registrati all'evento"
    row3_li2: "La messaggistica integrata elimina la necessità di una chat di gruppo separata"
    row3_li3: "Incoraggia le persone a organizzare autonomamente le proprie sessioni"
    row4_tag: "Coordinamento"
    row4_title: "Coordinamento facile delle attività, senza carico amministrativo"
    row4_body: "Programma una corsa settimanale ricorrente, imposta sessioni occasionali, o lascia che qualsiasi membro confermato proponga una nuova attività — presenza, promemoria, e aggiornamenti sono tutti gestiti automaticamente."
    row4_li1: "I programmi ricorrenti mantengono la tua fascia abituale senza manutenzione manuale"
    row4_li2: "Le notifiche push avvisano tutti di nuove sessioni o cambiamenti all'istante"
    row4_li3: "Conferma/rifiuto con un tocco mantiene accurato il conteggio"
    download_headline: "Costruisci una community intorno al tuo <span class=\"download__accent\">campo.</span>"
    download_sub: "Scarica Sports HQ gratis, crea il tuo evento, e stampa oggi il tuo primo codice QR."

- id: ja
  run_club:
    crumb: "ランクラブ"
    badge: "アドホックなランクラブ向け"
    title: "メッセージは減らして、<span>ランはもっと。</span>"
    sub: "あなたのランクラブは固定スケジュールでは動いていません — 今夜誰が空いているか次第です。Sports HQは終わりのないグループチャットを、即時通知とワンタップの参加確認に置き換え、調整に費やす時間を減らして走る時間を増やします。"
    intro: "ランクラブやトレーニング仲間、あるいは何週間も前から予定するのではなく直前に提案されるようなグループ活動を主催していて、「今夜誰が来る？」とグループチャットに打ち込むのにうんざりしている方向けです。"
    row1_tag: "一元化されたコミュニケーション"
    row1_title: "1つのイベント、1つのクルー、ノイズはゼロ"
    row1_body: "Sports HQでランクラブを一度イベントとして作成し、クルーを追加します。それ以降、すべての活動、更新、リマインダーはアプリを通じて流れます — 3つの異なるメッセージスレッドではなく。"
    row1_li1: "一度設定すれば、今後のすべてのランで再利用できる"
    row1_li2: "ランニングだけでなく、どんなスポーツや活動にも同じように機能"
    row1_li3: "グループチャットに貼ったリンク、または申込用紙のQRコードでメンバーを追加 — やりやすい方でOK"
    row2_tag: "即時通知"
    row2_title: "今夜のランを提案し、全員にすぐ通知"
    row2_body: "どのメンバーでもクルーのために活動を作成できます — 日付、時間、ルートを提案すれば、全員がすぐにプッシュ通知を受け取ります。管理者のボトルネックはなく、誰かが「見る」のを待つこともありません。"
    row2_step1_title: "誰かがランを提案する"
    row2_step1_body: "主催者でなくても、どのメンバーでも活動を作成できます。"
    row2_step2_title: "全員に同時に通知が届く"
    row2_step2_body: "活動が作成された瞬間にプッシュ通知が送信されます。"
    row2_step3_title: "返信がすぐに届く"
    row2_step3_body: "ワンタップで参加確認または辞退 — 入力の必要はありません。"
    row3_tag: "即時確認"
    row3_title: "家を出る前に誰が走るかがわかる"
    row3_body: "今夜のランのライブ参加状況を確認 — 誰が確認済みか、誰が辞退したか、誰がまだ返信していないか — フォローアップのメッセージを一つも送らずに。"
    row3_li1: "ワンタップの参加確認/辞退で、やり取りの往復が完全になくなる"
    row3_li2: "手間を最小限にして、クルーが実際のトレーニングに集中できるように"
    row3_li3: "同じ流れがSports HQで管理されるどんなスポーツや活動にも通用する"
    download_headline: "準備の時間を減らして、<span class=\"download__accent\">走る時間を増やそう。</span>"
    download_sub: "Sports HQを無料でダウンロードして、今夜のランを数秒で決めよう。"
  venue_owners:
    crumb: "施設オーナー"
    badge: "施設・会場オーナー向け"
    title: "利用者を<span>コミュニティ</span>に変える。"
    sub: "テニスクラブ、クライミングジム、複数コート施設、あるいは地域のグラウンドを運営していて、メンバー同士が知り合えばもっとプレーし、長く続けてくれることをご存知でしょう。Sports HQはあらゆる施設に、登録、発見、スケジュール管理、コミュニケーションを1つのアプリに備えたコミュニティ層を提供します。"
    cta_primary: "施設を登録する"
    intro: "テニスクラブ、ジム、体育館、クライミングセンター、地域のグラウンドなど、施設や複合施設、会場を所有・運営していて、単発の匿名予約ではなく、活発でリピートする利用者コミュニティを構築したい方向けです。"
    row1_tag: "摩擦のないオンボーディング"
    row1_title: "書類手続きではなく、数秒での登録"
    row1_body: "どの施設も同じ登録ページへのQRコードと共有可能なリンクの両方を取得できます — 媒体に合った方を使ってください。受付や掲示板、コート脇にQRコードを印刷し、WhatsAppグループやメール、SNS投稿には直接リンクを貼ります。どちらの方法でも、利用者は同じページにたどり着き、数秒で登録できます。"
    row1_li1: "印刷用QRコード — ポスター、テーブルサイン、コート脇の看板"
    row1_li2: "デジタル用リンク — WhatsApp、メール、SNS、あなたのウェブサイト"
    row1_li3: "新しいメンバーは、参加方法にかかわらず自動的に登録済みメンバーリストに表示される"
    row2_tag: "発見のしやすさ"
    row2_title: "近くにいるアスリートに見つけてもらう"
    row2_body: "Sports HQは、地図上でプレーする場所を探しているアスリートにあなたの施設を表示します。オンボードするメンバーやホストするイベントが増えるたびに、地域の新しい利用者へのあなたの施設の露出が高まります。"
    row2_li1: "あなたのスポーツとエリアの位置情報検索に表示される"
    row2_li2: "コート、シャワー、ロッカー、駐車場などの設備を施設ページで紹介"
    row2_li3: "あなたの施設で開催されるイベントは独立して発見可能で、これまで訪れたことのない参加者を呼び込む"
    row3_tag: "コミュニティ構築"
    row3_title: "メンバー同士が見つけ合えるように"
    row3_body: "メンバーリストは単なる管理ツールではなく、コミュニティの基盤です。メンバーは施設で他に誰がプレーしているかを閲覧し、フォローし合い、自分たちの試合や交流会を企画できます — すべてあなたの施設を軸にして。"
    row3_li1: "登録済み施設メンバーの検索可能なディレクトリ"
    row3_li2: "メンバーはアプリ内で直接メッセージ、フォロー、つながりが可能"
    row3_li3: "リピート訪問と口コミによる自然な成長を促進"
    row4_tag: "公式イベント"
    row4_title: "人々が戻ってくるイベントを開催"
    row4_body: "週次のメンバー交流会、日曜リーグ、月例トーナメントを実施 — 一度定期スケジュールとして作成すれば、Sports HQが今後のすべてのインスタンスを自動生成します。"
    row4_step1_title: "定期スケジュールを作成"
    row4_step1_body: "曜日、時間、そして何週間先までインスタンスを生成するかを設定。"
    row4_step2_title: "メンバーが確認または辞退"
    row4_step2_body: "各インスタンスが近づくと自動的にプッシュ通知が送信される。"
    row4_step3_title: "キャンセル待ちが直前の空きを埋める"
    row4_step3_body: "確認済みメンバーがキャンセルした場合、次の順番の人にすぐ通知される。"
