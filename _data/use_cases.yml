    cta_secondary: "看看團體跑步怎麼運作"
    intro: "你比較不想獨自跑步——尤其是清晨、天黑之後，或人煙稀少的路線上——但跑步夥伴的時間總是湊不到一起。Sports HQ 幫你協調已經認識並信任的人，並可在你選擇時於活動期間分享你的即時位置；它不是緊急救援服務，也不能保證安全。"
