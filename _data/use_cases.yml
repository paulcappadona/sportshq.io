    row2_step1_body: "Vilken medlem som helst kan skapa aktiviteten — den behöver inte vara arrangören."
    row2_step2_title: "Alla meddelas samtidigt"
    row2_step2_body: "En pushnotis skickas i det ögonblick aktiviteten skapas."
