    intro: "παίζεις τακτικά στο ίδιο κοινοτικό γήπεδο, γήπεδο, ή πάρκο — και δεν χρειάζεται να κατέχεις τον χώρο για να χτίσεις εκεί μια κοινότητα. Χρειάζεσαι απλώς έναν τρόπο για να βρίσκονται μεταξύ τους όσοι εμφανίζονται."
    row1_tag: "Ξεκίνα"
    row1_title: "Δημιούργησε την εκδήλωσή σου, μετά διάλεξε πώς θα τη μοιραστείς"
    row1_body: "Δημιούργησε την εκδήλωσή σου στο Sports HQ και παίρνεις έναν κωδικό QR και έναν σύνδεσμο συμμετοχής προς την ίδια σελίδα. Τύπωσε τον κωδικό QR και άφησε ένα-δύο αντίγραφα στο γήπεδο — κολλημένα σε έναν φράχτη, ένα παγκάκι, ή έναν πίνακα ανακοινώσεων — ή βάλε τον σύνδεσμο στο group chat για όσους δεν είναι ακόμα εκεί."
    row1_li1: "Δεν χρειάζεται ιδιοκτησία χώρου ή διαδικασία εγγραφής για να ξεκινήσεις"
    row1_li2: "Κωδικός QR για το ίδιο το γήπεδο· σύνδεσμος για το group chat — χρησιμοποίησε είτε το ένα, είτε και τα δύο"
    row1_li3: "Νέοι παίκτες μπαίνουν τη στιγμή που σκανάρουν ή πατούν — χωρίς αναμονή για κάποιον διαχειριστή"
    row2_tag: "Ανακαλυψιμότητα"
    row2_title: "Σε βρίσκει όποιος ψάχνει κοντά"
    row2_body: "Πέρα από τον κωδικό QR, η εκδήλωσή σου είναι ανακαλύψιμη μέσω αναζήτησης βάσει τοποθεσίας — έτσι ένας δρομέας, ποδοσφαιριστής, ή μπασκετμπολίστας που περνάει από την περιοχή μπορεί να βρει την κοινότητά σου και να έρθει να παίξει."
    row2_li1: "Εμφανίσου στα αποτελέσματα αναζήτησης χάρτη για το άθλημα και την τοποθεσία σου"
    row2_li2: "Μεγάλωσε τους τακτικούς σου πέρα από όσους έτυχε να δουν την πινακίδα"
    row2_li3: "Λειτουργεί παράλληλα με τον κωδικό QR, όχι αντί για αυτόν"
    row3_tag: "Πραγματική Κοινότητα"
    row3_title: "Βάλε ονόματα στα πρόσωπα που βλέπεις κάθε εβδομάδα"
    row3_body: "Μόλις οι άνθρωποι εγγραφούν στην εκδήλωση του γηπέδου σου, μπορούν να δουν τα προφίλ ο ένας του άλλου, να ακολουθήσουν τακτικούς, και να στείλουν μηνύματα απευθείας — μετατρέποντας \"τους ανθρώπους που παίζουν στο πάρκο\" σε ένα πραγματικό δίκτυο."
    row3_li1: "Ο κατάλογος μελών δείχνει όλους όσους είναι εγγεγραμμένοι στην εκδήλωση"
    row3_li2: "Η ενσωματωμένη ανταλλαγή μηνυμάτων εξαλείφει την ανάγκη για ξεχωριστό group chat"
    row3_li3: "Ενθαρρύνει τους ανθρώπους να διοργανώνουν τις δικές τους συναντήσεις ανεξάρτητα"
    row4_tag: "Συντονισμός"
    row4_title: "Εύκολος συντονισμός δραστηριοτήτων, χωρίς διαχειριστικό βάρος"
    row4_body: "Προγραμμάτισε ένα επαναλαμβανόμενο εβδομαδιαίο τρέξιμο, όρισε μεμονωμένες συναντήσεις, ή άσε οποιοδήποτε επιβεβαιωμένο μέλος να προτείνει μια νέα δραστηριότητα — παρουσία, υπενθυμίσεις, και ενημερώσεις γίνονται όλα αυτόματα."
    row4_li1: "Τα επαναλαμβανόμενα προγράμματα κρατούν την τακτική σου ώρα χωρίς χειροκίνητη συντήρηση"
    row4_li2: "Οι ειδοποιήσεις push ενημερώνουν όλους για νέες συναντήσεις ή αλλαγές αμέσως"
    row4_li3: "Η επιβεβαίωση/απόρριψη με ένα άγγιγμα κρατά ακριβή τον αριθμό συμμετεχόντων"
    download_headline: "Χτίσε μια κοινότητα γύρω από το <span class=\"download__accent\">γήπεδό σου.</span>"
    download_sub: "Κατέβασε το Sports HQ δωρεάν, δημιούργησε την εκδήλωσή σου, και τύπωσε τον πρώτο σου κωδικό QR σήμερα."

- id: es
  run_club:
    crumb: "Clubes de Running"
    badge: "Para Clubes de Running Improvisados"
    title: "Menos Mensajes. <span>Más Carreras.</span>"
    sub: "Tu club de running no sigue un horario fijo — depende de quién esté libre esta tarde. Sports HQ sustituye el chat grupal interminable por notificaciones instantáneas y confirmaciones con un toque, para que dediques menos tiempo a coordinar y más a correr."
    intro: "organizas un club de running, un grupo de entrenamiento, o cualquier actividad grupal que se propone de un día para otro en lugar de programarse con semanas de antelación — y estás cansado de escribir \"¿quién se apunta esta noche?\" en un chat grupal."
    row1_tag: "Comunicación Centralizada"
    row1_title: "Un evento, un grupo, cero ruido"
    row1_body: "Crea tu club de running como un evento en Sports HQ una sola vez y añade a tu grupo. A partir de ahí, cada actividad, actualización y recordatorio pasa por la app — no por tres chats distintos."
    row1_li1: "Configúralo una vez; reutilízalo para cada futura carrera"
    row1_li2: "Funciona igual de bien para cualquier deporte o actividad, no solo running"
    row1_li3: "Añade miembros con un enlace en el chat grupal, o un código QR en una hoja de inscripción — lo que sea más fácil"
    row2_tag: "Notificaciones Instantáneas"
    row2_title: "Propón la carrera de esta noche y avisa a todos al instante"
    row2_body: "Cualquier miembro puede crear una actividad para el grupo — propone fecha, hora y ruta, y todos reciben una notificación push al instante. Sin cuellos de botella ni esperar a que alguien \"vea\" el mensaje."
    row2_step1_title: "Alguien propone una carrera"
    row2_step1_body: "Cualquier miembro puede crear la actividad — no tiene que ser el organizador."
    row2_step2_title: "Todos reciben la notificación a la vez"
    row2_step2_body: "Se envía una notificación push en el momento en que se crea la actividad."
    row2_step3_title: "Las respuestas llegan al instante"
    row2_step3_body: "Confirma o rechaza con un toque — sin necesidad de escribir."
    row3_tag: "Confirmación Instantánea"
    row3_title: "Sabe quién corre antes de salir de casa"
    row3_body: "Consulta la asistencia en tiempo real de la carrera de esta noche — quién ha confirmado, quién ha rechazado y quién aún no ha respondido — sin enviar un solo mensaje de seguimiento."
    row3_li1: "Confirmar/rechazar con un toque elimina por completo el ida y vuelta"
    row3_li2: "Minimiza la gestión para que el grupo se centre en entrenar"
    row3_li3: "El mismo flujo funciona para cualquier deporte o actividad gestionada en Sports HQ"
    download_headline: "Dedica menos tiempo a organizar, <span class=\"download__accent\">más tiempo a correr.</span>"
    download_sub: "Descarga Sports HQ gratis y organiza la carrera de esta noche en segundos."
  venue_owners:
    crumb: "Propietarios de Instalaciones"
    badge: "Para Propietarios de Instalaciones"
    title: "Convierte a tus Clientes en una <span>Comunidad.</span>"
    sub: "Diriges un club de tenis, un gimnasio de escalada, un complejo multideportivo o una cancha comunitaria — y sabes que tus miembros jugarían más, y se quedarían más tiempo, si se conocieran entre ellos. Sports HQ da a cada instalación una capa de comunidad integrada: registro, descubrimiento, programación y comunicación, todo en una app."
    cta_primary: "Registra tu Instalación"
    intro: "eres propietario o gestionas una instalación, complejo o recinto — un club de tenis, gimnasio, pabellón deportivo, centro de escalada o campo comunitario — y quieres construir una comunidad activa y recurrente de clientes en lugar de reservas anónimas y puntuales."
    row1_tag: "Incorporación Sin Fricción"
    row1_title: "Registro en segundos, no en papeleo"
    row1_body: "Cada instalación obtiene un código QR y un enlace compartible a la misma página de registro — usa el que mejor se adapte al medio. Imprime el QR para recepción, un tablón de anuncios o la pista; comparte el enlace en un grupo de WhatsApp, email o redes. En cualquier caso, los clientes llegan a la misma página y se registran en segundos."
    row1_li1: "Código QR para imprimir — carteles, señalización en pista"
    row1_li2: "Enlace para digital — WhatsApp, email, redes, tu web"
    row1_li3: "Los nuevos miembros aparecen automáticamente en tu lista de miembros registrados, sea cual sea la vía de entrada"
    row2_tag: "Descubrimiento"
    row2_title: "Que te encuentren los deportistas que ya están cerca"
    row2_body: "Sports HQ muestra tu instalación a deportistas que buscan en el mapa un lugar donde jugar. Cada miembro que incorporas, y cada evento que organizas, aumenta la visibilidad de tu instalación ante nuevos clientes en tu zona."
    row2_li1: "Aparece en la búsqueda por ubicación para tu deporte y zona"
    row2_li2: "Muestra tus instalaciones — pistas, duchas, taquillas, aparcamiento — en tu página"
    row2_li3: "Los eventos organizados en tu instalación son descubribles de forma independiente, atrayendo a asistentes que nunca han estado antes"
    row3_tag: "Construcción de Comunidad"
    row3_title: "Deja que tus miembros se encuentren entre ellos"
    row3_body: "Una lista de miembros no es solo una herramienta administrativa — es la base de una comunidad. Los miembros pueden ver quién más juega en tu instalación, seguirse entre ellos y organizar sus propios partidos y quedadas, todo anclado a tu instalación."
    row3_li1: "Directorio con búsqueda de miembros registrados en la instalación"
    row3_li2: "Los miembros pueden mensajearse, seguirse y conectar directamente en la app"
    row3_li3: "Impulsa visitas repetidas y crecimiento orgánico por recomendación"
    row4_tag: "Eventos Sancionados"
    row4_title: "Organiza los eventos que hacen que la gente vuelva"
    row4_body: "Organiza una quedada social semanal, una liga dominical o un torneo mensual — créalo una vez como horario recurrente y deja que Sports HQ genere automáticamente cada futura instancia."
    row4_step1_title: "Crea el horario recurrente"
    row4_step1_body: "Define el día, la hora y con cuántas semanas de antelación deben generarse las instancias."
    row4_step2_title: "Los miembros confirman o rechazan"
    row4_step2_body: "Las notificaciones push se envían automáticamente a medida que se acerca cada instancia."
    row4_step3_title: "Las listas de espera cubren huecos de última hora"
    row4_step3_body: "Si un miembro confirmado cancela, se notifica al instante a la siguiente persona en la lista."
    download_headline: "Pon tu instalación en el <span class=\"download__accent\">mapa.</span>"
    download_sub: "Únete a los propietarios de instalaciones que ya usan Sports HQ para convertir clientes ocasionales en una comunidad activa y fiel."
  office_sports_organizer:
    crumb: "Organizadores de Deporte en la Oficina"
    badge: "Para Organizadores de Deporte en la Oficina"
    title: "Deja de Perseguir Confirmaciones por <span>Slack.</span>"
    sub: "Te ofreciste para organizar el fútbol 5 de la oficina, la carrera de mediodía o el social del viernes — y de alguna manera acabaste gestionándolo entre tres chats grupales y una hoja de cálculo. Sports HQ te da un solo lugar para programar, publicitar y controlar la asistencia, con notificaciones push haciendo el seguimiento por ti."
    intro: "eres el organizador no oficial de una actividad deportiva del trabajo — una carrera de mediodía, un equipo de fútbol 5, una liga de bádminton, una liga de softball — y estás cansado de publicitar sesiones manualmente y perseguir a compañeros que no han respondido."
    row1_tag: "Registro Fácil"
    row1_title: "Incorpora a todo el equipo con un escaneo"
    row1_body: "Publica un enlace de unión en el canal de Slack del equipo o en el email de bienvenida, o imprime el código QR para el tablón de la oficina — misma página de registro en ambos casos. Los nuevos compañeros se unen a tu evento al instante, sin listas manuales, sin nombres olvidados."
    row1_li1: "Enlace para Slack, Teams o email — un toque para unirse desde el escritorio"
    row1_li2: "Código QR para el tablón o el pack de bienvenida impreso"
    row1_li3: "La membresía se gestiona íntegramente en la app — sin hoja de cálculo aparte"
    row2_tag: "Programación Flexible"
    row2_title: "Recurrente, puntual, o ambas"
    row2_body: "Define una franja semanal recurrente para la sesión habitual, y añade fechas puntuales manuales para torneos, eventos sociales o cambios de horario por festivos — todo desde el mismo evento."
    row2_li1: "Genera semanas de instancias automáticamente a partir de un horario continuo"
    row2_li2: "Añade actividades puntuales manuales que no encajan en el patrón"
    row2_li3: "Cada creación o cambio dispara una notificación push al equipo"
    row3_tag: "Control de Asistencia"
    row3_title: "Sabe quién viene, sin preguntar"
    row3_body: "Observa cómo llegan confirmaciones y rechazos automáticamente a medida que los compañeros responden a las notificaciones push. Se acabaron los mensajes de \"¿quién se apunta esta semana?\" — el recuento está ahí mismo."
    row3_step1_title: "La actividad se publica"
    row3_step1_body: "Cada miembro recibe una notificación push en el momento en que se programa o actualiza una sesión."
    row3_step2_title: "Llegan las confirmaciones"
    row3_step2_body: "Ves un recuento en vivo y la lista de quién ha confirmado, rechazado o sigue pendiente."
    row3_step3_title: "Haz seguimiento con un toque"
    row3_step3_body: "Envía una notificación push de recordatorio a quien siga pendiente — directamente desde la app."
    row4_tag: "Listas de Espera"
    row4_title: "Las sesiones completas se gestionan solas"
    row4_body: "Define un aforo máximo para tu fútbol 5 o reserva de pista. Cuando se llena, las nuevas inscripciones se unen automáticamente a una lista de espera — y avanzan en cuanto alguien cancela."
    row4_li1: "Se acabaron las dobles reservas o discusiones sobre quién tiene plaza"
    row4_li2: "Los miembros en lista de espera reciben notificación al instante cuando se libera una plaza"
    row4_li3: "Funciona automáticamente en cada instancia recurrente"
    download_headline: "Gestiona tu equipo sin la <span class=\"download__accent\">hoja de cálculo.</span>"
    download_sub: "Descarga Sports HQ gratis y programa tu próxima sesión en minutos."
  social_sports_group:
    crumb: "Grupos Deportivos Sociales"
    badge: "Para Grandes Grupos Deportivos Sociales"
    title: "Un Grupo Grande, Sin <span>Caos.</span>"
    sub: "Cuando un grupo deportivo social supera unas pocas decenas de miembros, los chats grupales dejan de funcionar — los mensajes se pierden, los nuevos miembros no saben cómo unirse y nadie está seguro de quién va a aparecer. Sports HQ da estructura a tu grupo: membresía controlada, sesiones con aforo limitado y recordatorios automáticos."
    intro: "administras un grupo deportivo que ha crecido más allá de lo que un chat grupal puede manejar — un grupo social de fútbol, un grupo de rugby tocado, una liga de netball, quedadas de escalada — con decenas o cientos de miembros en múltiples sesiones habituales."
    row1_tag: "Control de Membresía"
    row1_title: "Público, privado, o algo intermedio"
    row1_body: "Crea la actividad de tu grupo como una plantilla de evento. Hazlo público y descubrible para crecer de forma orgánica, o privado para que la membresía esté totalmente controlada — visible solo para quien tú dejes entrar."
    row1_li1: "Los eventos privados quedan completamente ocultos de la búsqueda y el descubrimiento"
    row1_li2: "La configuración de seguridad y membresía se define por evento"
    row1_li3: "Cambia un grupo de solo invitación a crecimiento abierto cuando estés listo"
    row2_tag: "Incorporación sin Esfuerzo"
    row2_title: "Un enlace hace todo el trabajo"
    row2_body: "Comparte un único enlace en un grupo de WhatsApp, una firma de email o una publicación en redes — o imprime el código QR a juego para carteles y tablones. En ambos casos, un nuevo miembro llega a la misma página de inscripción con un toque o un escaneo."
    row2_li1: "Se acabó explicar \"cómo me uno\" a cada nuevo miembro"
    row2_li2: "Elige enlace o código QR según dónde estés reclutando"
    row2_li3: "Funciona tenga o no la persona ya instalado Sports HQ"
    row3_tag: "Programa a tu Manera"
    row3_title: "Control manual, comodidad recurrente"
    row3_body: "Programa actividades manualmente para sesiones puntuales, o define un patrón recurrente para tu partido semanal habitual — y cambia entre ambos según lo pida el calendario de tu grupo."
    row3_li1: "Las notificaciones push llegan a cada miembro en el momento en que se crea o cambia una sesión"
    row3_li2: "Los miembros confirman o rechazan asistencia con un solo toque"
    row3_li3: "Los recordatorios se envían automáticamente a medida que se acerca la sesión"
    row4_tag: "Aforo y Listas de Espera"
    row4_title: "Limita el tamaño del grupo sin rechazar a nadie"
    row4_body: "Define un número máximo de asistentes acorde al aforo de tu campo, pista o instalación. Cuando una sesión se llena, las nuevas inscripciones se unen automáticamente a una lista de espera en lugar de perderse."
    row4_step1_title: "Define el tamaño máximo del grupo"
    row4_step1_body: "Las sesiones dejan de aceptar confirmaciones al alcanzar el límite."
    row4_step2_title: "Las inscripciones extra se unen a la lista de espera"
    row4_step2_body: "A nadie se le rechaza directamente — se colocan en cola automáticamente."
    row4_step3_title: "Las plazas se cubren solas"
    row4_step3_body: "Cuando un miembro confirmado rechaza, el siguiente en la lista de espera recibe notificación al instante."
    download_headline: "Pon orden en un <span class=\"download__accent\">grupo grande.</span>"
    download_sub: "Descarga Sports HQ gratis y da a tu grupo deportivo social la estructura que ya le ha quedado pequeña a un chat grupal."
  communal_field_community:
    crumb: "Comunidades de Campos Comunitarios"
    badge: "Para Comunidades de Campos e Instalaciones Comunitarias"
    title: "Mismo Campo. Mismas Caras. <span>Ahora una Comunidad.</span>"
    sub: "Tú y unos cuantos habituales compartís la misma pista pública, cancha de parque o campo comunitario — pero nunca habéis llegado a conoceros todos los que jugáis ahí. Sports HQ convierte ese espacio compartido en una comunidad real y organizada, sin necesidad de ser propietario de la instalación."
    intro: "juegas habitualmente en el mismo campo, pista o parque comunitario — y no necesitas ser propietario de la instalación para construir una comunidad ahí. Solo necesitas una forma de que quienes aparecen se encuentren entre sí."
    row1_tag: "Empieza"
    row1_title: "Crea tu evento y elige cómo compartirlo"
    row1_body: "Crea tu evento en Sports HQ y obtienes un código QR y un enlace de unión a la misma página. Imprime el QR y deja una copia o dos en el campo — pegado a un poste, un banco o un tablón de anuncios — o comparte el enlace en el chat grupal para quien aún no esté allí."
    row1_li1: "No se necesita ser propietario de la instalación ni proceso de inscripción para empezar"
    row1_li2: "Código QR para el propio campo; enlace para el chat grupal — usa uno, o ambos"
    row1_li3: "Los nuevos jugadores se unen en el momento en que escanean o tocan — sin esperar a un administrador"
    row2_tag: "Capacidad de Descubrimiento"
    row2_title: "Que te encuentre cualquiera que busque cerca"
    row2_body: "Más allá del código QR, tu evento es descubrible mediante búsqueda por ubicación — así un corredor, futbolista o jugador de baloncesto que pase por la zona puede encontrar tu comunidad y venir a jugar."
    row2_li1: "Aparece en los resultados de búsqueda del mapa para tu deporte y ubicación"
    row2_li2: "Haz crecer tu grupo de habituales más allá de quienes vieron el cartel por casualidad"
    row2_li3: "Funciona junto al código QR, no en su lugar"
    row3_tag: "Comunidad Real"
    row3_title: "Pon nombre a las caras que ves cada semana"
    row3_body: "Una vez que la gente está registrada en el evento de tu campo, pueden ver los perfiles de los demás, seguir a los habituales y escribirse directamente — convirtiendo \"la gente que juega en el parque\" en una red real."
    row3_li1: "El directorio de miembros muestra a todos los registrados en el evento"
    row3_li2: "La mensajería integrada elimina la necesidad de un chat grupal aparte"
    row3_li3: "Anima a la gente a organizar sus propias quedadas de forma independiente"
    row4_tag: "Coordinación"
    row4_title: "Coordinación fácil de actividades, sin carga administrativa"
    row4_body: "Programa una carrera semanal recurrente, organiza sesiones puntuales, o deja que cualquier miembro confirmado proponga una nueva actividad — la asistencia, los recordatorios y las actualizaciones se gestionan automáticamente."
    row4_li1: "Los horarios recurrentes mantienen tu franja habitual sin mantenimiento manual"
    row4_li2: "Las notificaciones push avisan a todos de nuevas sesiones o cambios al instante"
    row4_li3: "Confirmar/rechazar con un toque mantiene el recuento preciso"
    download_headline: "Construye una comunidad en torno a tu <span class=\"download__accent\">campo.</span>"
    download_sub: "Descarga Sports HQ gratis, crea tu evento e imprime hoy tu primer código QR."

