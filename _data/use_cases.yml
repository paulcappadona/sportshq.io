    row2_body: "Sports HQ visar upp din anläggning för idrottare som söker på kartan efter en plats att spela på. Varje medlem du introducerar, och varje event du håller i, ökar din anläggnings synlighet för nya besökare i ditt område."
    row2_li1: "Synas i platsbaserad sökning för din sport och ditt område"
    row2_li2: "Visa upp faciliteter — planer, duschar, skåp, parkering — på din anläggningssida"
    row2_li3: "Event som hålls på din anläggning är oberoende upptäckbara, vilket lockar besökare som aldrig varit där förut"
    row3_tag: "Gemenskapsbyggande"
    row3_title: "Låt dina medlemmar hitta varandra"
    row3_body: "En medlemslista är inte bara ett administrationsverktyg — det är grunden för en gemenskap. Medlemmar kan bläddra bland vilka andra som spelar på din anläggning, följa varandra, och organisera egna matcher och umgängen, allt förankrat till din anläggning."
