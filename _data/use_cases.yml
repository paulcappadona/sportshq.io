# Per-locale translated copy for /use-cases/ detail pages.
# Structure: one entry per locale id, with a nested map per use case.
# Missing keys fall back to the English defaults baked into
# _includes/use-cases/<case>-body.html — locales not listed here
# (en-AU, en-CA, en-GB, en-IN, en-SG) use those English defaults directly.

- id: ar
  run_club:
    meta_title: "تطبيق نادي الجري — نظّم جريات المجموعة بسرعة | Sports HQ"
    meta_desc: "اجعل نادي الجري ينطلق أسرع: إشعارات فورية وتأكيد حضور بلمسة واحدة دون فوضى مجموعات الدردشة للجريات العفوية وفي اللحظة الأخيرة. مجاني على iOS وAndroid."
    crumb: "نوادي الجري"
    badge: "لنوادي الجري العفوية"
    title: "رسائل أقل. <span>جري أكثر.</span>"
    sub: "نادي الجري الخاص بك لا يسير وفق جدول ثابت — بل يعتمد على من هو متاح هذا المساء. يستبدل Sports HQ الدردشة الجماعية التي لا تنتهي بإشعارات فورية وتأكيدات بلمسة واحدة، لتقضي وقتاً أقل في التنسيق ووقتاً أكثر في الجري."
    intro: "تنظم نادي جري، أو مجموعة تدريب، أو أي نشاط جماعي يُقترح في اللحظة الأخيرة بدلاً من التخطيط له قبل أسابيع — وقد سئمت من كتابة \"من سيأتي الليلة؟\" في دردشة جماعية."
    row1_tag: "تواصل مركزي"
    row1_title: "فعالية واحدة، مجموعة واحدة، بلا ضجيج"
    row1_body: "أنشئ نادي الجري كفعالية في Sports HQ مرة واحدة، وأضف مجموعتك. من تلك اللحظة، كل نشاط وتحديث وتذكير يمر عبر التطبيق — وليس عبر ثلاث محادثات مختلفة."
    row1_li1: "أعدّه مرة واحدة؛ استخدمه لكل جري قادم"
    row1_li2: "يعمل بنفس الكفاءة لأي رياضة أو نشاط، وليس الجري فقط"
    row1_li3: "أضف الأعضاء برابط في الدردشة الجماعية، أو رمز QR على ورقة تسجيل — أيهما أسهل"
    row2_tag: "إشعارات فورية"
    row2_title: "اقترح جري الليلة، وأخبر الجميع فوراً"
    row2_body: "يمكن لأي عضو إنشاء نشاط للمجموعة — اقتراح تاريخ ووقت ومسار، ويحصل كل عضو على إشعار فوري مباشرة. لا عوائق إدارية، ولا انتظار حتى \"يرى\" أحدهم الرسالة."
    row2_step1_title: "شخص ما يقترح جرياً"
    row2_step1_body: "يمكن لأي عضو إنشاء النشاط — لا يجب أن يكون المنظم."
    row2_step2_title: "يتم إخطار الجميع في آنٍ واحد"
    row2_step2_body: "يُرسل إشعار فوري لحظة إنشاء النشاط."
    row2_step3_title: "الردود تصل فوراً"
    row2_step3_body: "أكّد أو ارفض بلمسة واحدة — دون الحاجة للكتابة."
    row3_tag: "تأكيد فوري"
    row3_title: "اعرف من سيجري قبل أن تغادر المنزل"
    row3_body: "شاهد الحضور المباشر لجري الليلة — من أكّد، من رفض، ومن لم يرد بعد — دون إرسال رسالة متابعة واحدة."
    row3_li1: "التأكيد/الرفض بلمسة واحدة يلغي التواصل ذهاباً وإياباً تماماً"
    row3_li2: "يقلل العبء الإداري لتركز المجموعة على التدريب"
    row3_li3: "نفس الآلية تعمل لأي رياضة أو نشاط يُدار في Sports HQ"
    download_headline: "وقت أقل في التنظيم، <span class=\"download__accent\">وقت أكثر في الجري.</span>"
    download_sub: "حمّل Sports HQ مجاناً ونظّم جري الليلة في ثوانٍ."
  venue_owners:
    meta_title: "تطبيق مجتمع الملاعب — تسجيل QR وفعاليات | Sports HQ"
    meta_desc: "حوّل رواد ملعبك إلى مجتمع. تسجيل برمز QR، واكتشاف الأعضاء، وفعاليات متكررة، وقائمة بالأعضاء المنتظمين للملاعب والمنشآت الرياضية."
    crumb: "أصحاب الملاعب"
    badge: "لأصحاب الملاعب والمنشآت"
    title: "حوّل الرواد إلى <span>مجتمع.</span>"
    sub: "تدير نادي تنس، أو صالة تسلق، أو مجمعاً متعدد الملاعب، أو ملعباً مجتمعياً — وتعلم أن أعضاءك سيلعبون أكثر، ويبقون لفترة أطول، لو تعارفوا على بعضهم. يمنح Sports HQ كل منشأة طبقة مجتمعية مدمجة: تسجيل، اكتشاف، جدولة، وتواصل، كل ذلك في تطبيق واحد."
    cta_primary: "سجّل ملعبك"
    intro: "تملك أو تدير منشأة أو مجمعاً أو ملعباً — نادي تنس، صالة رياضية، قاعة رياضية، مركز تسلق، أو ملعب مجتمعي — وتريد بناء مجتمع نشط ومتكرر من الرواد بدلاً من حجوزات مجهولة لمرة واحدة."
    row1_tag: "انضمام سلس"
    row1_title: "تسجيل في ثوانٍ، لا أوراق"
    row1_body: "تحصل كل منشأة على رمز QR ورابط قابل للمشاركة لنفس صفحة التسجيل — استخدم ما يناسب الوسيلة. اطبع رمز QR للاستقبال، أو لوحة الإعلانات، أو جانب الملعب؛ شارك الرابط مباشرة في مجموعة واتساب، بريد إلكتروني، أو منشور. في الحالتين، يصل الرواد لنفس الصفحة ويسجلون في ثوانٍ."
    row1_li1: "رمز QR للطباعة — ملصقات، لافتات على الطاولات، لافتات جانب الملعب"
    row1_li2: "رابط للاستخدام الرقمي — واتساب، بريد إلكتروني، مواقع التواصل، موقعك"
    row1_li3: "يظهر الأعضاء الجدد تلقائياً في قائمة الأعضاء المسجلين، بغض النظر عن طريقة انضمامهم"
    row2_tag: "الاكتشاف"
    row2_title: "اكتُشف من قِبل رياضيين قريبين بالفعل"
    row2_body: "يُظهر Sports HQ منشأتك للرياضيين الذين يبحثون على الخريطة عن مكان للعب. كل عضو تضمه، وكل فعالية تستضيفها، تزيد من ظهور منشأتك أمام رواد جدد في منطقتك."
    row2_li1: "اظهر في نتائج البحث حسب الموقع لرياضتك ومنطقتك"
    row2_li2: "اعرض المرافق — الملاعب، الدشات، الخزائن، مواقف السيارات — على صفحة منشأتك"
    row2_li3: "الفعاليات المستضافة في منشأتك قابلة للاكتشاف بشكل مستقل، ما يجلب حضوراً لم يزورك من قبل"
    row3_tag: "بناء المجتمع"
    row3_title: "دع أعضاءك يجدون بعضهم البعض"
    row3_body: "قائمة الأعضاء ليست مجرد أداة إدارية — إنها أساس المجتمع. يمكن للأعضاء تصفح من يلعب أيضاً في منشأتك، متابعة بعضهم البعض، وتنظيم مبارياتهم ولقاءاتهم الخاصة، كلها مرتبطة بمنشأتك."
    row3_li1: "دليل قابل للبحث لأعضاء المنشأة المسجلين"
    row3_li2: "يمكن للأعضاء المراسلة والمتابعة والتواصل مباشرة داخل التطبيق"
    row3_li3: "يعزز الزيارات المتكررة والنمو العضوي عبر التوصية الشفهية"
    row4_tag: "فعاليات معتمدة"
    row4_title: "استضف الفعاليات التي تجعل الناس يعودون"
    row4_body: "أقم لقاءً اجتماعياً أسبوعياً للأعضاء، أو دوري يوم الأحد، أو بطولة شهرية — أنشئها مرة واحدة كجدول متكرر ودع Sports HQ يولّد كل نسخة مستقبلية تلقائياً."
    row4_step1_title: "أنشئ الجدول المتكرر"
    row4_step1_body: "حدد اليوم والوقت وعدد الأسابيع المسبقة لتوليد النسخ."
    row4_step2_title: "الأعضاء يؤكدون أو يرفضون"
    row4_step2_body: "تُرسل الإشعارات الفورية تلقائياً مع اقتراب كل نسخة."
    row4_step3_title: "قوائم الانتظار تملأ الفجوات في اللحظة الأخيرة"
    row4_step3_body: "إذا انسحب عضو مؤكد، يُخطر الشخص التالي في القائمة فوراً."
    download_headline: "ضع ملعبك على <span class=\"download__accent\">الخريطة.</span>"
    download_sub: "انضم إلى أصحاب الملاعب الذين يستخدمون Sports HQ بالفعل لتحويل الرواد العرضيين إلى مجتمع نشط ومخلص."
  office_sports_organizer:
    meta_title: "تطبيق دوري رياضي للموظفين — جدولة وتأكيد حضور | Sports HQ"
    meta_desc: "أدِر دوري شركتك الرياضي دون جداول البيانات: تسجيل سهل، وجدولة متكررة، وتأكيد الحضور، وقوائم اللاعبين وقوائم الانتظار في تطبيق مجاني واحد."
    crumb: "منظمو الرياضة في مكان العمل"
    badge: "لمنظمي الرياضة في مكان العمل"
    title: "توقف عن مطاردة الردود على <span>Slack.</span>"
    sub: "تطوعت لتنظيم كرة القدم في المكتب، أو جري الغداء، أو لقاء الجمعة الاجتماعي — وانتهى بك الأمر لإدارته عبر ثلاث دردشات جماعية وجدول بيانات. يمنحك Sports HQ مكاناً واحداً للجدولة والنشر ومتابعة الحضور، مع إشعارات فورية تقوم بالمطاردة نيابة عنك."
    intro: "أنت المنظم غير الرسمي لنشاط رياضي في العمل — جري الغداء، فريق كرة قدم، سلم بادمنتون، دوري كرة لينة — وقد سئمت من نشر الجلسات يدوياً ومتابعة الزملاء الذين لم يردوا."
    row1_tag: "تسجيل سهل"
    row1_title: "أشرك الفريق بأكمله بمسح واحد"
    row1_body: "انشر رابط انضمام في قناة Slack الخاصة بالفريق أو بريد الترحيب، أو اطبع رمز QR للوحة إعلانات المكتب — نفس صفحة التسجيل في الحالتين. ينضم الزملاء الجدد إلى فعاليتك فوراً، دون قوائم يدوية، ودون أسماء مفقودة."
    row1_li1: "رابط لـ Slack أو Teams أو البريد الإلكتروني — لمسة واحدة للانضمام من المكتب"
    row1_li2: "رمز QR للوحة الإعلانات أو حزمة الترحيب المطبوعة"
    row1_li3: "تُدار العضوية بالكامل داخل التطبيق — دون جدول بيانات منفصل"
    row2_tag: "جدولة مرنة"
    row2_title: "متكرر، لمرة واحدة، أو كلاهما"
    row2_body: "حدد موعداً أسبوعياً متكرراً للجلسة المعتادة، ثم أضف تواريخ يدوية لمرة واحدة للبطولات، أو اللقاءات الاجتماعية، أو تغييرات الجدول حول العطلات — كل ذلك من نفس الفعالية."
    row2_li1: "ولّد أسابيع من النسخ تلقائياً من جدول متجدد"
    row2_li2: "أضف أنشطة يدوية لمرة واحدة لا تتناسب مع النمط"
    row2_li3: "كل إنشاء أو تحديث يُطلق إشعاراً فورياً للفريق"
    row3_tag: "تتبع الحضور"
    row3_title: "اعرف من سيأتي، دون أن تسأل"
    row3_body: "شاهد التأكيدات والرفض تصل تلقائياً بينما يرد الزملاء على الإشعارات الفورية. لا مزيد من رسائل \"من سيأتي هذا الأسبوع؟\" — العدد أمامك مباشرة."
    row3_step1_title: "النشاط ينشر مباشرة"
    row3_step1_body: "يحصل كل عضو على إشعار فوري لحظة جدولة الجلسة أو تحديثها."
    row3_step2_title: "التأكيدات تصل"
    row3_step2_body: "ترى عداداً مباشراً وقائمة بمن أكّد أو رفض أو ما زال معلقاً."
    row3_step3_title: "تابع بلمسة واحدة"
    row3_step3_body: "أرسل إشعار تذكير لكل من ما زال معلقاً — مباشرة من التطبيق."
    row4_tag: "قوائم الانتظار"
    row4_title: "الجلسات الممتلئة تدير نفسها"
    row4_body: "حدد سعة قصوى لكرة القدم أو حجز الملعب. بمجرد امتلائها، تنضم التسجيلات الجديدة تلقائياً لقائمة انتظار — وتتقدم لحظة انسحاب أحدهم."
    row4_li1: "لا مزيد من الحجوزات المزدوجة أو الجدال حول من لديه مكان"
    row4_li2: "يُخطر أعضاء قائمة الانتظار فوراً عند توفر مكان"
    row4_li3: "يعمل تلقائياً عبر كل نسخة متكررة"
    download_headline: "أدر فريقك دون <span class=\"download__accent\">جدول البيانات.</span>"
    download_sub: "حمّل Sports HQ مجاناً وجدول جلستك القادمة في دقائق."
  social_sports_group:
    meta_title: "تطبيق مجموعة رياضية اجتماعية — الأعضاء والحضور | Sports HQ"
    meta_desc: "أدِر مجموعة رياضية كبيرة دون فوضى: فعاليات عامة أو خاصة، وروابط انضمام، وحدّ للاعبين، وقوائم انتظار، وتأكيد حضور، وتذكيرات تلقائية."
    crumb: "مجموعات رياضية اجتماعية"
    badge: "لمجموعات رياضية اجتماعية كبيرة"
    title: "مجموعة كبيرة، بلا <span>فوضى.</span>"
    sub: "بمجرد أن تتجاوز مجموعة رياضية اجتماعية بضع عشرات من الأعضاء، تتوقف الدردشات الجماعية عن العمل — تُدفن الرسائل، ولا يعرف الأعضاء الجدد كيفية الانضمام، ولا أحد متأكد ممن سيحضر فعلياً. يمنح Sports HQ مجموعتك هيكلية: عضوية مضبوطة، جلسات محدودة العدد، وتذكيرات تلقائية."
    intro: "تدير مجموعة رياضية نمت لتتجاوز ما يمكن أن تواكبه دردشة جماعية — فريق كرة قدم اجتماعي، مجموعة تاتش رجبي، دوري نت بول، لقاء تسلق — مع عشرات أو مئات الأعضاء عبر عدة جلسات منتظمة."
    row1_tag: "التحكم بالعضوية"
    row1_title: "عام، خاص، أو شيء بينهما"
    row1_body: "أنشئ نشاط مجموعتك كقالب فعالية. اجعلها عامة وقابلة للاكتشاف للنمو العضوي، أو خاصة بحيث تكون العضوية مضبوطة بالكامل — مرئية فقط لمن تسمح لهم بالدخول."
    row1_li1: "الفعاليات الخاصة مخفية تماماً عن البحث والاكتشاف"
    row1_li2: "تُضبط إعدادات الأمان والعضوية لكل فعالية على حدة"
    row1_li3: "حوّل مجموعة من دعوة فقط إلى نمو مفتوح عندما تكون مستعداً"
    row2_tag: "انضمام بلا جهد"
    row2_title: "رابط واحد يقوم بكل العمل"
    row2_body: "شارك رابطاً واحداً في مجموعة واتساب، أو توقيع بريد إلكتروني، أو منشور — أو اطبع رمز QR المطابق للملصقات ولوحات الإعلانات. كلاهما يوصل عضواً جديداً لنفس صفحة الانضمام بلمسة أو مسح واحد."
    row2_li1: "لا مزيد من شرح \"كيف أنضم\" لكل عضو جديد"
    row2_li2: "اختر رابطاً أو رمز QR حسب مكان استقطابك"
    row2_li3: "يعمل سواء كان لدى المستلم Sports HQ بالفعل أم لا"
    row3_tag: "الجدولة بطريقتك"
    row3_title: "تحكم يدوي، وراحة التكرار"
    row3_body: "جدول الأنشطة يدوياً للجلسات العفوية، أو حدد نمطاً متكرراً لمباراتك الأسبوعية المعتادة — وتنقل بين الاثنين حسب ما يتطلبه جدول مجموعتك."
    row3_li1: "تصل الإشعارات الفورية لكل عضو لحظة إنشاء الجلسة أو تغييرها"
    row3_li2: "يؤكد الأعضاء أو يرفضون الحضور بلمسة واحدة"
    row3_li3: "تُرسل التذكيرات تلقائياً مع اقتراب الجلسة"
    row4_tag: "السعة وقوائم الانتظار"
    row4_title: "حدد حجم المجموعة دون رفض أحد"
    row4_body: "حدد عدداً أقصى من الحضور يتناسب مع سعة ملعبك أو منشأتك. بمجرد امتلاء الجلسة، تنضم التسجيلات الجديدة تلقائياً لقائمة انتظار بدلاً من ضياعها."
    row4_step1_title: "حدد الحجم الأقصى لمجموعتك"
    row4_step1_body: "تتوقف الجلسات عن قبول التأكيدات بمجرد بلوغ الحد الأقصى."
    row4_step2_title: "التسجيلات الإضافية تنضم لقائمة الانتظار"
    row4_step2_body: "لا يُرفض أحد مباشرة — بل يُصفّون تلقائياً."
    row4_step3_title: "الأماكن تُملأ من تلقاء نفسها"
    row4_step3_body: "عندما يرفض عضو مؤكد، يُخطر العضو التالي في قائمة الانتظار فوراً."
    download_headline: "أعد النظام إلى <span class=\"download__accent\">مجموعة كبيرة.</span>"
    download_sub: "حمّل Sports HQ مجاناً وامنح مجموعتك الرياضية الاجتماعية الهيكلية التي تجاوزتها الدردشة الجماعية."
  communal_field_community:
    meta_title: "مجتمع ملعب الحي — رمز QR أو رابط | Sports HQ"
    meta_desc: "حوّل حديقة أو ملعباً مشتركاً إلى مجتمع محلي. تسجيل برمز QR أو رابط، وبحث عن القريبين، وطريقة سهلة ليجد اللاعبون المنتظمون بعضهم."
    crumb: "مجتمعات الملاعب المشتركة"
    badge: "لمجتمعات الملاعب والمنشآت المشتركة"
    title: "نفس الملعب. نفس الوجوه. <span>الآن مجتمع.</span>"
    sub: "أنت وبعض الرياضيين المعتادين تشاركون نفس الملعب العام، أو ملعب الحديقة، أو الملعب المجتمعي — لكنكم لم تلتقوا فعلياً بكل من يلعب هناك. يحوّل Sports HQ ذلك الفضاء المشترك إلى مجتمع حقيقي ومنظم، دون الحاجة لامتلاك المنشأة."
    intro: "تلعب بانتظام في نفس الملعب أو الحديقة المجتمعية — ولا تحتاج لامتلاك المنشأة لبناء مجتمع هناك. تحتاج فقط لطريقة يجد بها من يحضر بعضهم البعض."
    row1_tag: "ابدأ"
    row1_title: "أنشئ فعاليتك، ثم اختر كيفية مشاركتها"
    row1_body: "أنشئ فعاليتك في Sports HQ وتحصل على رمز QR ورابط انضمام لنفس الصفحة. اطبع رمز QR واترك نسخة أو نسختين في الملعب — ملصقة على عمود سياج، أو مقعد، أو لوحة إعلانات — أو شارك الرابط في الدردشة الجماعية لمن لم يصل بعد."
    row1_li1: "لا حاجة لامتلاك المنشأة أو عملية تسجيل للبدء"
    row1_li2: "رمز QR للملعب نفسه؛ رابط للدردشة الجماعية — استخدم أحدهما، أو كليهما"
    row1_li3: "ينضم اللاعبون الجدد لحظة المسح أو النقر — دون انتظار مسؤول"
    row2_tag: "قابلية الاكتشاف"
    row2_title: "اكتُشف من قِبل أي شخص يبحث بالقرب"
    row2_body: "بخلاف رمز QR، فعاليتك قابلة للاكتشاف عبر البحث حسب الموقع — بحيث يمكن لعدّاء أو لاعب كرة قدم أو كرة سلة يمر بالمنطقة أن يجد مجتمعك ويأتي للعب."
    row2_li1: "اظهر في نتائج بحث الخريطة لرياضتك وموقعك"
    row2_li2: "نمِّ عدد المعتادين لديك إلى ما هو أبعد ممن رأوا اللافتة صدفة"
    row2_li3: "يعمل جنباً إلى جنب مع رمز QR، وليس بدلاً منه"
    row3_tag: "مجتمع حقيقي"
    row3_title: "ضع أسماء للوجوه التي تراها كل أسبوع"
    row3_body: "بمجرد تسجيل الناس في فعالية ملعبك، يمكنهم تصفح ملفات بعضهم البعض، ومتابعة المعتادين، والمراسلة مباشرة — محوّلين \"الأشخاص الذين يلعبون في الحديقة\" إلى شبكة حقيقية."
    row3_li1: "دليل الأعضاء يعرض كل من سجّل في الفعالية"
    row3_li2: "المراسلة المدمجة تلغي الحاجة لدردشة جماعية منفصلة"
    row3_li3: "يشجع الناس على تنظيم جلساتهم الخاصة بشكل مستقل"
    row4_tag: "التنسيق"
    row4_title: "تنسيق سهل للأنشطة، دون عبء إداري"
    row4_body: "جدول جرياً أسبوعياً متكرراً، أو أنشئ جلسات لمرة واحدة، أو دع أي عضو مؤكد يقترح نشاطاً جديداً — الحضور والتذكيرات والتحديثات كلها تُدار تلقائياً."
    row4_li1: "الجداول المتكررة تُبقي موعدك المعتاد قائماً دون صيانة يدوية"
    row4_li2: "الإشعارات الفورية تخبر الجميع عن الجلسات الجديدة أو التغييرات فوراً"
    row4_li3: "التأكيد/الرفض بلمسة واحدة يحافظ على دقة العدد"
    download_headline: "ابنِ مجتمعاً حول <span class=\"download__accent\">ملعبك.</span>"
    download_sub: "حمّل Sports HQ مجاناً، أنشئ فعاليتك، واطبع رمز QR الأول اليوم."

  safe_group_runs:
    meta_title: "جري جماعي أكثر أماناً للنساء | Sports HQ"
    meta_desc: "تفضّلين ألا تجري وحدك؟ أنشئي فعالية مع شركاء جري موثوقين، واجعليها خاصة إن أردتِ، وشاهدي من أكّد حضوره، وشاركي موقعك المباشر إن رغبتِ."
    crumb: "جري جماعي أكثر أماناً"
    badge: "للنساء ولكل من يفضل عدم الجري بمفرده"
    title: "جري جماعي أكثر أماناً <span>مع أشخاص تثق بهم</span>"
    sub: "يجب أن يمنحك الجري شعوراً بالحرية لا بالخوف. لا يجب أن تغيّر روتينك بسبب التحرش — لكن إن كنت تفضل رفقة في جري الصباح الباكر، أو المساء، أو المسارات الهادئة، يساعدك Sports HQ على إنشاء فعالية مع الأصدقاء والعائلة وشركاء الجري الذين تثق بهم، وتحديدها كخاصة إذا أردت أن تبقى بينكم فقط، ورؤية من أكّد حضوره بالضبط قبل أن تغادر المنزل."
    sub2: "سواء ركضوا بجانبك أو رافقوك على دراجة، ستعرف متى التزم شخص تثق به بالانضمام إليك."
    cta_primary: "أنشئ فعالية الجري الخاصة بك"
    cta_secondary: "شاهد كيف يعمل الجري الجماعي"
    intro: "تفضل ألا تجري بمفردك — خاصة في الصباح الباكر، أو بعد حلول الظلام، أو على مسارات هادئة — لكن جداول شركائك في الجري لا تتوافق أبداً. ينسّق Sports HQ بينك وبين أشخاص تعرفهم وتثق بهم بالفعل، ويتيح لك مشاركة موقعك المباشر أثناء النشاط إن اخترت ذلك؛ وهو ليس خدمة طوارئ ولا ضماناً للسلامة."
    row1_tag: "دائرتك الموثوقة"
    row1_title: "فعالية مبنية حول الأشخاص الذين تثق بهم بالفعل، جاهزة متى احتجتها"
    row1_body: "أنشئ فعالية للأشخاص الذين ترغب فعلاً بوجودهم بجانبك أثناء الجري — شركاء تدريب، أصدقاء، عائلة، أو شخص يرافقك على دراجة كرفقة، تماماً كما يفعل شريك إحدى العدّاءات في جولد كوست عندما لا يستطيع الجري معها بنفسه. أضفهم كأعضاء، وحدّد الفعالية كخاصة إن أردت أن تبقى ضمن دائرتك فقط، وستكون جاهزة لإعادة استخدامها في كل جري قادم."
    row1_li1: "حدّد فعاليتك كخاصة إذا أردت أن تكون مرئية فقط للأعضاء الذين تدعوهم"
    row1_li2: "أضف أعضاء برابط أو رمز QR، دون الحاجة لإعداد حساب منفصل"
    row1_li3: "يناسب شريك جري واحد أو مجموعة حي كاملة"
    row2_tag: "تأكيدات فورية"
    row2_title: "هل يوجد من هو متاح لجريتك القادمة؟ اكتشف ذلك خلال ثوانٍ"
    row2_body: "اقترح جرية وسيتم إشعار دائرتك بالكامل فوراً. ومع ورود الردود، تشاهدها تتحدث لحظياً — دون ملاحقة أحد للرد، ودون مغادرة المنزل دون معرفة من سينضم إليك، إن وُجد."
    row2_step1_title: "اقترح جريتك القادمة"
    row2_step1_body: "حدّد الوقت ونقطة اللقاء والمسار — يمكن لأي عضو فعل ذلك."
    row2_step2_title: "يتم إشعار دائرتك فوراً"
    row2_step2_body: "يصل إشعار فوري للجميع لحظة نشره."
    row2_step3_title: "تتوارد التأكيدات لحظياً"
    row2_step3_body: "شاهد من سيحضر ومن لن يحضر يتحدّث لحظياً حتى لحظة مغادرتك."
    row3_tag: "عدد الحضور المباشر"
    row3_title: "اعرف من سيحضر، وكم عددهم، قبل أن تلتزم"
    row3_body: "إجمالي مباشر للمؤكدين والمعتذرين يعني أنك لست في حيرة. سواء كنت تخرج عند الفجر أو بعد الغروب، يمكنك أن ترى بلمحة إن كان الحضور كاملاً، أو شريكاً واحداً، أو لا أحد بعد — لتقرر ما تفعله بعد ذلك."
    row3_li1: "تأكيد أو اعتذار بلمسة واحدة — دون رسائل متبادلة"
    row3_li2: "عدد حضور مباشر يساعدك على اتخاذ قرار مدروس قبل المغادرة"
    row3_li3: "أعد استخدام الفعالية نفسها في كل جرية قادمة — دون الحاجة للبدء من جديد"
    row4_tag: "مشاركة الموقع المباشر"
    row4_title: "شارك موقعك المباشر مع من تثق بهم، خلال الجري فقط"
    row4_body: "ابدأ المشاركة من النشاط واختر من يمكنه متابعتك: المشاركون المؤكدون فيه، أو جهات اتصال آمنة قبلت طلبك. المشاركة متاحة فقط حول وقت النشاط، ويمكنك إيقافها في أي وقت، وهي ليست خدمة طوارئ."
    row4_li1: "اختر المشاركين المؤكدين أو جهات الاتصال الآمنة التي قبلت طلبك"
    row4_li2: "متاحة من ساعة قبل بدء النشاط حتى انتهائه"
    row4_li3: "أوقفها متى شئت؛ وتنتهي أيضاً عند انتهاء هذه المدة"
    row4_alt: "ورقة مشاركة الموقع المباشر في Sports HQ مع خيارات الجمهور للمشاركين المؤكدين أو جهات الاتصال الآمنة"
    faq_tag: "أسئلة شائعة"
    faq_title: "أسئلة حول الجري الجماعي"
    faq1_q: "كيف يساعدني Sports HQ على تنظيم جري جماعي أكثر أماناً؟"
    faq1_a: "أنشئ فعالية مع الأشخاص الذين تعرفهم وتثق بهم بالفعل، وحدّدها كخاصة إن أردت أن تبقى بينكم فقط، واقترح وقتاً ومساراً لجريتك القادمة، وشاهد لحظياً من أكّد حضوره قبل أن تخرج."
    faq2_q: "هل يمكنني تحديد فعالية الجري الخاصة بي كخاصة؟"
    faq2_a: "نعم. الفعاليات عامة بشكل افتراضي، لكن يمكنك تحديد فعاليتك كخاصة في أي وقت بحيث يراها وينضم إليها فقط الأعضاء الذين تدعوهم."
    faq3_q: "ماذا يحدث إن لم يؤكد أحد؟"
    faq3_a: "سترى ذلك بوضوح قبل أن تخرج، لتقرر ما إذا كنت ستنتظر، أو تدعو أحداً مباشرة، أو تختار وقتاً أو مساراً مختلفاً. لا يستطيع Sports HQ ضمان وجود شخص متاح للانضمام إليك دائماً."
    faq4_q: "هل يمكن لصديق مرافقتي بالدراجة بدلاً من الجري؟"
    faq4_a: "نعم. يمكن لأي عضو في فعاليتك تأكيد حضوره للجري، سواء كان سيجري بجانبك أو يرافقك بدراجة كرفقة وعين إضافية."
    faq5_q: "هل يوفّر Sports HQ مشاركة الموقع المباشر، وهل هو خدمة طوارئ؟"
    faq5_a: "نعم للأول، ولا للثاني. أثناء النشاط يمكنك اختيار مشاركة موقعك المباشر مع المشاركين المؤكدين أو مع جهات اتصال آمنة قبلت طلبك، ويمكنك الإيقاف في أي وقت. المشاركة متاحة فقط حول وقت النشاط — من ساعة قبل بدايته حتى نهايته — وتتوقف عند الضغط على «إيقاف» أو انتهاء تلك المدة. لا يتصل Sports HQ بخدمات الطوارئ ولا يرسل تنبيهات طوارئ ولا يضمن سلامة أحد؛ احتفظ بميزات الطوارئ في هاتفك أو بخدمة سلامة مخصصة في متناول يدك إذا احتجت إليها."
    download_headline: "اعرف من أكّد حضوره، <span class=\"download__accent\">قبل أن تغادر المنزل.</span>"
    download_sub: "حمّل Sports HQ مجاناً وابنِ دائرة جري موثوقة يمكنك الاعتماد عليها."
  youth_sports:
    badge: "لأندية الناشئين والمدربين والأهالي"
    title: "رياضة الناشئين، <span>بموافقة الأهل.</span>"
    sub: "إدارة فريق ناشئين تعني التوفيق بين الأهالي والموافقات والتغييرات في اللحظة الأخيرة عبر عشرات الدردشات. مع Sports HQ يدير الأولياء عضويات أطفالهم في الفعاليات وحضورهم، بينما يحتفظ المدربون بالجداول والحضور في مكان واحد."
    intro: "أنت مدرب أو مدير أو متطوع في نادٍ للناشئين أو فريق مدرسي أو أكاديمية نهاية الأسبوع، وتريد إبقاء الأهالي على اطلاع، وأن يدير شخص بالغ ملفات الأطفال، ومعرفة من سيحضر التدريب بسهولة."
    row1_tag: "حسابات الأولياء"
    row1_title: "يحتفظ الأهل بالتحكم في ملف أطفالهم"
    row1_body: "تتيح حسابات الأولياء لأحد الوالدين أو القائمين على الرعاية إدارة عضويات القاصر في الفعاليات وحضوره للأنشطة، وتلقي التنبيهات نيابةً عنه. الأطفال يلعبون؛ والكبار يبقون على اطلاع."
    row1_li1: "حساب ولي أمر واحد يدير ملف الناشئ"
    row1_li2: "طلبات العضوية في رياضة الناشئين يديرها ولي الأمر"
    row1_li3: "تساعد فلاتر العمر على إبقاء الفعاليات مناسبة للفئة العمرية"
    row2_tag: "مسارات الموافقة"
    row2_title: "تحكّم فيمن ينضم إلى فريق الناشئين"
    row2_body: "اجعل فريقك أو جلستك خاصة وراجع كل طلب انضمام. شارك رابطاً أو رمز QR في النادي أو عند بوابة المدرسة، ثم وافق على العائلات التي تتوقعها."
    row2_step1_title: "شارك رابطك أو رمز QR"
    row2_step1_body: "اطبعه للنادي أو أرسله إلى مجموعة الأهالي."
    row2_step2_title: "تطلب العائلات الانضمام"
    row2_step2_body: "يقدّم الأولياء طلبات العضوية نيابةً عن أطفالهم."
    row2_step3_title: "أنت توافق على من ينضم"
    row2_step3_body: "يراجع المشرفون الطلبات ويبقون قائمة الفريق تحت السيطرة."
    row3_tag: "يوم التدريب بكل سهولة"
    row3_title: "اعرف من سيحضر التدريب قبل أن تتوجه إلى الملعب"
    row3_body: "تُنشأ الجلسات المتكررة تلقائياً من قالبك. يؤكد الأهالي أو يعتذرون بلمسة، وتتولى قوائم الانتظار الفرق الممتلئة، وتغني ألوان الفريق عن توزيع السترات."
    row3_li1: "تدريبات أسبوعية وأيام مباريات متكررة"
    row3_li2: "حدود السعة وقوائم الانتظار للفرق والدورات"
    row3_li3: "تعيين اختياري لألوان الفريق دون الحاجة إلى سترات"
    faq_tag: "الأسئلة الشائعة"
    faq_title: "أسئلة حول رياضة الناشئين على Sports HQ"
    faq1_q: "كيف يدير الأهالي ملف طفلهم على Sports HQ؟"
    faq1_a: "يضيف الأهالي والقائمون على الرعاية طفلهم إلى حسابهم الخاص، ثم يستطيعون إدارة عضوياته في الفعاليات وحضوره للأنشطة وتلقي التنبيهات نيابةً عنه. الطفل المضاف بهذه الطريقة لا يظهر للمستخدمين الآخرين، إلا في الفعاليات والأنشطة التي سجّله فيها ولي أمر."
    faq2_q: "هل يمكنني الموافقة على من ينضم إلى فريق الناشئين؟"
    faq2_a: "نعم. اجعل فعاليتك خاصة وراجع طلبات العضوية قبل انضمام أي أحد. في رياضة الناشئين، يدير ولي أمر الطفل الطلبات."
    faq3_q: "هل يمكن للمدربين والأهالي الدردشة في التطبيق؟"
    faq3_a: "نعم. يمكنك تفعيل دردشة اختيارية لأي فعالية أو نشاط أو ملعب، ويتحكم المشرفون فيمن يمكنه النشر ومشاركة الصور."
    faq4_q: "هل Sports HQ مناسب للأطفال؟"
    faq4_a: "يوفر Sports HQ حسابات أولياء وفلاتر عمر وفعاليات خاصة لمساعدة العائلات على اللعب بأمان. وكما هو الحال مع أي تطبيق، ننصح الأهالي بمتابعة الملفات والمجموعات التي ينضم إليها أطفالهم."
    download_headline: "نماذج أقل. <span class=\"download__accent\">تدريب أكثر.</span>"
    download_sub: "حمّل Sports HQ مجاناً واجمع الأهالي واللاعبين والمدربين في مكان واحد."
    alt1: "شاشة تفاصيل فعالية في Sports HQ تعرض الأعضاء والجلسات القادمة"
    alt2: "شاشات Sports HQ لمشاركة فعالية عبر رابط دعوة أو رمز QR"
    alt3: "إعدادات خصوصية فعالية في Sports HQ مع فعالية خاصة وقيود الانضمام"
    alt4: "إعدادات جدول الجلسات المتكررة في Sports HQ"
  fill_the_last_spot:
    meta_title: "ابحث عن لاعب بديل بسرعة — املأ كل مكان | Sports HQ"
    meta_desc: "ينقصك لاعب؟ تنبيهات «نحتاج لاعباً» وتذكيرات لمن لم يردّوا وقوائم انتظار تساعد مباراتك أو دوريك على ملء كل مكان."
    badge: "للمنظمين الذين يكرهون إلغاء المباريات"
    title: "ينقصك لاعب؟ <span>املأ كل مقعد.</span>"
    sub: "لا شيء يفسد مباراة أسبوعية مثل انسحاب في اللحظة الأخيرة. يمكن لـ Sports HQ تذكير الأعضاء الذين لم يردّوا، وإرسال تنبيهات «نحتاج لاعباً واحداً»، وإخطار الشخص التالي في قائمة الانتظار عند توفر مقعد — للمساعدة في أن تصل مباراة العشرة إلى عشرة."
    intro: "تنظّم كل أسبوع مباراة كرة قدم ودية أو ليلة كرة طائرة أو سلّم بيكلبول أو فريقاً في دوري، وتجد نفسك تبحث عن بديل قبل ساعة من البداية."
    row1_tag: "تنبيهات النشاط الذكية"
    row1_title: "فعّل التنبيهات ودع التطبيق يتولى المتابعة"
    row1_body: "فعّل تنبيهات النشاط الذكية لأي فعالية. يرسل Sports HQ تنبيهات «نحتاج لاعباً واحداً» وبدلاء اللحظة الأخيرة، إضافةً إلى تذكيرات تلقائية للأعضاء الذين لم يردّوا."
    row1_li1: "تنبيهات «نحتاج لاعباً» وبدلاء اللحظة الأخيرة"
    row1_li2: "تذكيرات تلقائية للأعضاء الذين لم يردّوا"
    row1_li3: "يمكن للاعبين إيقاف التنبيهات للفعاليات التي لا يشاركون فيها"
    row2_tag: "الوصول إلى اللاعبين القريبين"
    row2_title: "تجاوز مجموعتك عند الحاجة"
    row2_body: "نبّه أعضاءك فقط، أو صل إلى لاعبين قريبين يناسبون الرياضة والمستوى والتوفر الذي تحتاجه. سدّ الفراغ بمن يريد اللعب فعلاً."
    row2_step1_title: "اختر من تنبّهه"
    row2_step1_body: "أعضاؤك فقط، أو اللاعبون القريبون المناسبون."
    row2_step2_title: "يُخطر اللاعبون المناسبون"
    row2_step2_body: "تؤخذ الرياضة والمستوى والتوفر في الاعتبار."
    row2_step3_title: "أكّد بلمسة"
    row2_step3_body: "يُملأ المقعد ويتحدّث العدد مباشرةً."
    row3_tag: "قوائم الانتظار والموثوقية"
    row3_title: "بدلاء جاهزون ورؤية أوضح لمن سيحضر"
    row3_body: "عندما ينسحب لاعب مؤكَّد، يُخطر الشخص التالي في قائمة الانتظار. تُظهر تقييمات الزملاء وتتبع الحضور من يحضر بانتظام، فتعرف على من تعتمد."
    row3_li1: "تخطر قوائم الانتظار الشخص التالي عند توفر مقعد"
    row3_li2: "تتبع الحضور / الغياب عند تسجيل الوصول"
    row3_li3: "الموثوقية والالتزام باللطف والمواعيد في ملفات اللاعبين"
    faq_tag: "الأسئلة الشائعة"
    faq_title: "أسئلة حول إكمال عدد اللاعبين"
    faq1_q: "كيف أجد لاعباً بديلاً في وقت قصير؟"
    faq1_a: "فعّل تنبيهات النشاط الذكية لفعاليتك. يمكن لـ Sports HQ إرسال تنبيهات «نحتاج لاعباً واحداً» وبدلاء اللحظة الأخيرة إلى أعضائك أو إلى لاعبين قريبين يناسبون رياضتك ومستواك وتوفرك."
    faq2_q: "هل يستطيع Sports HQ تذكير من لم يردّوا؟"
    faq2_a: "نعم. تُرسل تذكيرات تلقائية إلى الأعضاء الذين لم يردّوا، فلا تحتاج إلى ملاحقتهم بنفسك."
    faq3_q: "ماذا يحدث عندما ينسحب أحدهم؟"
    faq3_a: "إذا كانت فعاليتك تحتوي على قائمة انتظار، يُخطر الشخص التالي فور توفر مقعد."
    faq4_q: "هل يمكن للاعبين إيقاف التنبيهات؟"
    faq4_a: "نعم. يمكن للاعبين إيقاف التنبيهات للفعاليات التي لا يشاركون فيها."
    faq5_q: "كيف أقلل من التغيّب؟"
    faq5_a: "حدّد من حضر ومن لم يحضر عند تسجيل الوصول، ودع الزملاء يقيّمون التزام بعضهم بالموثوقية والمواعيد. مع الوقت يُظهر ملف كل لاعب من يحضر بانتظام، فتعرف على من تعتمد في قائمتك. ثم تسدّ التذكيرات وقوائم الانتظار الفجوات."
    faq6_q: "كيف أجد بديلاً لدوريي أو فريقي؟"
    faq6_a: "أرسل تنبيه «نحتاج لاعباً واحداً» إلى أعضائك أولاً، أو وسّعه ليشمل لاعبين قريبين يناسبون رياضتك ومستواك وتوفرهم. أول من يؤكد يحصل على المقعد، ويتحدّث العدد مباشرةً."
    faq7_q: "لأي الرياضات يناسب هذا؟"
    faq7_a: "لأي رياضة من أكثر من 60 رياضة على Sports HQ، ومنها كرة القدم وكرة السلة والكرة الطائرة والبيكلبول والبادل والتنس والهوكي والرجبي والكريكيت. يناسب أكثر الألعاب ذات العدد المحدد من اللاعبين."
    download_headline: "ساعد كل مباراة على <span class=\"download__accent\">بلوغ عدد لاعبيها.</span>"
    download_sub: "حمّل Sports HQ مجاناً واملأ المقاعد بسهولة أكبر."
    alt1: "شاشة تفاصيل فعالية في Sports HQ تعرض الجلسات القادمة وأزرار التأكيد أو الرفض"
    alt2: "قائمة أعضاء نشاط في Sports HQ تعرض الأعضاء المؤكدين والمعلّقين وزر إرسال تذكير"
    alt3: "شاشة Sports HQ لجدولة جلسة"
    alt4: "شاشات Sports HQ تعرض تفاصيل الفعالية والجدول المتكرر ورمز QR للانضمام"

- id: de
  run_club:
    meta_title: "Lauftreff-App: spontane Gruppenläufe organisieren | Sports HQ"
    meta_desc: "Bring deinen Lauftreff schneller los: Sofort-Benachrichtigungen, Zusage mit einem Tipp, kein Chat-Chaos bei spontanen Läufen. Gratis für iOS und Android."
    crumb: "Lauftreffs"
    badge: "Für spontane Lauftreffs"
    title: "Weniger Tippen. <span>Mehr Laufen.</span>"
    sub: "Dein Lauftreff läuft nicht nach festem Zeitplan — er läuft danach, wer heute Abend Zeit hat. Sports HQ ersetzt den endlosen Gruppenchat durch sofortige Benachrichtigungen und Zusagen per Fingertipp, damit du weniger Zeit mit Koordinieren und mehr auf der Strecke verbringst."
    intro: "du einen Lauftreff, eine Trainingsgruppe oder eine Gruppenaktivität organisierst, die eher spontan vorgeschlagen als Wochen im Voraus geplant wird — und es satt hast, \"wer ist heute Abend dabei?\" in einen Gruppenchat zu tippen."
    row1_tag: "Zentralisierte Kommunikation"
    row1_title: "Ein Event, eine Crew, keine Unruhe"
    row1_body: "Lege deinen Lauftreff einmal als Event in Sports HQ an und füge deine Crew hinzu. Ab da läuft jede Aktivität, jedes Update und jede Erinnerung über die App — nicht über drei verschiedene Chatverläufe."
    row1_li1: "Einmal einrichten, für jeden zukünftigen Lauf wiederverwenden"
    row1_li2: "Funktioniert genauso gut für jeden Sport, nicht nur Laufen"
    row1_li3: "Mitglieder per Link im Gruppenchat oder QR-Code auf der Anmeldeliste hinzufügen — was gerade einfacher ist"
    row2_tag: "Sofortige Benachrichtigungen"
    row2_title: "Heutigen Lauf vorschlagen, alle sofort benachrichtigen"
    row2_body: "Jedes Mitglied kann eine Aktivität für die Crew anlegen — Datum, Uhrzeit und Strecke vorschlagen, und jeder bekommt sofort eine Push-Benachrichtigung. Kein Admin-Nadelöhr, kein Warten, bis jemand die Nachricht \"sieht\"."
    row2_step1_title: "Jemand schlägt einen Lauf vor"
    row2_step1_body: "Jedes Mitglied kann die Aktivität anlegen — muss nicht der Organisator sein."
    row2_step2_title: "Alle werden gleichzeitig benachrichtigt"
    row2_step2_body: "Sobald die Aktivität erstellt ist, geht eine Push-Benachrichtigung raus."
    row2_step3_title: "Antworten kommen sofort rein"
    row2_step3_body: "Per Fingertipp zusagen oder absagen — kein Tippen nötig."
    row3_tag: "Sofortige Bestätigung"
    row3_title: "Wisse, wer läuft, bevor du das Haus verlässt"
    row3_body: "Sieh die Teilnahme für den heutigen Lauf live — wer zugesagt hat, wer abgesagt hat und wer noch nicht geantwortet hat — ganz ohne eine einzige Nachfrage zu senden."
    row3_li1: "Zusagen/Absagen per Fingertipp beseitigt das Hin und Her komplett"
    row3_li2: "Minimiert den Aufwand, damit sich die Crew aufs Training konzentrieren kann"
    row3_li3: "Derselbe Ablauf funktioniert für jeden Sport, der in Sports HQ verwaltet wird"
    download_headline: "Weniger Zeit organisieren, <span class=\"download__accent\">mehr Zeit laufen.</span>"
    download_sub: "Lade Sports HQ kostenlos herunter und hab den heutigen Lauf in Sekunden organisiert."
  venue_owners:
    meta_title: "Sportstätten-Community-App: QR-Anmeldung & Events | Sports HQ"
    meta_desc: "Mach aus Gästen eine Community: QR-Anmeldung, Mitglieder entdecken, wiederkehrende Events und eine Stammspieler-Liste für Plätze, Hallen und Sportstätten."
    crumb: "Sportstättenbetreiber"
    badge: "Für Sportstätten- & Anlagenbetreiber"
    title: "Mach aus Gästen eine <span>Community.</span>"
    sub: "Du betreibst einen Tennisclub, ein Kletterzentrum, eine Mehrplatzanlage oder einen Gemeinschaftsplatz — und du weißt, dass deine Mitglieder öfter und länger spielen würden, wenn sie sich kennen würden. Sports HQ gibt jeder Sportstätte eine eingebaute Community-Ebene: Registrierung, Auffindbarkeit, Terminplanung und Kommunikation, alles in einer App."
    cta_primary: "Sportstätte registrieren"
    intro: "du eine Anlage, einen Komplex oder eine Sportstätte besitzt oder leitest — Tennisclub, Fitnessstudio, Sporthalle, Kletterzentrum oder Gemeinschaftsplatz — und eine aktive, wiederkehrende Community aus Gästen aufbauen willst, statt anonyme Einzelbuchungen."
    row1_tag: "Reibungslose Anmeldung"
    row1_title: "Registrierung in Sekunden, nicht in Papierkram"
    row1_body: "Jede Sportstätte bekommt sowohl einen QR-Code als auch einen teilbaren Link zur selben Registrierungsseite — nutze, was zum jeweiligen Medium passt. Drucke den QR-Code für die Rezeption, das Schwarze Brett oder den Platzrand; teile den Link direkt in einer WhatsApp-Gruppe, E-Mail oder einem Social-Post. So oder so landen Gäste auf derselben Seite und registrieren sich in Sekunden."
    row1_li1: "QR-Code zum Drucken — Poster, Aufsteller, Beschilderung am Platz"
    row1_li2: "Link für digital — WhatsApp, E-Mail, Social Media, deine Website"
    row1_li3: "Neue Mitglieder erscheinen automatisch in deiner Mitgliederliste, egal wie sie beigetreten sind"
    row2_tag: "Auffindbarkeit"
    row2_title: "Von Sportlern in der Nähe gefunden werden"
    row2_body: "Sports HQ zeigt deine Sportstätte Sportlern, die auf der Karte nach einem Ort zum Spielen suchen. Jedes neue Mitglied und jedes veranstaltete Event erhöht die Sichtbarkeit deiner Sportstätte für neue Gäste in deiner Umgebung."
    row2_li1: "In der standortbasierten Suche für deinen Sport und Bereich erscheinen"
    row2_li2: "Ausstattung präsentieren — Plätze, Duschen, Schließfächer, Parkplätze — auf deiner Seite"
    row2_li3: "Veranstaltete Events an deiner Sportstätte sind unabhängig auffindbar und bringen neue Besucher, die noch nie da waren"
    row3_tag: "Community-Aufbau"
    row3_title: "Lass deine Mitglieder einander finden"
    row3_body: "Eine Mitgliederliste ist nicht nur ein Verwaltungstool — sie ist die Grundlage einer Community. Mitglieder können sehen, wer sonst noch bei dir spielt, einander folgen und eigene Spiele und Treffen organisieren, alles an deine Anlage angebunden."
    row3_li1: "Durchsuchbares Verzeichnis registrierter Mitglieder der Sportstätte"
    row3_li2: "Mitglieder können direkt in der App chatten, folgen und sich vernetzen"
    row3_li3: "Fördert Stammgäste und organisches Wachstum durch Mundpropaganda"
    row4_tag: "Offizielle Events"
    row4_title: "Veranstalte Events, die Leute zurückbringen"
    row4_body: "Veranstalte ein wöchentliches Mitgliedertreffen, eine Sonntagsliga oder ein monatliches Turnier — einmal als wiederkehrenden Zeitplan anlegen und Sports HQ jede zukünftige Instanz automatisch generieren lassen."
    row4_step1_title: "Wiederkehrenden Zeitplan erstellen"
    row4_step1_body: "Lege Tag, Uhrzeit und fest, wie viele Wochen im Voraus Instanzen generiert werden sollen."
    row4_step2_title: "Mitglieder sagen zu oder ab"
    row4_step2_body: "Push-Benachrichtigungen gehen automatisch raus, sobald jede Instanz näher rückt."
    row4_step3_title: "Wartelisten füllen kurzfristige Lücken"
    row4_step3_body: "Sagt ein bestätigtes Mitglied ab, wird die nächste Person auf der Warteliste sofort benachrichtigt."
    download_headline: "Bring deine Sportstätte auf die <span class=\"download__accent\">Karte.</span>"
    download_sub: "Schließe dich Sportstättenbetreibern an, die mit Sports HQ aus Gelegenheitsgästen eine treue, aktive Community machen."
  office_sports_organizer:
    meta_title: "Firmensport-Liga-App: Zusagen & Terminplanung | Sports HQ"
    meta_desc: "Organisiere deine Firmensport-Liga ohne Excel-Tabelle: einfache Anmeldung, wiederkehrende Termine, Zusagen, Kader und Wartelisten in einer kostenlosen App."
    crumb: "Büro-Sportorganisatoren"
    badge: "Für Büro-Sportorganisatoren"
    title: "Schluss mit Zusagen hinterherjagen in <span>Slack.</span>"
    sub: "Du hast dich freiwillig gemeldet, das Büro-Fußball, den Mittagslauf oder das Freitagssocial zu organisieren — und irgendwie landest du bei drei Gruppenchats und einer Tabelle. Sports HQ gibt dir einen Ort zum Planen, Bewerben und Verfolgen der Teilnahme, während Push-Benachrichtigungen das Nachhaken für dich übernehmen."
    intro: "du der inoffizielle Organisator einer Sportaktivität im Büro bist — ein Mittagslauf, ein Fußballteam, eine Badminton-Rangliste, eine Softballliga — und es leid bist, Termine manuell zu bewerben und Kollegen hinterherzulaufen, die nicht geantwortet haben."
    row1_tag: "Einfache Registrierung"
    row1_title: "Das ganze Team mit einem Scan an Bord holen"
    row1_body: "Poste einen Beitrittslink im Team-Slack-Kanal oder der Willkommens-E-Mail, oder drucke den QR-Code fürs Schwarze Brett im Büro — beides führt zur selben Registrierungsseite. Neue Kollegen treten deinem Event sofort bei, keine manuelle Listenpflege, keine vergessenen Namen."
    row1_li1: "Link für Slack, Teams oder E-Mail — ein Fingertipp zum Beitreten vom Schreibtisch aus"
    row1_li2: "QR-Code fürs Schwarze Brett oder das gedruckte Willkommenspaket"
    row1_li3: "Mitgliedschaft wird komplett in der App verwaltet — keine separate Tabelle"
    row2_tag: "Flexible Terminplanung"
    row2_title: "Wiederkehrend, einmalig, oder beides"
    row2_body: "Lege einen wiederkehrenden wöchentlichen Termin für die reguläre Session fest, füge dann manuelle Einzeltermine für Turniere, Events oder Verschiebungen wegen Feiertagen hinzu — alles vom selben Event aus."
    row2_li1: "Wochen von Instanzen automatisch aus einem rollierenden Zeitplan generieren"
    row2_li2: "Manuelle Einzelaktivitäten einschieben, die nicht ins Muster passen"
    row2_li3: "Jede Erstellung oder Änderung löst eine Push-Benachrichtigung ans Team aus"
    row3_tag: "Anwesenheitsverfolgung"
    row3_title: "Wisse, wer kommt, ohne zu fragen"
    row3_body: "Beobachte, wie Zusagen und Absagen automatisch reinkommen, während Kollegen auf Push-Benachrichtigungen reagieren. Keine \"wer ist diese Woche dabei?\"-Nachrichten mehr — die Kopfzahl ist direkt sichtbar."
    row3_step1_title: "Aktivität geht live"
    row3_step1_body: "Jedes Mitglied bekommt eine Push-Benachrichtigung, sobald eine Session geplant oder aktualisiert wird."
    row3_step2_title: "Zusagen kommen rein"
    row3_step2_body: "Du siehst eine Live-Zählung und Liste, wer zugesagt, abgesagt hat oder noch offen ist."
    row3_step3_title: "Mit einem Fingertipp nachhaken"
    row3_step3_body: "Sende eine Erinnerungs-Push-Benachrichtigung an alle, die noch offen sind — direkt aus der App."
    row4_tag: "Wartelisten"
    row4_title: "Volle Sessions regeln sich von selbst"
    row4_body: "Lege eine maximale Kapazität für dein Fußball oder deine Platzbuchung fest. Sobald sie voll ist, landen neue Anmeldungen automatisch auf einer Warteliste — und rücken nach, sobald jemand absagt."
