  safe_group_runs:
    meta_title: "Corridas em grupo mais seguras para mulheres | Sports HQ"
    meta_desc: "Preferes não correr sozinha? Cria um evento com parceiros de confiança, privado se quiseres, vê quem confirmou e, se quiseres, partilha a localização."
    crumb: "Corridas em Grupo Mais Seguras"
