    row3_body: "Un totale live di conferme e rifiuti significa che non devi indovinare. Che tu esca all'alba o dopo il tramonto, vedi a colpo d'occhio se è un gruppo al completo, un solo compagno, o ancora nessuno — così puoi decidere cosa fare."
