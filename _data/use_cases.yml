    row3_li2: "Limite de vagas e listas de espera para elencos e clínicas"
    row3_li3: "Atribuição opcional de cores de equipe — sem coletes"
    faq_tag: "Perguntas frequentes"
    faq_title: "Perguntas sobre esporte infantojuvenil no Sports HQ"
    faq1_q: "Como os pais gerenciam o perfil do filho no Sports HQ?"
    faq1_a: "Pais e cuidadores adicionam o filho à própria conta. Assim, podem gerenciar as participações em eventos e a presença em atividades da criança e receber alertas em nome dela. Um menor adicionado dessa forma não fica visível para outros usuários, exceto nos eventos e atividades em que um responsável o inscreveu."
    faq2_q: "Posso aprovar quem entra no meu time de base?"
    faq2_a: "Sim. Deixe o evento privado e analise os pedidos de participação antes de qualquer um entrar. No esporte de base, os pedidos são geridos pelo responsável da criança."
    faq3_q: "Treinadores e pais podem conversar no app?"
    faq3_a: "Sim. Você pode ativar um chat opcional para qualquer evento, atividade ou local, e os admins controlam quem pode postar e compartilhar fotos."
    faq4_q: "O Sports HQ é adequado para crianças?"
    faq4_a: "O Sports HQ oferece contas de responsável, filtros de idade e eventos privados para ajudar as famílias a jogar com segurança. Como em qualquer app, recomendamos que os pais acompanhem os perfis e grupos em que os filhos entram."
