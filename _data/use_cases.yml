    row1_title: "Slå på aviseringar och låt appen jaga åt dig"
    row1_body: "Aktivera smarta aktivitetsaviseringar för valfritt evenemang. Sports HQ skickar \"en spelare till behövs\"- och ersättningsaviseringar i sista minuten, plus automatiska påminnelser till medlemmar som inte svarat."
    row1_li1: "Aviseringar om \"en till behövs\" och ersättare i sista minuten"
    row1_li2: "Automatiska påminnelser till medlemmar som inte svarat"
    row1_li3: "Spelare kan stänga av aviseringar för evenemang de inte deltar i"
    row2_tag: "Nå spelare i närheten"
    row2_title: "Gå bortom din grupp när du behöver"
    row2_body: "Avisera bara dina egna medlemmar, eller nå spelare i närheten som matchar sporten, nivån och tillgängligheten du söker. Fyll luckan med någon som verkligen vill spela."
    row2_step1_title: "Välj vem som ska aviseras"
    row2_step1_body: "Bara dina medlemmar, eller matchande spelare i närheten."
    row2_step2_title: "Matchande spelare får en avisering"
    row2_step2_body: "Sport, nivå och tillgänglighet tas med i beräkningen."
    row2_step3_title: "Bekräfta med ett tryck"
    row2_step3_body: "Platsen fylls och antalet uppdateras live."
    row3_tag: "Väntelistor & pålitlighet"
    row3_title: "Reserver redo och bättre koll på vilka som kommer"
    row3_body: "När en bekräftad spelare hoppar av meddelas nästa person på väntelistan. Lagkamratsbetyg och närvarospårning visar vem som pålitligt dyker upp, så du vet vem du kan räkna med."
    row3_li1: "Väntelistor meddelar nästa person när en plats blir ledig"
    row3_li2: "Spårning av närvaro / uteblivna vid incheckning"
    row3_li3: "Pålitlighet, punktlighet och vänlighet i spelarprofilerna"
    faq_tag: "Vanliga frågor"
    faq_title: "Frågor om att fylla en match"
    faq1_q: "Hur hittar jag en ersättare med kort varsel?"
    faq1_a: "Aktivera smarta aktivitetsaviseringar för ditt evenemang. Sports HQ kan skicka \"en spelare till behövs\"- och ersättningsaviseringar i sista minuten till dina medlemmar eller till spelare i närheten som matchar din sport, nivå och tillgänglighet."
    faq2_q: "Kan Sports HQ påminna dem som inte svarat?"
    faq2_a: "Ja. Automatiska påminnelser skickas till medlemmar som inte svarat, så att du slipper jaga dem själv."
    faq3_q: "Vad händer när någon hoppar av?"
    faq3_a: "Om ditt evenemang har en väntelista meddelas nästa person så fort en plats blir ledig."
    faq4_q: "Kan spelare stänga av aviseringar?"
    faq4_a: "Ja. Spelare kan stänga av aviseringar för evenemang de inte deltar i."
    faq5_q: "Hur minskar jag antalet som uteblir?"
    faq5_a: "Markera vem som kom och vem som inte kom vid incheckning, och låt lagkamrater betygsätta varandras pålitlighet och punktlighet. Med tiden visar varje spelares profil vem som pålitligt dyker upp, så du vet vem du kan räkna med i truppen. Påminnelser och kölistor täcker sedan luckorna."
    faq6_q: "Hur hittar jag en ersättare till min liga eller mitt lag?"
    faq6_a: "Skicka först en avisering om att en spelare till behövs till dina egna medlemmar, eller bredda den till spelare i närheten som matchar din sport, nivå och tillgänglighet. Den som först bekräftar får platsen, och antalet uppdateras live."
    faq7_q: "Vilka sporter fungerar det för?"
    faq7_a: "Alla 60+ sporter på Sports HQ, bland annat fotboll, basket, volleyboll, pickleball, padel, tennis, hockey, rugby och cricket. Det fungerar bäst för spel med ett fast antal spelare."
