    row3_body: "Quando um jogador confirmado desiste, a próxima pessoa da lista de espera é avisada. Avaliações entre colegas e controle de presença mostram quem aparece de verdade, para você saber com quem contar."
    row3_li1: "Listas de espera avisam a próxima pessoa quando abre uma vaga"
    row3_li2: "Controle de presença / faltas no check-in"
    row3_li3: "Confiabilidade, pontualidade e simpatia nos perfis dos jogadores"
    faq_tag: "Perguntas frequentes"
    faq_title: "Perguntas sobre completar um jogo"
    faq1_q: "Como encontro um substituto de última hora?"
    faq1_a: "Ative os alertas inteligentes no seu evento. O Sports HQ pode enviar alertas de \"falta um jogador\" e de substituição de última hora aos seus membros ou a jogadores próximos que combinam com seu esporte, nível e disponibilidade."
    faq2_q: "O Sports HQ pode lembrar quem não respondeu?"
    faq2_a: "Sim. Lembretes automáticos vão para os membros que não responderam, e você não precisa correr atrás deles."
    faq3_q: "O que acontece quando alguém desiste?"
    faq3_a: "Se o seu evento tem lista de espera, a próxima pessoa é avisada assim que abre uma vaga."
    faq4_q: "Os jogadores podem desativar os alertas?"
    faq4_a: "Sim. Jogadores podem desativar alertas de eventos de que não participam."
    faq5_q: "Como reduzo as faltas sem aviso?"
    faq5_a: "Marque quem compareceu e quem faltou no check-in e deixe os colegas avaliarem a confiabilidade e a pontualidade uns dos outros. Com o tempo, o perfil de cada jogador mostra quem aparece sempre, e você sabe com quem contar no elenco. Lembretes e listas de espera cobrem as lacunas."
    faq6_q: "Como encontro um substituto para minha liga ou time?"
    faq6_a: "Envie primeiro um alerta de «falta um» para seus próprios membros ou amplie para jogadores por perto que combinem com seu esporte, nível e disponibilidade. O primeiro a confirmar fica com a vaga, e a contagem é atualizada ao vivo."
