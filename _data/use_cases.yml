    row3_tag: "Dia de treino sem complicação"
    row3_title: "Saiba quem vem ao treino antes de sair de casa"
    row3_body: "Sessões recorrentes são geradas automaticamente a partir do seu modelo. Os pais confirmam ou recusam com um toque, listas de espera cuidam de turmas lotadas e cores de equipe dispensam coletes."
