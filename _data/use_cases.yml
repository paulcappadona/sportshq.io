    meta_title: "Community für Sportplatz & Court: QR oder Link | Sports HQ"
    meta_desc: "Mach Park, Court oder Bolzplatz zur lokalen Community: Anmeldung per QR-Code oder Link, Suche in der Nähe und einfaches Finden für Stammspieler."
    crumb: "Communitys an Gemeinschaftsplätzen"
    badge: "Für Communitys an Gemeinschaftsplätzen und -anlagen"
    title: "Gleicher Platz. Gleiche Gesichter. <span>Jetzt eine Community.</span>"
    sub: "Du und ein paar Stammspieler teilt euch denselben öffentlichen Platz, Parkplatz oder Gemeinschaftsplatz — aber ihr habt nie wirklich alle kennengelernt, die dort spielen. Sports HQ macht aus diesem geteilten Raum eine echte, organisierte Community, ohne dass du die Anlage besitzen musst."
    intro: "du regelmäßig auf demselben Gemeinschaftsplatz, Platz oder Park spielst — und du musst die Anlage nicht besitzen, um dort eine Community aufzubauen. Du brauchst nur einen Weg, wie die Leute, die auftauchen, einander finden."
    row1_tag: "Loslegen"
    row1_title: "Erstelle dein Event, dann wähle, wie du es teilst"
    row1_body: "Erstelle dein Event in Sports HQ und du bekommst einen QR-Code und einen Beitrittslink zur selben Seite. Drucke den QR-Code und hinterlasse ein, zwei Exemplare am Platz — an einen Zaunpfosten, eine Bank oder ein Schwarzes Brett geheftet — oder teile den Link im Gruppenchat für alle, die noch nicht vor Ort sind."
    row1_li1: "Kein Besitz der Anlage oder Anmeldeprozess nötig, um loszulegen"
    row1_li2: "QR-Code für den Platz selbst; Link für den Gruppenchat — nutze eins, oder beides"
    row1_li3: "Neue Spieler treten bei, sobald sie scannen oder tippen — kein Warten auf einen Admin"
    row2_tag: "Auffindbarkeit"
    row2_title: "Von jedem gefunden werden, der in der Nähe sucht"
    row2_body: "Über den QR-Code hinaus ist dein Event durch standortbasierte Suche auffindbar — sodass ein Läufer, Fußballer oder Basketballer, der durch die Gegend kommt, deine Community finden und zum Spielen vorbeikommen kann."
    row2_li1: "In den Kartensuchergebnissen für deinen Sport und Standort erscheinen"
    row2_li2: "Wachse über die Leute hinaus, die zufällig das Schild gesehen haben"
    row2_li3: "Funktioniert neben dem QR-Code, nicht statt ihm"
    row3_tag: "Echte Community"
    row3_title: "Setze Namen zu den Gesichtern, die du jede Woche siehst"
    row3_body: "Sobald Leute für das Event an deinem Platz registriert sind, können sie die Profile der anderen durchsehen, Stammspielern folgen und direkt schreiben — und machen so aus \"den Leuten, die im Park spielen\" ein echtes Netzwerk."
    row3_li1: "Das Mitgliederverzeichnis zeigt alle, die für das Event registriert sind"
    row3_li2: "Integriertes Messaging macht einen separaten Gruppenchat überflüssig"
    row3_li3: "Ermutigt Leute, eigene Pickup-Sessions unabhängig zu organisieren"
    row4_tag: "Koordination"
    row4_title: "Einfache Abstimmung von Aktivitäten, ohne Verwaltungsaufwand"
    row4_body: "Plane einen wiederkehrenden wöchentlichen Lauf, richte einmalige Sessions ein, oder lass jedes bestätigte Mitglied eine neue Aktivität vorschlagen — Teilnahme, Erinnerungen und Updates werden alle automatisch abgewickelt."
    row4_li1: "Wiederkehrende Zeitpläne halten deinen regulären Termin ohne manuellen Aufwand am Laufen"
    row4_li2: "Push-Benachrichtigungen informieren alle sofort über neue Sessions oder Änderungen"
    row4_li3: "Zusagen/Absagen per Fingertipp halten die Kopfzahl genau"
    download_headline: "Baue eine Community rund um deinen <span class=\"download__accent\">Platz.</span>"
    download_sub: "Lade Sports HQ kostenlos herunter, erstelle dein Event und drucke noch heute deinen ersten QR-Code."

  safe_group_runs:
    meta_title: "Sicherer Gruppenlauf für Frauen | Sports HQ"
    meta_desc: "Lieber nicht allein laufen? Erstelle ein Event mit vertrauten Laufpartnern, auf Wunsch privat, sieh, wer zugesagt hat, und teile optional deinen Live-Standort."
    crumb: "Sicherer Laufen in der Gruppe"
    badge: "Für Frauen und alle, die nicht gerne allein laufen"
    title: "Sicherer Laufen <span>mit Menschen, denen du vertraust</span>"
    sub: "Laufen soll sich frei anfühlen, nicht beängstigend. Du solltest deine Routine nicht wegen Belästigung ändern müssen — aber wenn du dir Gesellschaft für frühmorgendliche, abendliche oder ruhigere Laufstrecken wünschst, hilft dir Sports HQ, ein Event mit Freunden, Familie und Laufpartnern zu erstellen, denen du vertraust, es bei Bedarf auf privat zu stellen, und genau zu sehen, wer zugesagt hat, bevor du das Haus verlässt."
    sub2: "Ob sie neben dir laufen oder mit dem Rad begleiten — du weißt, wenn sich jemand, dem du vertraust, verbindlich angeschlossen hat."
    cta_primary: "Erstelle dein Lauf-Event"
    cta_secondary: "So funktionieren Gruppenläufe"
    intro: "du nicht gerne allein läufst — besonders früh morgens, nach Einbruch der Dunkelheit oder auf ruhigeren Strecken — aber die Zeitpläne deiner Laufpartner nie so richtig zusammenpassen. Sports HQ koordiniert Menschen, die du bereits kennst und denen du vertraust, und kann auf Wunsch deinen Live-Standort während einer Aktivität teilen; es ist kein Notfalldienst und keine Sicherheitsgarantie."
    row1_tag: "Dein Vertrauenskreis"
    row1_title: "Ein Event rund um Menschen, denen du bereits vertraust, startklar wann immer du es brauchst"
    row1_body: "Erstelle ein Event für die Menschen, die du wirklich beim Laufen an deiner Seite haben möchtest — Trainingspartner, Freunde, Familie, oder jemanden, der dich mit dem Rad begleitet, so wie der Partner einer Läuferin an der Gold Coast, wenn er nicht selbst mitlaufen kann. Füge sie als Mitglieder hinzu, stelle das Event auf privat, wenn es nur für deinen Kreis sichtbar sein soll, und nutze es für jeden zukünftigen Lauf wieder."
    row1_li1: "Stelle dein Event auf privat, wenn es nur für eingeladene Mitglieder sichtbar sein soll"
    row1_li2: "Füge Mitglieder per Link oder QR-Code hinzu, ganz ohne separate Kontoeinrichtung"
    row1_li3: "Funktioniert für einen festen Laufpartner genauso wie für eine ganze Nachbarschaftscrew"
    row2_tag: "Zusagen in Echtzeit"
    row2_title: "Hat jemand Zeit für deinen nächsten Lauf? In Sekunden herausfinden"
    row2_body: "Schlage einen Lauf vor, und dein ganzer Kreis wird sofort benachrichtigt. Während die Antworten eintreffen, siehst du sie live aktualisiert — kein Hinterherlaufen für eine Antwort, und du verlässt das Haus nie, ohne zu wissen, wer, wenn überhaupt jemand, mitkommt."
    row2_step1_title: "Schlage deinen nächsten Lauf vor"
    row2_step1_body: "Lege Zeit, Treffpunkt und Strecke fest — jedes Mitglied kann das tun."
    row2_step2_title: "Dein Kreis wird sofort benachrichtigt"
    row2_step2_body: "Eine Push-Benachrichtigung erreicht alle in dem Moment, in dem sie gepostet wird."
    row2_step3_title: "Zusagen kommen live rein"
    row2_step3_body: "Sieh in Echtzeit, wer dabei ist und wer nicht — bis zu dem Moment, in dem du losgehst."
    row3_tag: "Live-Teilnehmerzahl"
    row3_title: "Sieh, wer dabei ist, und wie viele, bevor du dich festlegst"
    row3_body: "Eine laufend aktualisierte Summe aus Zusagen und Absagen bedeutet, dass du nicht rätst. Ob du bei Sonnenaufgang oder nach Sonnenuntergang losläufst, du siehst auf einen Blick, ob es eine volle Runde, ein einzelner Partner oder noch niemand ist — damit du weißt, was als Nächstes zu tun ist."
    row3_li1: "Zusagen oder absagen mit einem Fingertipp — kein Hin und Her"
    row3_li2: "Live-Teilnehmerzahl, damit du vor dem Losgehen eine informierte Entscheidung triffst"
    row3_li3: "Dasselbe Event für jeden zukünftigen Lauf wiederverwenden — kein Neuanfang nötig"
    row4_tag: "Live-Standort teilen"
    row4_title: "Teile deinen Live-Standort mit Menschen, denen du vertraust – nur für den Lauf"
    row4_body: "Starte die Freigabe in der Aktivität und wähle, wer dir folgen darf: ihre bestätigten Teilnehmenden oder Sicherheitskontakte, die deine Anfrage angenommen haben. Die Freigabe ist nur rund um die Aktivität möglich, du kannst sie jederzeit beenden, und sie ist kein Notfalldienst."
    row4_li1: "Wähle bestätigte Teilnehmende oder deine angenommenen Sicherheitskontakte"
    row4_li2: "Verfügbar ab einer Stunde vor Beginn der Aktivität bis zu ihrem Ende"
    row4_li3: "Beende sie jederzeit; sie endet auch, wenn dieses Zeitfenster abläuft"
    row4_alt: "Sports-HQ-Fenster zum Teilen des Live-Standorts mit Zielgruppenoptionen für bestätigte Teilnehmende oder Sicherheitskontakte"
    faq_tag: "Häufige Fragen"
    faq_title: "Fragen zum Laufen in der Gruppe"
    faq1_q: "Wie hilft mir Sports HQ, einen sichereren Gruppenlauf zu organisieren?"
    faq1_a: "Erstelle ein Event mit Menschen, die du bereits kennst und denen du vertraust, stelle es bei Bedarf auf privat, schlage Zeit und Strecke für deinen nächsten Lauf vor, und sieh in Echtzeit, wer zugesagt hat, bevor du losgehst."
    faq2_q: "Kann ich mein Lauf-Event auf privat stellen?"
    faq2_a: "Ja. Events sind standardmäßig öffentlich, aber du kannst deins jederzeit auf privat stellen, sodass es nur die eingeladenen Mitglieder sehen und beitreten können."
    faq3_q: "Was passiert, wenn niemand zusagt?"
    faq3_a: "Das siehst du klar und deutlich, bevor du losgehst, sodass du entscheiden kannst, ob du wartest, jemanden direkt einlädst oder eine andere Zeit oder Strecke wählst. Sports HQ kann nicht garantieren, dass immer jemand Zeit hat, dich zu begleiten."
    faq4_q: "Kann mich ein Freund mit dem Rad begleiten, statt mitzulaufen?"
    faq4_a: "Ja. Jedes Mitglied deines Events kann für einen Lauf zusagen — egal ob es neben dir läuft oder dich mit dem Rad als Begleitung und zusätzliches Augenpaar unterstützt."
    faq5_q: "Bietet Sports HQ Live-Standortfreigabe – und ist es ein Notfalldienst?"
    faq5_a: "Ja zum Ersten, nein zum Zweiten. Während einer Aktivität kannst du deinen Live-Standort mit ihren bestätigten Teilnehmenden oder mit Sicherheitskontakten teilen, die deine Anfrage angenommen haben, und jederzeit beenden. Die Freigabe ist nur rund um die Aktivität möglich – von einer Stunde vor Beginn bis zum Ende – und endet, wenn du auf „Stopp“ tippst oder das Zeitfenster abläuft. Sports HQ verständigt keine Rettungsdienste, sendet keine Notfallalarme und garantiert niemandes Sicherheit; halte bei Bedarf die Notruffunktionen deines Telefons oder einen speziellen Sicherheitsdienst bereit."
    download_headline: "Wisse, wer zugesagt hat, <span class=\"download__accent\">bevor du das Haus verlässt.</span>"
    download_sub: "Lade Sports HQ kostenlos herunter und baue dir einen vertrauenswürdigen Laufkreis auf, auf den du zählen kannst."
  youth_sports:
    badge: "Für Juniorenvereine, Trainer & Eltern"
    title: "Jugendsport, <span>von Eltern freigegeben.</span>"
    sub: "Einen Juniorenverein zu leiten heißt, Eltern, Erlaubnisse und kurzfristige Änderungen über ein Dutzend Gruppenchats zu jonglieren. Mit Sports HQ verwalten Erziehungsberechtigte die Event-Mitgliedschaften und die Teilnahme ihres Kindes, während Trainer Termine und Anwesenheit an einem Ort behalten."
    intro: "du Trainer, Verantwortlicher oder Ehrenamtlicher in einem Juniorenverein, Schulteam oder einer Wochenend-Akademie bist – und die Eltern einbinden, Kinderprofile von Erwachsenen verwalten lassen und einfach sehen möchtest, wer zum Training kommt."
    row1_tag: "Konten für Erziehungsberechtigte"
    row1_title: "Eltern behalten die Kontrolle über das Profil ihres Kindes"
    row1_body: "Mit Erziehungsberechtigten-Konten verwalten Eltern oder Betreuer die Event-Mitgliedschaften und die Aktivitätsteilnahme eines Minderjährigen und erhalten Benachrichtigungen in dessen Namen. Kinder spielen; Erwachsene bleiben auf dem Laufenden."
    row1_li1: "Ein Erziehungsberechtigten-Konto verwaltet das Profil des Kindes"
    row1_li2: "Von Erziehungsberechtigten verwaltete Beitrittsanfragen im Juniorensport"
    row1_li3: "Altersfilter helfen, Events passend für die Altersgruppe zu halten"
    row2_tag: "Freigabe-Workflows"
    row2_title: "Bestimme, wer deinem Juniorenteam beitritt"
    row2_body: "Mache dein Team oder deine Einheit privat und prüfe jede Beitrittsanfrage. Teile einen Link oder QR-Code im Vereinsheim oder am Schultor und gib dann die erwarteten Familien frei."
    row2_step1_title: "Teile deinen Link oder QR-Code"
    row2_step1_body: "Drucke ihn fürs Vereinsheim aus oder schicke ihn in die Eltern-Gruppe."
    row2_step2_title: "Familien fragen den Beitritt an"
    row2_step2_body: "Erziehungsberechtigte stellen Beitrittsanfragen im Namen ihres Kindes."
    row2_step3_title: "Du gibst frei, wer dabei ist"
    row2_step3_body: "Admins prüfen Anfragen und behalten die Mannschaftsliste im Griff."
    row3_tag: "Trainingstag leicht gemacht"
    row3_title: "Wisse, wer zum Training kommt, bevor du zum Platz fährst"
    row3_body: "Wiederkehrende Einheiten entstehen automatisch aus deiner Vorlage. Eltern sagen per Fingertipp zu oder ab, Wartelisten kümmern sich um volle Kader, und Teamfarben ersetzen das Verteilen von Leibchen."
    row3_li1: "Wöchentliche Trainings- und Spieltagseinheiten"
    row3_li2: "Teilnehmerlimits und Wartelisten für Kader und Trainings"
    row3_li3: "Optionale Teamfarben-Zuweisung – keine Leibchen nötig"
    faq_tag: "Häufige Fragen"
    faq_title: "Fragen zu Jugendsport auf Sports HQ"
    faq1_q: "Wie verwalten Eltern das Profil ihres Kindes auf Sports HQ?"
    faq1_a: "Eltern und Betreuer fügen ihr Kind ihrem eigenen Konto hinzu. Sie können dann die Event-Mitgliedschaften und die Aktivitätsteilnahme des Kindes verwalten und Benachrichtigungen in dessen Namen erhalten. Ein so hinzugefügtes Kind ist für andere Nutzer nicht sichtbar – außer in Events und Aktivitäten, in denen ein Erziehungsberechtigter es angemeldet hat."
    faq2_q: "Kann ich freigeben, wer meinem Juniorenteam beitritt?"
    faq2_a: "Ja. Mache dein Event privat und prüfe Beitrittsanfragen, bevor jemand beitritt. Im Juniorensport werden Anfragen vom Erziehungsberechtigten des Kindes verwaltet."
    faq3_q: "Können Trainer und Eltern in der App chatten?"
    faq3_a: "Ja. Du kannst für jedes Event, jede Aktivität oder Sportstätte einen optionalen Chat aktivieren, und Admins steuern, wer schreiben und Fotos teilen darf."
    faq4_q: "Ist Sports HQ für Kinder geeignet?"
    faq4_a: "Sports HQ bietet Erziehungsberechtigten-Konten, Altersfilter und private Events, damit Familien sicher spielen können. Wie bei jeder App empfehlen wir Eltern, bei den Profilen und Gruppen ihrer Kinder involviert zu bleiben."
    download_headline: "Weniger Formulare. <span class=\"download__accent\">Mehr Training.</span>"
    download_sub: "Lade Sports HQ kostenlos herunter und bringe Eltern, Spieler und Trainer an einem Ort zusammen."
    alt1: "Sports-HQ-Event-Detailansicht mit Mitgliedern und anstehenden Terminen"
    alt2: "Sports-HQ-Ansichten zum Teilen eines Events per Einladungslink oder QR-Code"
    alt3: "Sports-HQ-Datenschutzeinstellungen eines Events mit privatem Event und Beitrittsbeschränkungen"
    alt4: "Sports-HQ-Einstellungen für wiederkehrende Termine"
  fill_the_last_spot:
    meta_title: "Ersatzspieler schnell finden: Jeden Platz füllen | Sports HQ"
    meta_desc: "Ein Spieler fehlt? Alerts für fehlende Spieler, Erinnerungen an alle ohne Zusage und Wartelisten helfen deinem Spiel oder deiner Liga, jeden Platz zu füllen."
    badge: "Für Organisatoren, die Absagen hassen"
    title: "Ein Spieler fehlt? <span>Jeden Platz füllen.</span>"
    sub: "Nichts killt ein wöchentliches Spiel so sehr wie ein später Ausfall. Sports HQ kann Mitglieder erinnern, die nicht geantwortet haben, „Noch einer gesucht“-Alarme senden und die nächste Person auf der Warteliste benachrichtigen, sobald ein Platz frei wird – damit ein Zehn-Spieler-Spiel leichter auf zehn kommt."
    intro: "du jede Woche ein Pickup-Fußballspiel, einen Volleyballabend, eine Pickleball-Rangliste oder ein Ligateam organisierst und eine Stunde vor Anpfiff noch hektisch Ersatz suchst."
    row1_tag: "Smarte Aktivitätsalarme"
    row1_title: "Aktiviere Alarme und lass die App das Hinterherlaufen übernehmen"
    row1_body: "Aktiviere smarte Aktivitätsalarme für jedes Event. Sports HQ sendet „Noch ein Spieler gesucht“- und kurzfristige Ersatz-Alarme sowie automatische Erinnerungen an Mitglieder, die noch nicht geantwortet haben."
    row1_li1: "„Noch ein Spieler gesucht“- und kurzfristige Ersatz-Alarme"
    row1_li2: "Automatische Erinnerungen für Mitglieder ohne Antwort"
    row1_li3: "Spieler können Alarme für Events abbestellen, an denen sie nicht teilnehmen"
    row2_tag: "Spieler in der Nähe erreichen"
    row2_title: "Geh bei Bedarf über deine Gruppe hinaus"
    row2_body: "Alarmiere nur deine eigenen Mitglieder oder erreiche Spieler in der Nähe, die zu Sportart, Level und Verfügbarkeit passen. Fülle die Lücke mit jemandem, der wirklich spielen will."
    row2_step1_title: "Wähle, wen du alarmierst"
    row2_step1_body: "Nur deine Mitglieder oder passende Spieler in der Nähe."
    row2_step2_title: "Passende Spieler werden benachrichtigt"
    row2_step2_body: "Sportart, Spielstärke und Verfügbarkeit werden berücksichtigt."
    row2_step3_title: "Per Fingertipp zusagen"
    row2_step3_body: "Der Platz ist besetzt und die Teilnehmerzahl aktualisiert sich live."
    row3_tag: "Wartelisten & Zuverlässigkeit"
    row3_title: "Ersatz bereit – und besserer Überblick, wer kommt"
    row3_body: "Fällt ein bestätigter Spieler aus, wird die nächste Person auf der Warteliste benachrichtigt. Mitspielerbewertungen und Anwesenheitserfassung zeigen, wer zuverlässig erscheint – so weißt du, auf wen du zählen kannst."
    row3_li1: "Wartelisten benachrichtigen die nächste Person, sobald ein Platz frei wird"
    row3_li2: "Erfassung von Anwesenheit / Nichterscheinen beim Check-in"
    row3_li3: "Zuverlässigkeit, Pünktlichkeit und Freundlichkeit in den Spielerprofilen"
    faq_tag: "Häufige Fragen"
    faq_title: "Fragen zum Auffüllen eines Spiels"
    faq1_q: "Wie finde ich kurzfristig einen Ersatzspieler?"
    faq1_a: "Aktiviere smarte Aktivitätsalarme für dein Event. Sports HQ kann „Noch ein Spieler gesucht“- und kurzfristige Ersatz-Alarme an deine Mitglieder oder an Spieler in der Nähe senden, die zu Sportart, Level und Verfügbarkeit passen."
    faq2_q: "Kann Sports HQ Leute erinnern, die noch nicht geantwortet haben?"
    faq2_a: "Ja. Automatische Erinnerungen gehen an Mitglieder, die nicht geantwortet haben – du musst nicht selbst hinterherlaufen."
    faq3_q: "Was passiert, wenn jemand ausfällt?"
    faq3_a: "Hat dein Event eine Warteliste, wird die nächste Person benachrichtigt, sobald ein Platz frei wird."
    faq4_q: "Können Spieler Alarme ausschalten?"
    faq4_a: "Ja. Spieler können Alarme für Events abbestellen, an denen sie nicht teilnehmen."
    faq5_q: "Wie verringere ich Nichterscheinen?"
    faq5_a: "Markiere beim Check-in, wer da war und wer nicht, und lass Mitspieler gegenseitig Zuverlässigkeit und Pünktlichkeit bewerten. Mit der Zeit zeigt das Profil jedes Spielers, wer verlässlich kommt – so weißt du, auf wen du in deinem Kader zählen kannst. Erinnerungen und Wartelisten füllen dann die Lücken."
    faq6_q: "Wie finde ich einen Ersatz für meine Liga oder mein Team?"
    faq6_a: "Schick zuerst einen Alert für fehlende Spieler an deine eigenen Mitglieder oder weite ihn auf Spieler in der Nähe aus, die zu Sportart, Spielstärke und Zeit passen. Wer zuerst zusagt, bekommt den Platz, und die Teilnehmerzahl aktualisiert sich live."
    faq7_q: "Für welche Sportarten funktioniert das?"
    faq7_a: "Für alle über 60 Sportarten auf Sports HQ, darunter Fußball, Basketball, Volleyball, Pickleball, Padel, Tennis, Hockey, Rugby und Cricket. Am besten passt es zu Spielen mit fester Spielerzahl."
    download_headline: "Hilf jedem Spiel, <span class=\"download__accent\">auf seine Spielerzahl zu kommen.</span>"
    download_sub: "Lade Sports HQ kostenlos herunter und fülle Plätze leichter auf."
    alt1: "Sports-HQ-Event-Detailansicht mit anstehenden Terminen und Zu-/Absage-Schaltflächen"
    alt2: "Sports-HQ-Mitgliederliste einer Aktivität mit bestätigten und ausstehenden Mitgliedern und der Schaltfläche „Erinnerung senden“"
    alt3: "Sports-HQ-Ansicht zum Planen eines Termins"
    alt4: "Sports-HQ-Ansichten mit Event-Details, wiederkehrendem Zeitplan und QR-Code zum Beitreten"

- id: el
  run_club:
    meta_title: "Εφαρμογή Running Club: Ομαδικά τρεξίματα εύκολα | Sports HQ"
    meta_desc: "Βγάλε το running club στον δρόμο πιο γρήγορα: άμεσες ειδοποιήσεις, επιβεβαίωση με ένα άγγιγμα, τέλος το χάος στο group chat. Δωρεάν σε iOS και Android."
    crumb: "Όμιλοι Τρεξίματος"
    badge: "Για Αυθόρμητους Ομίλους Τρεξίματος"
    title: "Λιγότερα Μηνύματα. <span>Περισσότερο Τρέξιμο.</span>"
    sub: "Ο όμιλος τρεξίματός σου δεν ακολουθεί σταθερό πρόγραμμα — εξαρτάται από το ποιος είναι ελεύθερος απόψε. Το Sports HQ αντικαθιστά το ατελείωτο group chat με άμεσες ειδοποιήσεις και επιβεβαιώσεις με ένα άγγιγμα, ώστε να ξοδεύεις λιγότερο χρόνο σε συντονισμό και περισσότερο στον δρόμο."
    intro: "διοργανώνεις έναν όμιλο τρεξίματος, μια ομάδα προπόνησης, ή οποιαδήποτε ομαδική δραστηριότητα που προτείνεται την τελευταία στιγμή αντί να προγραμματίζεται εβδομάδες πριν — και έχεις βαρεθεί να γράφεις \"ποιος μπαίνει απόψε;\" σε ένα group chat."
    row1_tag: "Κεντρική Επικοινωνία"
    row1_title: "Μία εκδήλωση, μία παρέα, καθόλου θόρυβος"
    row1_body: "Δημιούργησε τον όμιλο τρεξίματός σου ως εκδήλωση στο Sports HQ μία φορά και πρόσθεσε την παρέα σου. Από εκεί και πέρα, κάθε δραστηριότητα, ενημέρωση και υπενθύμιση περνάει μέσα από την εφαρμογή — όχι μέσα από τρία διαφορετικά νήματα μηνυμάτων."
