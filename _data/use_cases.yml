    row1_title: "Los padres controlan el perfil de sus hijos"
    row1_body: "Las cuentas de tutor permiten que un padre o cuidador gestione las membresías de eventos y la asistencia a actividades de un menor, y reciba alertas en su nombre. Los niños juegan; los adultos se mantienen al tanto."
