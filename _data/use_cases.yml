    row2_step2_body: "Une notification push atteint tout le monde au moment où elle est publiée."
    row2_step3_title: "Les confirmations arrivent en direct"
    row2_step3_body: "Observez qui est partant et qui ne l'est pas se mettre à jour en temps réel, jusqu'au moment de partir."
    row3_tag: "Décompte en Direct"
    row3_title: "Voyez qui participe, et combien, avant de vous engager"
    row3_body: "Un total en direct des confirmations et refus signifie que vous ne devinez plus. Que vous partiez à l'aube ou après le coucher du soleil, vous voyez en un coup d'œil s'il s'agit d'un groupe complet, d'un seul partenaire, ou de personne pour l'instant — pour décider de la suite."
    row3_li1: "Confirmez ou déclinez en un geste — sans allers-retours de messages"
    row3_li2: "Décompte des participants en direct pour prendre une décision éclairée avant de partir"
    row3_li3: "Réutilisez le même événement pour chaque future course — sans repartir de zéro"
    row4_tag: "Partage de position en direct"
    row4_title: "Partagez votre position en direct avec vos proches de confiance, uniquement pour la sortie"
    row4_body: "Lancez le partage depuis l'activité et choisissez qui peut vous suivre : ses participants confirmés ou des contacts de sécurité ayant accepté votre demande. Le partage n'est possible qu'autour de l'activité, vous pouvez l'arrêter à tout moment, et ce n'est pas un service d'urgence."
    row4_li1: "Choisissez les participants confirmés ou vos contacts de sécurité acceptés"
    row4_li2: "Disponible d'une heure avant le début de l'activité jusqu'à sa fin"
    row4_li3: "Arrêtez quand vous voulez ; il s'arrête aussi à la fermeture de cette fenêtre"
    row4_alt: "Écran de partage de position en direct de Sports HQ avec les options d'audience : participants confirmés ou contacts de sécurité"
    faq_tag: "Questions Fréquentes"
    faq_title: "Questions sur la course en groupe"
    faq1_q: "Comment Sports HQ m'aide-t-il à organiser une course en groupe plus sûre ?"
    faq1_a: "Créez un événement avec des personnes que vous connaissez déjà et en qui vous avez confiance, marquez-le comme privé si vous préférez que cela reste entre vous, proposez une heure et un itinéraire pour votre prochaine course, et voyez en temps réel qui a confirmé avant de partir."
    faq2_q: "Puis-je marquer mon événement de course comme privé ?"
    faq2_a: "Oui. Les événements sont publics par défaut, mais vous pouvez marquer le vôtre comme privé à tout moment, afin que seuls les membres que vous invitez puissent le voir ou le rejoindre."
    faq3_q: "Que se passe-t-il si personne ne confirme ?"
    faq3_a: "Vous le verrez clairement avant de partir, ce qui vous permettra de décider d'attendre, d'inviter quelqu'un directement, ou de choisir une autre heure ou un autre itinéraire. Sports HQ ne peut pas garantir que quelqu'un sera toujours disponible pour vous accompagner."
    faq4_q: "Un ami peut-il m'accompagner à vélo plutôt que de courir ?"
    faq4_a: "Oui. N'importe quel membre de votre événement peut confirmer sa présence à une course, qu'il coure à vos côtés ou vous accompagne à vélo comme compagnie et paire d'yeux supplémentaire."
    faq5_q: "Sports HQ propose-t-il le partage de position en direct, et est-ce un service d'urgence ?"
    faq5_a: "Oui pour le premier, non pour le second. Pendant une activité, vous pouvez choisir de partager votre position en direct avec ses participants confirmés ou avec des contacts de sécurité ayant accepté votre demande, et l'arrêter à tout moment. Le partage n'est possible qu'autour de l'activité — d'une heure avant son début jusqu'à sa fin — et s'arrête quand vous touchez Arrêter ou que la fenêtre se ferme. Sports HQ ne contacte pas les secours, n'envoie pas d'alertes d'urgence et ne garantit la sécurité de personne ; gardez à portée de main les fonctions d'urgence de votre téléphone ou un service de sécurité dédié si nécessaire."
    download_headline: "Sachez qui a confirmé, <span class=\"download__accent\">avant de quitter la maison.</span>"
    download_sub: "Téléchargez Sports HQ gratuitement et créez un cercle de course de confiance sur lequel vous pouvez compter."
  youth_sports:
    badge: "Pour les clubs de jeunes, entraîneurs et parents"
    title: "Sport des jeunes, <span>validé par les parents.</span>"
    sub: "Diriger une équipe de jeunes, c'est jongler entre parents, autorisations et changements de dernière minute dans une dizaine de discussions. Avec Sports HQ, les tuteurs gèrent les adhésions et la présence de leur enfant, tandis que les entraîneurs gardent horaires et présences au même endroit."
    intro: "vous entraînez, gérez ou aidez bénévolement un club de jeunes, une équipe scolaire ou une académie du week-end, et vous voulez tenir les parents informés, faire gérer les profils des enfants par un adulte et voir simplement qui vient à l'entraînement."
    row1_tag: "Comptes tuteur"
    row1_title: "Les parents gardent le contrôle du profil de leur enfant"
    row1_body: "Les comptes tuteur permettent à un parent ou un accompagnant de gérer les adhésions aux événements et la participation aux activités d'un mineur, et de recevoir des alertes en son nom. Les enfants jouent ; les adultes restent informés."
    row1_li1: "Un compte tuteur gère le profil du jeune"
    row1_li2: "Demandes d'adhésion gérées par le tuteur pour le sport des jeunes"
    row1_li3: "Les filtres d'âge aident à garder des événements adaptés à chaque tranche d'âge"
    row2_tag: "Flux de validation"
    row2_title: "Contrôlez qui rejoint votre équipe de jeunes"
    row2_body: "Rendez votre équipe ou votre séance privée et examinez chaque demande d'adhésion. Partagez un lien ou un QR code au club ou à la sortie de l'école, puis validez les familles attendues."
    row2_step1_title: "Partagez votre lien ou QR code"
    row2_step1_body: "Imprimez-le pour le club ou envoyez-le dans la discussion des parents."
    row2_step2_title: "Les familles demandent à rejoindre"
    row2_step2_body: "Les tuteurs envoient les demandes d'adhésion au nom de leur enfant."
    row2_step3_title: "Vous validez qui participe"
    row2_step3_body: "Les admins examinent les demandes et gardent l'effectif sous contrôle."
    row3_tag: "Entraînement sans prise de tête"
    row3_title: "Sachez qui vient à l'entraînement avant de partir au terrain"
    row3_body: "Les séances récurrentes se génèrent automatiquement à partir de votre modèle. Les parents confirment ou déclinent d'un geste, les listes d'attente gèrent les groupes complets et les couleurs d'équipe évitent de distribuer des chasubles."
    row3_li1: "Entraînements hebdomadaires et jours de match récurrents"
    row3_li2: "Limites de places et listes d'attente pour les effectifs et stages"
    row3_li3: "Attribution facultative de couleurs d'équipe, sans chasubles"
    faq_tag: "Questions fréquentes"
    faq_title: "Questions sur le sport des jeunes avec Sports HQ"
    faq1_q: "Comment les parents gèrent-ils le profil de leur enfant sur Sports HQ ?"
    faq1_a: "Les parents et accompagnants ajoutent leur enfant à leur propre compte. Ils peuvent ensuite gérer ses adhésions aux événements et sa participation aux activités, et recevoir des alertes en son nom. Un enfant ajouté ainsi n'est pas visible des autres utilisateurs, sauf dans les événements et activités où un tuteur l'a inscrit."
    faq2_q: "Puis-je valider qui rejoint mon équipe de jeunes ?"
    faq2_a: "Oui. Rendez votre événement privé et examinez les demandes d'adhésion avant que quiconque ne rejoigne. Pour le sport des jeunes, les demandes sont gérées par le tuteur de l'enfant."
    faq3_q: "Les entraîneurs et les parents peuvent-ils discuter dans l'appli ?"
    faq3_a: "Oui. Vous pouvez activer une discussion facultative pour tout événement, activité ou lieu, et les admins contrôlent qui peut publier et partager des photos."
    faq4_q: "Sports HQ convient-elle aux enfants ?"
    faq4_a: "Sports HQ propose des comptes tuteur, des filtres d'âge et des événements privés pour aider les familles à jouer en sécurité. Comme pour toute appli, nous recommandons aux parents de rester impliqués dans les profils et groupes que rejoignent leurs enfants."
    download_headline: "Moins de formulaires. <span class=\"download__accent\">Plus d'entraînement.</span>"
    download_sub: "Téléchargez Sports HQ gratuitement et réunissez parents, joueurs et entraîneurs au même endroit."
    alt1: "Écran de détails d'un événement Sports HQ avec les membres et les prochaines séances"
    alt2: "Écrans Sports HQ pour partager un événement par lien d'invitation ou QR code"
    alt3: "Paramètres de confidentialité d'un événement Sports HQ avec événement privé et restrictions d'adhésion"
    alt4: "Paramètres de planning des séances récurrentes dans Sports HQ"
  fill_the_last_spot:
    meta_title: "Trouvez un remplaçant vite : complétez l'équipe | Sports HQ"
    meta_desc: "Il manque un joueur ? Alertes de recherche, rappels aux membres sans réponse et listes d'attente aident votre match ou ligue à remplir chaque place."
    badge: "Pour les organisateurs qui détestent annuler"
    title: "Il manque un joueur ? <span>Remplissez chaque place.</span>"
    sub: "Rien ne tue une partie hebdomadaire comme un forfait de dernière minute. Sports HQ peut relancer les membres qui n'ont pas répondu, envoyer des alertes « il manque un joueur » et prévenir la personne suivante sur la liste d'attente dès qu'une place se libère, pour aider un match à dix à atteindre dix."
    intro: "vous organisez chaque semaine un match de foot entre amis, une soirée volley, un ladder de pickleball ou une équipe de ligue, et vous cherchez toujours un remplaçant une heure avant le coup d'envoi."
    row1_tag: "Alertes d'activité intelligentes"
    row1_title: "Activez les alertes et laissez l'appli relancer à votre place"
    row1_body: "Activez les alertes d'activité intelligentes pour n'importe quel événement. Sports HQ envoie des alertes « il manque un joueur » et de remplacement de dernière minute, plus des rappels automatiques aux membres qui n'ont pas répondu."
    row1_li1: "Alertes « il manque un joueur » et de remplacement de dernière minute"
    row1_li2: "Rappels automatiques pour les membres sans réponse"
    row1_li3: "Les joueurs peuvent désactiver les alertes des événements auxquels ils ne participent pas"
    row2_tag: "Touchez les joueurs proches"
    row2_title: "Allez au-delà de votre groupe quand il le faut"
    row2_body: "Alertez uniquement vos membres, ou touchez les joueurs proches qui correspondent au sport, au niveau et aux disponibilités recherchés. Comblez le trou avec quelqu'un qui a vraiment envie de jouer."
    row2_step1_title: "Choisissez qui alerter"
    row2_step1_body: "Vos membres uniquement, ou les joueurs proches qui correspondent."
    row2_step2_title: "Les joueurs concernés sont notifiés"
    row2_step2_body: "Le sport, le niveau et les disponibilités sont pris en compte."
    row2_step3_title: "Confirmez d'un geste"
    row2_step3_body: "La place est comblée et le décompte se met à jour en direct."
    row3_tag: "Listes d'attente et fiabilité"
    row3_title: "Des remplaçants prêts, et une meilleure vue de qui vient"
    row3_body: "Quand un joueur confirmé se désiste, la personne suivante sur la liste d'attente est notifiée. Les notes entre coéquipiers et le suivi des présences montrent qui vient vraiment, pour savoir sur qui compter."
    row3_li1: "Les listes d'attente préviennent la personne suivante quand une place se libère"
    row3_li2: "Suivi des présences / absences au pointage"
    row3_li3: "Fiabilité, ponctualité et sympathie sur les profils des joueurs"
    faq_tag: "Questions fréquentes"
    faq_title: "Questions sur le remplissage d'un match"
    faq1_q: "Comment trouver un remplaçant au dernier moment ?"
    faq1_a: "Activez les alertes d'activité intelligentes pour votre événement. Sports HQ peut envoyer des alertes « il manque un joueur » et de remplacement de dernière minute à vos membres, ou aux joueurs proches qui correspondent à votre sport, niveau et disponibilités."
    faq2_q: "Sports HQ peut-elle relancer ceux qui n'ont pas répondu ?"
    faq2_a: "Oui. Des rappels automatiques sont envoyés aux membres qui n'ont pas répondu, pour que vous n'ayez pas à les relancer vous-même."
    faq3_q: "Que se passe-t-il quand quelqu'un se désiste ?"
    faq3_a: "Si votre événement a une liste d'attente, la personne suivante est notifiée dès qu'une place se libère."
    faq4_q: "Les joueurs peuvent-ils désactiver les alertes ?"
    faq4_a: "Oui. Les joueurs peuvent désactiver les alertes des événements auxquels ils ne participent pas."
    faq5_q: "Comment réduire les absences ?"
    faq5_a: "Indiquez qui est venu et qui ne l'est pas lors du pointage, et laissez les coéquipiers évaluer la fiabilité et la ponctualité des autres. Avec le temps, le profil de chaque joueur montre qui est fiable, pour savoir sur qui compter dans votre effectif. Les rappels et les listes d'attente comblent ensuite les manques."
    faq6_q: "Comment trouver un remplaçant pour ma ligue ou mon équipe ?"
    faq6_a: "Envoyez d'abord une alerte « il manque un joueur » à vos propres membres, ou élargissez-la aux joueurs proches qui correspondent à votre sport, niveau et disponibilités. Le premier à confirmer prend la place et le décompte se met à jour en direct."
    faq7_q: "Pour quels sports ça fonctionne ?"
    faq7_a: "Pour tous les 60+ sports de Sports HQ, dont football, basket, volley, pickleball, padel, tennis, hockey, rugby et cricket. C'est idéal pour les jeux avec un nombre de joueurs défini."
    download_headline: "Aidez chaque match à <span class=\"download__accent\">atteindre son effectif.</span>"
    download_sub: "Téléchargez Sports HQ gratuitement et comblez les places plus facilement."
    alt1: "Écran de détails d'un événement Sports HQ avec les prochaines séances et les boutons confirmer ou décliner"
    alt2: "Liste des membres d'une activité Sports HQ avec membres confirmés et en attente et un bouton d'envoi de rappel"
    alt3: "Écran Sports HQ pour planifier une séance"
    alt4: "Écrans Sports HQ avec détails de l'événement, planning récurrent et QR code pour rejoindre"

