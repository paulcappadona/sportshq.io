    row2_step1_body: "सिर्फ़ आपके सदस्य, या मेल खाते आस-पास के खिलाड़ी।"
    row2_step2_title: "मेल खाते खिलाड़ियों को सूचना मिलती है"
    row2_step2_body: "खेल, कौशल स्तर और उपलब्धता को ध्यान में रखा जाता है।"
    row2_step3_title: "एक टैप में पुष्टि करें"
    row2_step3_body: "जगह भर जाती है और गिनती लाइव अपडेट होती है।"
    row3_tag: "वेटलिस्ट और भरोसेमंदी"
    row3_title: "बैकअप तैयार, और कौन आ रहा है यह भी ज़्यादा साफ़"
    row3_body: "जब कोई पुष्ट खिलाड़ी हट जाता है, तो वेटलिस्ट के अगले व्यक्ति को सूचना मिलती है। साथी रेटिंग और उपस्थिति ट्रैकिंग दिखाती हैं कि कौन भरोसे से आता है, ताकि आप जान सकें किस पर भरोसा करना है।"
    row3_li1: "जगह खाली होने पर वेटलिस्ट अगले व्यक्ति को सूचित करती है"
    row3_li2: "चेक-इन पर उपस्थित / अनुपस्थित की ट्रैकिंग"
    row3_li3: "खिलाड़ी प्रोफ़ाइल पर भरोसेमंदी, समय की पाबंदी और मिलनसारिता"
    faq_tag: "अक्सर पूछे जाने वाले प्रश्न"
    faq_title: "खेल के लिए खिलाड़ी पूरे करने के बारे में प्रश्न"
    faq1_q: "कम समय में रिप्लेसमेंट खिलाड़ी कैसे ढूँढूँ?"
    faq1_a: "अपने इवेंट के लिए स्मार्ट गतिविधि अलर्ट चालू करें। Sports HQ आपके सदस्यों या आपके खेल, स्तर और उपलब्धता से मेल खाते आस-पास के खिलाड़ियों को \"एक और खिलाड़ी चाहिए\" और आख़िरी समय के रिप्लेसमेंट अलर्ट भेज सकता है।"
    faq2_q: "क्या Sports HQ उन्हें याद दिला सकता है जिन्होंने जवाब नहीं दिया?"
    faq2_a: "हाँ। जवाब न देने वाले सदस्यों को स्वचालित रिमाइंडर भेजे जाते हैं, इसलिए आपको खुद उनके पीछे नहीं पड़ना पड़ता।"
    faq3_q: "जब कोई हट जाता है तो क्या होता है?"
    faq3_a: "अगर आपके इवेंट में वेटलिस्ट है, तो जगह खाली होते ही अगले व्यक्ति को सूचित किया जाता है।"
    faq4_q: "क्या खिलाड़ी अलर्ट बंद कर सकते हैं?"
    faq4_a: "हाँ। खिलाड़ी उन इवेंट के अलर्ट बंद कर सकते हैं जिनमें वे शामिल नहीं हैं।"
    faq5_q: "नो-शो कैसे कम करूँ?"
    faq5_a: "चेक-इन पर चिह्नित करें कि कौन आया और कौन नहीं, और टीम के साथियों को एक-दूसरे की भरोसेमंदी और समय-पाबंदी को रेट करने दें। समय के साथ हर खिलाड़ी की प्रोफ़ाइल दिखाती है कि कौन भरोसे से आता है, ताकि आप अपने रोस्टर के लिए जान सकें किस पर भरोसा करना है। रिमाइंडर और वेटलिस्ट फिर खाली जगहें भर देते हैं।"
    faq6_q: "अपनी लीग या टीम के लिए रिप्लेसमेंट खिलाड़ी कैसे ढूँढूँ?"
    faq6_a: "पहले अपने सदस्यों को “एक और खिलाड़ी चाहिए” अलर्ट भेजें, या उसे आपके खेल, स्किल लेवल और उपलब्धता से मेल खाने वाले आस-पास के खिलाड़ियों तक बढ़ाएँ। जो पहले कन्फ़र्म करता है उसे जगह मिलती है, और गिनती लाइव अपडेट होती है।"
    faq7_q: "यह किन खेलों के लिए काम करता है?"
    faq7_a: "Sports HQ के 60+ खेलों में से किसी के लिए भी, जिनमें फुटबॉल, बास्केटबॉल, वॉलीबॉल, पिकलबॉल, पैडल, टेनिस, हॉकी, रग्बी और क्रिकेट शामिल हैं। यह तय संख्या में खिलाड़ियों वाले खेलों के लिए सबसे अच्छा काम करता है।"
    download_headline: "हर खेल को <span class=\"download__accent\">ज़रूरी खिलाड़ी जुटाने में मदद करें।</span>"
    download_sub: "Sports HQ मुफ़्त डाउनलोड करें और जगहें आसानी से भरें।"
    alt1: "आने वाले सेशन और पुष्टि या इनकार बटन के साथ Sports HQ का इवेंट विवरण स्क्रीन"
    alt2: "पुष्ट और लंबित सदस्यों तथा रिमाइंडर भेजें बटन के साथ Sports HQ की गतिविधि सदस्य सूची"
