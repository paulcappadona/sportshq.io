    alt4: "Ajustes de horario de sesiones recurrentes en Sports HQ"
  fill_the_last_spot:
    meta_title: "Encuentra un reemplazo rápido: completa cada plaza | Sports HQ"
    meta_desc: "¿Falta un jugador? Alertas de «falta uno», recordatorios a quienes no confirmaron y listas de espera ayudan a que tu partido o liga llene cada plaza."
    badge: "Para organizadores que odian cancelar partidos"
    title: "¿Falta un jugador? <span>Completa todas las plazas.</span>"
    sub: "Nada arruina un partido semanal como una baja de última hora. Sports HQ puede avisar a quienes no han respondido, enviar alertas de «falta uno» y notificar a la siguiente persona de la lista de espera cuando se libera una plaza, para ayudar a que un partido de diez llegue a diez."
    intro: "organizas cada semana un partido de fútbol, una noche de voleibol, una escalera de pickleball o un equipo de liga, y siempre acabas buscando un reemplazo una hora antes del inicio."
    row1_tag: "Alertas inteligentes de actividad"
    row1_title: "Activa las alertas y deja que la app haga el trabajo de insistir"
    row1_body: "Activa las alertas inteligentes en cualquier evento. Sports HQ envía alertas de «falta un jugador» y de reemplazo de última hora, además de recordatorios automáticos a quienes aún no han respondido."
    row1_li1: "Alertas de «falta uno» y de reemplazo de última hora"
    row1_li2: "Recordatorios automáticos para quienes no han respondido"
    row1_li3: "Los jugadores pueden desactivar las alertas de eventos en los que no participan"
    row2_tag: "Llega a jugadores cercanos"
