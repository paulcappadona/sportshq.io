    row2_step1_body: "Imprímelo para el club o envíalo al chat de padres."
    row2_step2_title: "Las familias solicitan unirse"
    row2_step2_body: "Los tutores envían solicitudes de membresía en nombre de sus hijos."
    row2_step3_title: "Tú apruebas quién entra"
    row2_step3_body: "Los administradores revisan las solicitudes y controlan la lista del equipo."
    row3_tag: "El día de entrenamiento, sin complicaciones"
    row3_title: "Sabe quién va a entrenar antes de salir hacia el campo"
    row3_body: "Las sesiones recurrentes se generan solas a partir de tu plantilla. Los padres confirman o rechazan con un toque, las listas de espera gestionan los grupos llenos y los colores de equipo eliminan los petos."
    row3_li1: "Entrenamientos semanales y sesiones de partido recurrentes"
    row3_li2: "Límites de aforo y listas de espera para plantillas y clínicas"
    row3_li3: "Asignación opcional de colores de equipo, sin petos"
    faq_tag: "Preguntas frecuentes"
    faq_title: "Preguntas sobre deporte juvenil en Sports HQ"
    faq1_q: "¿Cómo gestionan los padres el perfil de su hijo en Sports HQ?"
    faq1_a: "Padres y cuidadores añaden a su hijo a su propia cuenta. Así pueden gestionar sus membresías de eventos y su asistencia a actividades, y recibir alertas en su nombre. Un menor añadido de este modo no es visible para otros usuarios, salvo en los eventos y actividades en los que un tutor lo haya inscrito."
    faq2_q: "¿Puedo aprobar quién se une a mi equipo juvenil?"
    faq2_a: "Sí. Haz privado tu evento y revisa las solicitudes antes de que nadie se una. En el deporte juvenil, las solicitudes las gestiona el tutor del menor."
    faq3_q: "¿Pueden chatear entrenadores y padres en la app?"
    faq3_a: "Sí. Puedes activar un chat opcional para cualquier evento, actividad o recinto, y los administradores controlan quién puede publicar y compartir fotos."
    faq4_q: "¿Es Sports HQ adecuada para niños?"
    faq4_a: "Sports HQ ofrece cuentas de tutor, filtros de edad y eventos privados para que las familias jueguen con seguridad. Como en cualquier app, recomendamos que los padres sigan implicados en los perfiles y grupos a los que se unen sus hijos."
    download_headline: "Menos formularios. <span class=\"download__accent\">Más entrenamiento.</span>"
    download_sub: "Descarga Sports HQ gratis y reúne a padres, jugadores y entrenadores en un solo lugar."
