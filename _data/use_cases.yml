    sub: "Você se ofereceu para organizar o futebol do escritório, a corrida do almoço, ou o happy hour de sexta — e de alguma forma acabou gerenciando isso entre três chats em grupo e uma planilha. O Sports HQ te dá um único lugar para agendar, divulgar, e acompanhar presença, com notificações push fazendo a cobrança por você."
    intro: "você é o organizador não oficial de uma atividade esportiva no trabalho — uma corrida do almoço, um time de futebol, um ranking de badminton, uma liga de softball — e está cansado de divulgar sessões manualmente e cobrar colegas que não responderam."
    row1_tag: "Cadastro Fácil"
    row1_title: "Integre a equipe toda com um escaneamento"
    row1_body: "Poste um link de entrada no canal do Slack da equipe ou no e-mail de boas-vindas, ou imprima o código QR para o mural do escritório — mesma página de cadastro nos dois casos. Novos colegas entram no seu evento instantaneamente, sem lista manual, sem nomes esquecidos."
    row1_li1: "Link para Slack, Teams, ou e-mail — um toque para entrar direto da mesa"
    row1_li2: "Código QR para o mural ou o kit de boas-vindas impresso"
    row1_li3: "A associação é gerenciada inteiramente no app — sem planilha separada"
    row2_tag: "Agendamento Flexível"
    row2_title: "Recorrente, avulso, ou os dois"
    row2_body: "Defina um horário semanal recorrente para a sessão de sempre, depois adicione datas avulsas manuais para torneios, confraternizações, ou mudanças de horário por feriados — tudo a partir do mesmo evento."
    row2_li1: "Gere semanas de instâncias automaticamente a partir de uma agenda contínua"
    row2_li2: "Insira atividades avulsas manuais que não seguem o padrão"
    row2_li3: "Cada criação ou atualização dispara uma notificação push para a equipe"
    row3_tag: "Controle de Presença"
    row3_title: "Saiba quem vem, sem precisar perguntar"
    row3_body: "Veja confirmações e recusas chegarem automaticamente conforme os colegas respondem às notificações push. Chega de mensagens \"quem vai essa semana?\" — a contagem está ali, na sua frente."
    row3_step1_title: "A atividade é publicada"
    row3_step1_body: "Cada membro recebe uma notificação push no momento em que uma sessão é agendada ou atualizada."
    row3_step2_title: "As confirmações chegam"
    row3_step2_body: "Você vê uma contagem ao vivo e a lista de quem confirmou, recusou, ou ainda está pendente."
    row3_step3_title: "Cobre com um toque"
    row3_step3_body: "Envie uma notificação push de lembrete para quem ainda está pendente — direto do app."
    row4_tag: "Listas de Espera"
    row4_title: "Sessões lotadas se resolvem sozinhas"
    row4_body: "Defina uma capacidade máxima para seu futebol ou reserva de quadra. Assim que lotar, novas inscrições entram automaticamente numa lista de espera — e avançam assim que alguém desiste."
    row4_li1: "Chega de reservas duplicadas ou discussões sobre quem tem vaga"
    row4_li2: "Membros na lista de espera são notificados instantaneamente quando uma vaga abre"
    row4_li3: "Funciona automaticamente em cada instância recorrente"
    download_headline: "Gerencie seu time sem a <span class=\"download__accent\">planilha.</span>"
    download_sub: "Baixe o Sports HQ grátis e agende sua próxima sessão em minutos."
  social_sports_group:
    crumb: "Grupos Sociais Esportivos"
    badge: "Para Grandes Grupos Sociais Esportivos"
    title: "Um Grupo Grande, Sem <span>Caos.</span>"
    sub: "Quando um grupo social esportivo passa de algumas dezenas de membros, os chats em grupo param de funcionar — mensagens se perdem, novos membros não sabem como entrar, e ninguém tem certeza de quem realmente vai aparecer. O Sports HQ dá estrutura ao seu grupo: associação controlada, sessões com limite, e lembretes automáticos."
    intro: "você administra um grupo esportivo que cresceu além do ponto em que um chat em grupo consegue acompanhar — um time social de futebol, um grupo de rugby tag, uma liga de netball, um encontro de escalada — com dezenas ou centenas de membros em várias sessões regulares."
    row1_tag: "Controle de Associação"
    row1_title: "Público, privado, ou algo no meio"
    row1_body: "Crie a atividade do seu grupo como um modelo de evento. Deixe público e descobrível para crescer organicamente, ou privado para que a associação seja totalmente controlada — visível só para quem você deixar entrar."
    row1_li1: "Eventos privados ficam totalmente ocultos de busca e descoberta"
    row1_li2: "Configurações de segurança e associação são definidas por evento"
    row1_li3: "Mude um grupo de somente-convite para crescimento aberto quando estiver pronto"
    row2_tag: "Integração Sem Esforço"
    row2_title: "Um link faz todo o trabalho"
    row2_body: "Compartilhe um único link num grupo do WhatsApp, uma assinatura de e-mail, ou um post social — ou imprima o código QR correspondente para cartazes e murais. Ambos levam um novo membro à mesma página de entrada com um toque ou escaneamento."
    row2_li1: "Chega de explicar \"como eu entro\" para cada novo membro"
    row2_li2: "Escolha link ou código QR de acordo com onde você está recrutando"
    row2_li3: "Funciona tendo ou não a pessoa já instalado o Sports HQ"
    row3_tag: "Agende do Seu Jeito"
    row3_title: "Controle manual, praticidade recorrente"
    row3_body: "Agende atividades manualmente para sessões avulsas, ou defina um padrão recorrente para sua partida semanal de sempre — e alterne entre os dois conforme a agenda do seu grupo exigir."
    row3_li1: "Notificações push chegam a cada membro no momento em que uma sessão é criada ou muda"
    row3_li2: "Membros confirmam ou recusam presença com um único toque"
    row3_li3: "Lembretes saem automaticamente conforme a sessão se aproxima"
    row4_tag: "Capacidade e Listas de Espera"
    row4_title: "Limite o tamanho do grupo sem recusar ninguém"
    row4_body: "Defina um número máximo de participantes de acordo com a capacidade do seu campo, quadra, ou local. Assim que uma sessão lota, novas inscrições entram automaticamente numa lista de espera em vez de se perderem."
    row4_step1_title: "Defina o tamanho máximo do seu grupo"
    row4_step1_body: "As sessões param de aceitar confirmações assim que o limite é atingido."
    row4_step2_title: "Inscrições extras entram na lista de espera"
    row4_step2_body: "Ninguém é recusado diretamente — são colocados na fila automaticamente."
    row4_step3_title: "As vagas se preenchem sozinhas"
    row4_step3_body: "Quando um membro confirmado recusa, o próximo da lista de espera é notificado instantaneamente."
    download_headline: "Coloque ordem num <span class=\"download__accent\">grupo grande.</span>"
    download_sub: "Baixe o Sports HQ grátis e dê ao seu grupo social esportivo a estrutura que já ficou grande demais para um chat em grupo."
  communal_field_community:
    crumb: "Comunidades de Campos Comunitários"
    badge: "Para Comunidades de Campos e Instalações Comunitárias"
    title: "Mesmo Campo. Mesmas Caras. <span>Agora uma Comunidade.</span>"
    sub: "Você e alguns fiéis dividem a mesma quadra pública, campo de parque, ou campo comunitário — mas nunca chegaram a conhecer todo mundo que joga ali. O Sports HQ transforma esse espaço compartilhado numa comunidade real e organizada, sem precisar ser dono do local."
    intro: "você joga regularmente no mesmo campo, quadra, ou parque comunitário — e não precisa ser dono do local para construir uma comunidade ali. Você só precisa de uma forma de quem aparece se encontrar."
    row1_tag: "Comece"
    row1_title: "Crie seu evento, depois escolha como compartilhar"
    row1_body: "Crie seu evento no Sports HQ e você recebe um código QR e um link de entrada para a mesma página. Imprima o QR e deixe uma cópia ou duas no campo — colada num poste, banco, ou mural — ou compartilhe o link no chat em grupo para quem ainda não está no local."
    row1_li1: "Não precisa ser dono do local nem passar por processo de inscrição para começar"
    row1_li2: "Código QR para o próprio campo; link para o chat em grupo — use um, ou os dois"
    row1_li3: "Novos jogadores entram no momento em que escaneiam ou tocam — sem esperar um administrador"
    row2_tag: "Capacidade de Descoberta"
    row2_title: "Encontrado por qualquer pessoa que busque por perto"
    row2_body: "Além do código QR, seu evento é descoberto por busca de localização — assim um corredor, jogador de futebol, ou basquete que passe pela região pode encontrar sua comunidade e aparecer para jogar."
    row2_li1: "Apareça nos resultados de busca do mapa para seu esporte e localização"
    row2_li2: "Faça seu grupo de fiéis crescer além de quem viu a placa por acaso"
    row2_li3: "Funciona junto com o código QR, não no lugar dele"
    row3_tag: "Comunidade de Verdade"
    row3_title: "Coloque nome nos rostos que você vê toda semana"
    row3_body: "Depois que as pessoas se cadastram no evento do seu campo, elas podem ver os perfis umas das outras, seguir os fiéis, e mandar mensagem direto — transformando \"as pessoas que jogam no parque\" numa rede de verdade."
    row3_li1: "O diretório de membros mostra todos os cadastrados no evento"
    row3_li2: "Mensagens integradas eliminam a necessidade de um chat em grupo separado"
    row3_li3: "Incentiva as pessoas a organizarem suas próprias sessões de forma independente"
    row4_tag: "Coordenação"
    row4_title: "Coordenação fácil de atividades, sem sobrecarga administrativa"
    row4_body: "Agende uma corrida semanal recorrente, crie sessões avulsas, ou deixe qualquer membro confirmado propor uma nova atividade — presença, lembretes, e atualizações são tratados automaticamente."
    row4_li1: "Horários recorrentes mantêm seu horário de sempre rodando sem manutenção manual"
    row4_li2: "Notificações push avisam todo mundo sobre novas sessões ou mudanças na hora"
    row4_li3: "Confirmar/recusar com um toque mantém a contagem precisa"
    download_headline: "Construa uma comunidade em torno do seu <span class=\"download__accent\">campo.</span>"
    download_sub: "Baixe o Sports HQ grátis, crie seu evento, e imprima seu primeiro código QR hoje mesmo."

