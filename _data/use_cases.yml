    sub: "Du driver en tennisklubb, ett klättercenter, ett flerbanskomplex, eller en gemensam plan — och du vet att dina medlemmar skulle spela mer, och stanna längre, om de kände varandra. Sports HQ ger varje anläggning ett inbyggt gemenskapslager: registrering, upptäckt, schemaläggning och kommunikation, allt i en app."
