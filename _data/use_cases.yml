    row4_li1: "選擇已確認的參與者或已接受的安全聯絡人"
    row4_li2: "從活動開始前一小時起，到活動結束為止"
    row4_li3: "隨時可停止；時間範圍結束時也會自動結束"
    row4_alt: "Sports HQ 即時位置分享面板，可選擇已確認的參與者或安全聯絡人作為對象"
    faq_tag: "常見問題"
    faq_title: "關於團體跑步的常見問題"
    faq1_q: "Sports HQ 如何幫我籌辦更安全的團體跑步？"
    faq1_a: "和你已經認識且信任的人建立活動，如果希望只留在你們之間就設為私密，提議下次跑步的時間和路線，並在出門前即時看到誰已經確認參加。"
    faq2_q: "我可以把跑步活動設為私密嗎？"
    faq2_a: "可以。活動預設是公開的，但你隨時可以把自己的活動設為私密，讓只有受邀的成員能看到或加入。"
    faq3_q: "如果沒有人確認怎麼辦？"
    faq3_a: "你會在出門前清楚看到這一點，可以決定要等待、直接邀請某人，或改選其他時間或路線。Sports HQ 無法保證一定會有人有空陪你。"
    faq4_q: "朋友可以騎單車陪我，而不是一起跑步嗎？"
    faq4_a: "可以。活動裡的任何成員都能確認參加，無論是在你身邊跑步，還是騎單車陪同，作為陪伴和多一雙留意周遭的眼睛。"
    faq5_q: "Sports HQ 提供即時位置分享嗎？它是緊急救援服務嗎？"
    faq5_a: "前者是，後者不是。活動期間，你可以選擇與已確認的參與者或已接受你請求的安全聯絡人分享即時位置，並可隨時停止。分享僅限活動前後——從開始前一小時到活動結束——點選「停止」或時間範圍結束時即會停止。Sports HQ 不會聯絡緊急服務、發送緊急警報，也不保證任何人的安全；如有需要，請隨時備妥手機的緊急功能或專門的安全服務。"
