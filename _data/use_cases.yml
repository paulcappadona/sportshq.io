    intro: "je regelmatig speelt op hetzelfde gedeelde veld, court, of park — en je hoeft de locatie niet te bezitten om er een community op te bouwen. Je hebt alleen een manier nodig zodat de mensen die komen opdagen elkaar kunnen vinden."
