    row2_step2_body: "一發布，推播通知就會馬上送達所有人。"
    row2_step3_title: "確認即時湧入"
    row2_step3_body: "直到你出門前，隨時查看誰要來、誰不來的即時更新。"
    row3_tag: "即時人數統計"
    row3_title: "在你決定之前，先看看誰會來、有多少人"
    row3_body: "即時的確認與婉拒總數，代表你不用再猜測。無論是天亮出門還是日落之後，你都能一眼看出是全員到齊、只有一位夥伴，還是目前還沒人回應——再決定接下來怎麼做。"
    row3_li1: "一鍵確認或婉拒——不用來回傳訊息"
    row3_li2: "即時參加人數，讓你出門前做出明智的判斷"
    row3_li3: "同一個活動可重複用於未來每一次跑步——不用每次重新設定"
