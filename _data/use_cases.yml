    row2_body: "Avisa solo a tus miembros o llega a jugadores cercanos que encajen con el deporte, el nivel y la disponibilidad que necesitas. Cubre el hueco con alguien que de verdad quiere jugar."
    row2_step1_title: "Elige a quién avisar"
    row2_step1_body: "Solo a tus miembros, o a jugadores cercanos que encajen."
    row2_step2_title: "Se notifica a los jugadores adecuados"
    row2_step2_body: "Se tienen en cuenta el deporte, el nivel y la disponibilidad."
    row2_step3_title: "Confirma con un toque"
    row2_step3_body: "La plaza se cubre y el recuento se actualiza en directo."
