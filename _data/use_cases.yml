    title: "Corridas em Grupo Mais Seguras <span>com Pessoas de Confiança</span>"
    sub: "Correr devia dar-te uma sensação de liberdade, não de medo. Não devias ter de mudar a tua rotina por causa de assédio — mas se preferes companhia em corridas de manhã cedo, ao fim do dia, ou em percursos mais tranquilos, o Sports HQ ajuda-te a criar um evento com amigos, família e parceiros de corrida em quem confias, marcá-lo como privado se preferires que fique só entre vocês, e ver exatamente quem confirmou antes de saíres de casa."
