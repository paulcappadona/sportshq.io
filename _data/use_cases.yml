    row4_li2: "Disponibile da un'ora prima dell'inizio dell'attività fino alla fine"
    row4_li3: "Interrompi quando vuoi; termina anche quando questa finestra si chiude"
    row4_alt: "Schermata di condivisione della posizione in tempo reale di Sports HQ con le opzioni di pubblico: partecipanti confermati o contatti di sicurezza"
    faq_tag: "Domande Frequenti"
    faq_title: "Domande sulla corsa di gruppo"
    faq1_q: "Come mi aiuta Sports HQ a organizzare una corsa di gruppo più sicura?"
    faq1_a: "Crea un evento con le persone che già conosci e di cui ti fidi, impostalo come privato se preferisci che resti solo tra voi, proponi orario e percorso per la tua prossima corsa, e vedi in tempo reale chi ha confermato prima di uscire."
    faq2_q: "Posso impostare il mio evento di corsa come privato?"
    faq2_a: "Sì. Gli eventi sono pubblici per impostazione predefinita, ma puoi impostare il tuo come privato in qualsiasi momento, così solo i membri che inviti possono vederlo o unirsi."
    faq3_q: "Cosa succede se nessuno conferma?"
    faq3_a: "Lo vedrai chiaramente prima di uscire, così potrai decidere se aspettare, invitare direttamente qualcuno, o scegliere un altro orario o percorso. Sports HQ non può garantire che ci sia sempre qualcuno libero per accompagnarti."
    faq4_q: "Un amico può accompagnarmi in bici invece di correre?"
    faq4_a: "Sì. Qualsiasi membro del tuo evento può confermare per una corsa, che corra al tuo fianco o ti accompagni in bici come compagnia e un paio di occhi in più."
    faq5_q: "Sports HQ offre la condivisione della posizione in tempo reale ed è un servizio di emergenza?"
    faq5_a: "Sì alla prima, no alla seconda. Durante un'attività puoi scegliere di condividere la tua posizione in tempo reale con i partecipanti confermati o con i contatti di sicurezza che hanno accettato la tua richiesta, e puoi interrompere in qualsiasi momento. La condivisione è disponibile solo intorno all'attività — da un'ora prima dell'inizio fino alla fine — e si interrompe quando tocchi Interrompi o la finestra si chiude. Sports HQ non contatta i servizi di emergenza, non invia avvisi di emergenza e non garantisce la sicurezza di nessuno; tieni a portata di mano le funzioni di emergenza del telefono o un servizio di sicurezza dedicato se ne hai bisogno."
    download_headline: "Sappi chi ha confermato, <span class=\"download__accent\">prima di uscire di casa.</span>"
    download_sub: "Scarica Sports HQ gratis e costruisci un cerchio di corsa di fiducia su cui puoi contare."
