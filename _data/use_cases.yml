    row3_title: "Ve quién se apunta, y cuántos son, antes de comprometerte"
    row3_body: "Un recuento en vivo de confirmados y rechazados significa que no tienes que adivinar. Ya salgas al amanecer o después del atardecer, puedes ver de un vistazo si hay grupo completo, un solo compañero, o todavía nadie — para decidir qué hacer."
    row3_li1: "Confirma o rechaza con un toque — sin idas y venidas de mensajes"
    row3_li2: "Recuento de asistentes en vivo para tomar una decisión informada antes de salir"
    row3_li3: "Reutiliza el mismo evento para cada futura carrera — sin empezar de cero"
    row4_tag: "Ubicación en tiempo real"
    row4_title: "Comparte tu ubicación en tiempo real con quien confías, solo durante la salida"
    row4_body: "Empieza a compartir desde la actividad y elige quién puede seguirte: sus participantes confirmados o contactos de seguridad que hayan aceptado tu solicitud. Solo se puede compartir en torno a la actividad, puedes detenerlo en cualquier momento y no es un servicio de emergencia."
    row4_li1: "Elige participantes confirmados o tus contactos de seguridad aceptados"
    row4_li2: "Disponible desde una hora antes de que empiece la actividad hasta que termina"
    row4_li3: "Detén cuando quieras; también termina cuando se cierra esa ventana"
    row4_alt: "Hoja de Sports HQ para compartir la ubicación en tiempo real con opciones de audiencia: participantes confirmados o contactos de seguridad"
    faq_tag: "Preguntas Frecuentes"
    faq_title: "Preguntas sobre correr en grupo"
    faq1_q: "¿Cómo me ayuda Sports HQ a organizar una carrera en grupo más segura?"
    faq1_a: "Crea un evento con la gente que ya conoces y en la que confías, márcalo como privado si prefieres que quede solo entre vosotros, propón una hora y una ruta para tu próxima carrera, y ve en tiempo real quién ha confirmado antes de salir."
    faq2_q: "¿Puedo marcar mi evento de running como privado?"
    faq2_a: "Sí. Los eventos son públicos por defecto, pero puedes marcar el tuyo como privado en cualquier momento para que solo los miembros que invites puedan verlo o unirse."
    faq3_q: "¿Qué pasa si nadie confirma?"
    faq3_a: "Lo verás claramente antes de salir, para que puedas decidir si esperar, invitar a alguien directamente, o elegir otra hora o ruta. Sports HQ no puede garantizar que siempre haya alguien libre para acompañarte."
    faq4_q: "¿Puede un amigo acompañarme en bici en lugar de correr?"
    faq4_a: "Sí. Cualquier miembro de tu evento puede confirmar para una carrera, ya sea corriendo a tu lado o acompañándote en bici como compañía y un par de ojos extra."
    faq5_q: "¿Ofrece Sports HQ ubicación en tiempo real y es un servicio de emergencias?"
    faq5_a: "Sí a lo primero, no a lo segundo. Durante una actividad puedes elegir compartir tu ubicación en tiempo real con los participantes confirmados o con contactos de seguridad que hayan aceptado tu solicitud, y puedes detenerlo en cualquier momento. Solo se puede compartir en torno a la actividad —desde una hora antes de que empiece hasta que termina— y se detiene cuando pulsas Detener o se cierra esa ventana. Sports HQ no contacta con servicios de emergencia, no envía alertas de emergencia ni garantiza la seguridad de nadie; ten a mano las funciones de emergencia de tu teléfono o un servicio de seguridad específico si los necesitas."
    download_headline: "Sabe quién ha confirmado, <span class=\"download__accent\">antes de salir de casa.</span>"
    download_sub: "Descarga Sports HQ gratis y crea un círculo de carrera de confianza al que puedas recurrir."
  youth_sports:
    badge: "Para clubes juveniles, entrenadores y padres"
    title: "Deporte juvenil, <span>aprobado por los padres.</span>"
    sub: "Dirigir un equipo juvenil es hacer malabares con padres, permisos y cambios de última hora en una docena de chats. Con Sports HQ, los tutores gestionan las membresías y la asistencia de sus hijos, mientras los entrenadores mantienen horarios y asistencia en un solo lugar."
    intro: "eres entrenador, responsable o voluntario de un club juvenil, un equipo escolar o una academia de fin de semana, y quieres tener a los padres al tanto, que un adulto gestione los perfiles de los niños y ver fácilmente quién viene a entrenar."
