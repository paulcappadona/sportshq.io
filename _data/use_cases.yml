    faq7_a: "Para qualquer um dos mais de 60 esportes do Sports HQ, incluindo futebol, basquete, vôlei, pickleball, padel, tênis, hóquei, rúgbi e críquete. Funciona melhor em jogos com número fixo de jogadores."
