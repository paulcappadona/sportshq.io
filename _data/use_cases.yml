    faq_title: "グループランに関する質問"
    faq1_q: "Sports HQはより安全なグループランの企画をどう助けてくれますか？"
    faq1_a: "すでに知っていて信頼している人たちとイベントを作成し、仲間内だけに留めたいならプライベート設定にして、次のランの時間とルートを提案し、出発前にリアルタイムで誰が参加を確定したか確認できます。"
    faq2_q: "ランニングイベントをプライベート設定にできますか？"
    faq2_a: "はい。イベントはデフォルトでは公開設定ですが、いつでもプライベートに変更でき、招待したメンバーだけが閲覧・参加できるようになります。"
    faq3_q: "誰も参加確定しなかった場合はどうなりますか？"
    faq3_a: "出発前にはっきりとわかるので、待つか、直接誰かを誘うか、別の時間やルートを選ぶかを判断できます。Sports HQは、常に誰かが一緒に来られることを保証するものではありません。"
    faq4_q: "友人が走る代わりに自転車で並走することはできますか？"
    faq4_a: "はい。イベントのメンバーであれば誰でも、隣を走る形でも、自転車で並走して付き添いや見守り役になる形でも、参加確定できます。"
    faq5_q: "Sports HQ にリアルタイム位置情報の共有機能はありますか？ 緊急通報サービスですか？"
