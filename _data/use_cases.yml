    sub: "막판 불참만큼 정기 경기를 망치는 것도 없습니다. Sports HQ는 응답하지 않은 멤버에게 알림을 보내고, '한 명 더 필요' 알림을 발송하며, 자리가 나면 대기자 명단의 다음 사람에게 알려, 열 명 경기가 열 명을 채우도록 돕습니다."
    intro: "매주 풋살 번개, 배구의 밤, 피클볼 래더, 리그 팀을 운영하면서 킥오프 한 시간 전에 대체 인원을 구하느라 허둥대는 분을 위한 것입니다."
    row1_tag: "스마트 활동 알림"
    row1_title: "알림을 켜고 독촉은 앱에 맡기세요"
    row1_body: "어떤 이벤트에서든 스마트 활동 알림을 켜세요. Sports HQ가 '한 명 더 필요' 및 막판 대체 인원 알림을 보내고, 응답하지 않은 멤버에게 자동 리마인더를 보냅니다."
    row1_li1: "'한 명 더 필요' 및 막판 대체 인원 알림"
    row1_li2: "응답하지 않은 멤버에게 자동 리마인더"
    row1_li3: "참여하지 않는 이벤트의 알림은 플레이어가 끌 수 있음"
    row2_tag: "주변 플레이어에게 도달"
    row2_title: "필요할 땐 그룹 밖으로 넓히세요"
    row2_body: "내 멤버에게만 알리거나, 필요한 종목·레벨·가능 시간에 맞는 주변 플레이어에게 알리세요. 정말 뛰고 싶은 사람으로 빈자리를 채우세요."
    row2_step1_title: "알릴 대상 선택"
    row2_step1_body: "내 멤버만, 또는 조건이 맞는 주변 플레이어."
    row2_step2_title: "조건에 맞는 플레이어에게 알림"
    row2_step2_body: "종목, 실력 수준, 가능 시간이 반영됩니다."
    row2_step3_title: "한 번의 탭으로 확정"
    row2_step3_body: "자리가 채워지고 인원 수가 실시간으로 업데이트됩니다."
    row3_tag: "대기자 명단과 신뢰도"
    row3_title: "대기 인원은 준비 완료, 누가 오는지도 더 분명하게"
    row3_body: "확정된 선수가 빠지면 대기자 명단의 다음 사람에게 알림이 갑니다. 팀원 평가와 출석 기록으로 꾸준히 나오는 사람을 알 수 있어 누구를 믿어야 할지 알게 됩니다."
    row3_li1: "자리가 나면 대기자 명단의 다음 사람에게 알림"
    row3_li2: "체크인 시 참석 / 노쇼 기록"
    row3_li3: "플레이어 프로필에 신뢰도, 시간 약속, 친근함 표시"
    faq_tag: "자주 묻는 질문"
    faq_title: "경기 인원 채우기에 관한 질문"
    faq1_q: "급하게 대체 선수를 찾으려면 어떻게 하나요?"
    faq1_a: "이벤트에서 스마트 활동 알림을 켜세요. Sports HQ가 멤버 또는 종목, 레벨, 가능 시간이 맞는 주변 플레이어에게 '한 명 더 필요' 및 막판 대체 인원 알림을 보낼 수 있습니다."
    faq2_q: "Sports HQ가 응답하지 않은 사람에게 리마인더를 보낼 수 있나요?"
    faq2_a: "네. 응답하지 않은 멤버에게 자동 리마인더가 전송되므로 직접 독촉하지 않아도 됩니다."
    faq3_q: "누군가 불참하면 어떻게 되나요?"
    faq3_a: "이벤트에 대기자 명단이 있으면 자리가 나는 즉시 다음 사람에게 알림이 갑니다."
    faq4_q: "플레이어가 알림을 끌 수 있나요?"
    faq4_a: "네. 참여하지 않는 이벤트의 알림은 플레이어가 끌 수 있습니다."
    faq5_q: "노쇼를 어떻게 줄일 수 있나요?"
    faq5_a: "체크인할 때 참석한 사람과 불참한 사람을 표시하고, 팀원끼리 서로의 신뢰도와 시간 준수를 평가하게 하세요. 시간이 지나면 각 선수의 프로필에 꾸준히 나오는 사람이 보여, 명단에서 누구를 믿을 수 있는지 알 수 있습니다. 이후 리마인더와 대기자 명단이 빈자리를 메워 줍니다."
    faq6_q: "리그나 팀의 용병은 어떻게 구하나요?"
    faq6_a: "먼저 내 회원들에게 '한 명 더' 알림을 보내거나, 종목·실력·가능 시간이 맞는 주변 선수에게까지 범위를 넓히세요. 가장 먼저 확정한 사람이 자리를 얻고 인원수는 실시간으로 업데이트됩니다."
    faq7_q: "어떤 종목에 쓸 수 있나요?"
    faq7_a: "Sports HQ의 60가지 이상 스포츠 어디에나 사용할 수 있으며, 축구, 농구, 배구, 피클볼, 패들, 테니스, 하키, 럭비, 크리켓 등이 포함됩니다. 정해진 인원이 있는 경기에 특히 잘 맞습니다."
    download_headline: "모든 경기가 <span class=\"download__accent\">필요한 인원을 채우도록 도와요.</span>"
    download_sub: "Sports HQ를 무료로 다운로드하고 빈자리를 더 쉽게 채우세요."
    alt1: "예정된 세션과 참석·불참 버튼이 보이는 Sports HQ 이벤트 상세 화면"
    alt2: "확정 및 대기 중인 멤버와 리마인더 보내기 버튼이 보이는 Sports HQ 활동 멤버 목록"
    alt3: "세션을 예약하는 Sports HQ 화면"
    alt4: "이벤트 상세, 반복 일정, 참여용 QR 코드가 보이는 Sports HQ 화면"

- id: nl
  run_club:
    meta_title: "Runclub-app: organiseer spontane groepsruns | Sports HQ"
    meta_desc: "Krijg je runclub sneller de deur uit: directe meldingen, aanmelden met één tik en geen groepschat-chaos bij spontane runs. Gratis op iOS en Android."
    crumb: "Hardloopclubs"
    badge: "Voor Ad-Hoc Hardloopclubs"
    title: "Minder Appen. <span>Meer Hardlopen.</span>"
    sub: "Jouw hardloopclub volgt geen vast schema — het draait om wie er vanavond tijd heeft. Sports HQ vervangt de eindeloze groepschat door directe meldingen en bevestigingen met één tik, zodat je minder tijd kwijt bent aan coördineren en meer tijd hebt om te lopen."
    intro: "je een hardloopclub, een trainingsgroep, of een groepsactiviteit organiseert die op het laatste moment wordt voorgesteld in plaats van weken van tevoren gepland — en je het beu bent om \"wie doet er vanavond mee?\" in een groepschat te typen."
    row1_tag: "Gecentraliseerde Communicatie"
    row1_title: "Eén evenement, één groep, geen ruis"
    row1_body: "Maak je hardloopclub eenmalig aan als evenement in Sports HQ en voeg je groep toe. Vanaf dan loopt elke activiteit, update en herinnering via de app — niet via drie verschillende berichtenreeksen."
    row1_li1: "Eén keer instellen; hergebruik het voor elke toekomstige run"
    row1_li2: "Werkt net zo goed voor elke sport of activiteit, niet alleen hardlopen"
    row1_li3: "Voeg leden toe met een link in de groepschat, of een QR-code op een inschrijfformulier — wat het makkelijkst is"
    row2_tag: "Directe Meldingen"
    row2_title: "Stel de run van vanavond voor, informeer iedereen direct"
    row2_body: "Elk lid kan een activiteit aanmaken voor de groep — stel datum, tijd en route voor, en elk lid krijgt direct een pushmelding. Geen beheerdersvertraging, geen wachten tot iemand het bericht \"ziet\"."
    row2_step1_title: "Iemand stelt een run voor"
    row2_step1_body: "Elk lid kan de activiteit aanmaken — het hoeft niet de organisator te zijn."
    row2_step2_title: "Iedereen wordt tegelijk op de hoogte gebracht"
    row2_step2_body: "Er gaat een pushmelding uit op het moment dat de activiteit wordt aangemaakt."
    row2_step3_title: "Reacties komen direct binnen"
    row2_step3_body: "Bevestig of wijs af met één tik — geen typwerk nodig."
    row3_tag: "Directe Bevestiging"
    row3_title: "Weet wie er loopt voordat je de deur uit gaat"
    row3_body: "Bekijk de live opkomst voor de run van vanavond — wie heeft bevestigd, wie heeft afgewezen, en wie nog niet gereageerd heeft — zonder ook maar één opvolgbericht te sturen."
    row3_li1: "Bevestigen/afwijzen met één tik maakt heen-en-weer volledig overbodig"
    row3_li2: "Minimaliseert de overhead zodat de groep zich op trainen kan richten"
    row3_li3: "Dezelfde flow werkt voor elke sport of activiteit die in Sports HQ wordt beheerd"
    download_headline: "Minder tijd organiseren, <span class=\"download__accent\">meer tijd hardlopen.</span>"
    download_sub: "Download Sports HQ gratis en regel de run van vanavond in seconden."
  venue_owners:
    meta_title: "Community-app voor sportlocaties: QR-aanmelding | Sports HQ"
    meta_desc: "Maak van bezoekers een community: aanmelden via QR-code, leden ontdekken, terugkerende evenementen en een lijst met vaste spelers voor banen en sportlocaties."
    crumb: "Locatie-eigenaren"
    badge: "Voor Locatie- & Faciliteitseigenaren"
    title: "Maak van Bezoekers een <span>Community.</span>"
    sub: "Je runt een tennisclub, een klimhal, een multi-court complex, of een buurtveld — en je weet dat je leden vaker en langer zouden spelen als ze elkaar kenden. Sports HQ geeft elke locatie een ingebouwde communitylaag: registratie, vindbaarheid, planning en communicatie, allemaal in één app."
    cta_primary: "Registreer Je Locatie"
    intro: "je een faciliteit, complex, of locatie bezit of beheert — een tennisclub, sportschool, sporthal, klimcentrum, of buurtveld — en je een actieve, terugkerende community van bezoekers wilt opbouwen in plaats van eenmalige, anonieme boekingen."
