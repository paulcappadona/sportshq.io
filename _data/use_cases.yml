    cta_secondary: "Vê Como Funcionam as Corridas em Grupo"
    intro: "preferes não correr sozinha — sobretudo de manhã cedo, depois de escurecer, ou em percursos mais tranquilos — mas os horários dos teus parceiros de corrida nunca coincidem. O Sports HQ coordena pessoas que já conheces e em quem confias e, se quiseres, pode partilhar a tua localização em direto durante uma atividade; não é um serviço de emergência nem uma garantia de segurança."
    row1_tag: "O Teu Círculo de Confiança"
    row1_title: "Um evento construído à volta de pessoas em quem já confias, pronto sempre que precisares"
    row1_body: "Cria um evento para as pessoas que realmente gostarias de ter ao teu lado numa corrida — parceiros de treino, amigos, família, ou alguém que te acompanhe de bicicleta, como faz o parceiro de uma corredora de Gold Coast quando ele não pode correr com ela. Adiciona-os como membros, marca o evento como privado se quiseres que fique só no teu círculo, e fica pronto para reutilizar em cada corrida futura."
    row1_li1: "Marca o teu evento como privado se quiseres que só os membros convidados o vejam"
    row1_li2: "Adiciona membros com uma ligação ou código QR, sem precisar de criar uma conta separada"
    row1_li3: "Funciona tanto para um parceiro de corrida fixo como para um grupo inteiro de vizinhos"
    row2_tag: "Confirmações em Tempo Real"
    row2_title: "Há alguém livre para a tua próxima corrida? Descobre em segundos"
    row2_body: "Propõe uma corrida e todo o teu círculo é notificado de imediato. À medida que as respostas chegam, vês tudo a atualizar-se ao vivo — sem teres de andar atrás de ninguém, e sem sair de casa sem saber quem, se alguém, te vai acompanhar."
    row2_step1_title: "Propõe a tua próxima corrida"
    row2_step1_body: "Define a hora, o ponto de encontro e o percurso — qualquer membro o pode fazer."
    row2_step2_title: "O teu círculo é notificado de imediato"
    row2_step2_body: "Uma notificação push chega a todos no momento em que é publicada."
    row2_step3_title: "As confirmações chegam ao vivo"
    row2_step3_body: "Vê quem vai e quem não vai a atualizar-se em tempo real, até ao momento em que saíres."
    row3_tag: "Contagem em Direto"
    row3_title: "Vê quem vai, e quantos, antes de te comprometeres"
    row3_body: "Um total em direto de confirmados e recusados significa que não precisas de adivinhar. Quer saias ao amanhecer quer depois do pôr do sol, vês num relance se é um grupo completo, um único parceiro, ou ainda ninguém — para decidires o que fazer."
    row3_li1: "Confirma ou recusa com um toque — sem trocas de mensagens de um lado para o outro"
    row3_li2: "Contagem de participantes em direto para decidires com informação antes de saíres"
    row3_li3: "Reutiliza o mesmo evento em cada corrida futura — sem teres de recomeçar do zero"
    row4_tag: "Partilha de localização em direto"
    row4_title: "Partilha a tua localização em direto com quem confias, só durante a corrida"
    row4_body: "Começa a partilhar a partir da atividade e escolhe quem te pode acompanhar: os participantes confirmados ou contactos de segurança que aceitaram o teu pedido. A partilha só está disponível em torno da atividade, podes parar a qualquer momento e não é um serviço de emergência."
    row4_li1: "Escolhe participantes confirmados ou os teus contactos de segurança aceites"
    row4_li2: "Disponível desde uma hora antes de a atividade começar até ao fim"
    row4_li3: "Pára quando quiseres; também termina quando essa janela se fecha"
    row4_alt: "Ecrã de partilha de localização em direto do Sports HQ com opções de público para participantes confirmados ou contactos de segurança"
    faq_tag: "Perguntas Frequentes"
    faq_title: "Perguntas sobre correr em grupo"
    faq1_q: "Como é que o Sports HQ me ajuda a organizar uma corrida em grupo mais segura?"
    faq1_a: "Cria um evento com pessoas que já conheces e em quem confias, marca-o como privado se preferires que fique só entre vocês, propõe uma hora e um percurso para a tua próxima corrida, e vê em tempo real quem confirmou antes de saíres."
    faq2_q: "Posso marcar o meu evento de corrida como privado?"
    faq2_a: "Sim. Os eventos são públicos por definição, mas podes marcar o teu como privado a qualquer momento, para que só os membros convidados o possam ver ou juntar-se."
    faq3_q: "O que acontece se ninguém confirmar?"
    faq3_a: "Vais ver isso claramente antes de saíres, para decidires se esperas, convidas alguém diretamente, ou escolhes outra hora ou percurso. O Sports HQ não pode garantir que haja sempre alguém livre para te acompanhar."
    faq4_q: "Pode um amigo acompanhar-me de bicicleta em vez de correr?"
    faq4_a: "Sim. Qualquer membro do teu evento pode confirmar presença numa corrida, quer corra ao teu lado quer te acompanhe de bicicleta como companhia e um par de olhos extra."
    faq5_q: "O Sports HQ oferece partilha de localização em direto e é um serviço de emergência?"
    faq5_a: "Sim à primeira, não à segunda. Durante uma atividade, podes escolher partilhar a tua localização em direto com os participantes confirmados ou com contactos de segurança que aceitaram o teu pedido, e podes parar a qualquer momento. A partilha só está disponível em torno da atividade — de uma hora antes do início até ao fim — e termina quando tocas em Parar ou a janela se fecha. O Sports HQ não contacta serviços de emergência, não envia alertas de emergência nem garante a segurança de ninguém; mantém à mão as funções de emergência do telemóvel ou um serviço de segurança dedicado, se precisares."
    download_headline: "Sabe quem confirmou, <span class=\"download__accent\">antes de saíres de casa.</span>"
    download_sub: "Faz download do Sports HQ gratuitamente e cria um círculo de corrida de confiança com quem podes contar."
