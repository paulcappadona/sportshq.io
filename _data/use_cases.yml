    row4_body: "Avvia la condivisione dall'attività e scegli chi può seguirti: i partecipanti confermati o i contatti di sicurezza che hanno accettato la tua richiesta. La condivisione è disponibile solo intorno all'attività, puoi interromperla in qualsiasi momento e non è un servizio di emergenza."
