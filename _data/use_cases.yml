    row1_title: "Registratie in seconden, geen papierwerk"
    row1_body: "Elke locatie krijgt zowel een QR-code als een deelbare link naar dezelfde registratiepagina — gebruik wat past bij het medium. Print de QR-code voor de receptie, een prikbord, of langs de baan; zet de link direct in een WhatsApp-groep, e-mail, of social post. Hoe dan ook, bezoekers komen op dezelfde pagina terecht en registreren in seconden."
    row1_li1: "QR-code om te printen — posters, tafelstandaards, borden langs de baan"
    row1_li2: "Link voor digitaal — WhatsApp, e-mail, social, je website"
    row1_li3: "Nieuwe leden verschijnen automatisch in je lijst met geregistreerde leden, hoe ze ook zijn aangesloten"
    row2_tag: "Vindbaarheid"
    row2_title: "Word gevonden door sporters die al in de buurt zijn"
    row2_body: "Sports HQ laat jouw locatie zien aan sporters die op de kaart zoeken naar een plek om te spelen. Elk lid dat je aan boord haalt, en elk evenement dat je host, vergroot de zichtbaarheid van je locatie voor nieuwe bezoekers in jouw regio."
    row2_li1: "Verschijn in locatiegebaseerde zoekresultaten voor jouw sport en regio"
    row2_li2: "Laat voorzieningen zien — banen, douches, kluisjes, parkeren — op je locatiepagina"
    row2_li3: "Georganiseerde evenementen op jouw locatie zijn onafhankelijk vindbaar, en trekken bezoekers aan die nooit eerder zijn geweest"
    row3_tag: "Community Opbouwen"
    row3_title: "Laat je leden elkaar vinden"
    row3_body: "Een ledenlijst is niet alleen een beheertool — het is de basis van een community. Leden kunnen zien wie er nog meer bij jou speelt, elkaar volgen, en hun eigen wedstrijden en meetups organiseren, allemaal verankerd aan jouw locatie."
    row3_li1: "Doorzoekbare directory van geregistreerde locatieleden"
    row3_li2: "Leden kunnen direct in de app berichten sturen, volgen, en connecten"
    row3_li3: "Stimuleert terugkerende bezoeken en organische groei via mond-tot-mondreclame"
    row4_tag: "Officiële Evenementen"
    row4_title: "Host de evenementen die mensen laten terugkomen"
    row4_body: "Organiseer een wekelijkse ledenborrel, een zondagcompetitie, of een maandelijks toernooi — maak het eenmalig aan als terugkerend schema en laat Sports HQ elke toekomstige instantie automatisch genereren."
    row4_step1_title: "Maak het terugkerende schema aan"
    row4_step1_body: "Stel de dag, tijd, en hoeveel weken vooruit instanties gegenereerd moeten worden in."
    row4_step2_title: "Leden bevestigen of wijzen af"
    row4_step2_body: "Pushmeldingen gaan automatisch uit naarmate elke instantie dichterbij komt."
    row4_step3_title: "Wachtlijsten vullen last-minute gaten"
    row4_step3_body: "Als een bevestigd lid afhaakt, wordt de volgende persoon in de rij direct op de hoogte gebracht."
    download_headline: "Zet je locatie op de <span class=\"download__accent\">kaart.</span>"
    download_sub: "Sluit je aan bij locatie-eigenaren die Sports HQ al gebruiken om incidentele bezoekers om te zetten in een loyale, actieve community."
