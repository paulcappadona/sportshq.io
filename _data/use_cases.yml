    row1_body: "Skapa ett event för personerna du verkligen vill ha vid din sida under en löprunda — träningspartners, vänner, familj, eller någon som följer med på cykel som sällskap, precis som partnern till en löpare i Gold Coast gör när han själv inte kan springa med henne. Lägg till dem som medlemmar, markera eventet som privat om du vill att det ska stanna inom din krets, och det är redo att återanvändas för varje framtida löprunda."
    row1_li1: "Markera ditt event som privat om du bara vill att inbjudna medlemmar ska se det"
    row1_li2: "Lägg till medlemmar med en länk eller QR-kod, utan separat kontoregistrering"
    row1_li3: "Fungerar lika bra för en fast löparpartner som för ett helt grannskapsgäng"
    row2_tag: "Bekräftelser i Realtid"
    row2_title: "Är någon ledig för din nästa löprunda? Ta reda på det på sekunder"
    row2_body: "Föreslå en löprunda så meddelas hela din krets direkt. Allt eftersom svaren kommer in ser du dem uppdateras live — inget behov av att jaga svar, och du behöver aldrig lämna hemmet utan att veta vem, om någon, som hänger på."
    row2_step1_title: "Föreslå din nästa löprunda"
    row2_step1_body: "Ange tid, mötesplats och rutt — vilken medlem som helst kan göra det."
    row2_step2_title: "Din krets meddelas direkt"
    row2_step2_body: "En push-notis når alla i samma stund den publiceras."
    row2_step3_title: "Bekräftelser kommer in live"
    row2_step3_body: "Se vem som är med och vem som inte är det uppdateras i realtid, ända fram till du ger dig av."
    row3_tag: "Live-Antal Deltagare"
    row3_title: "Se vem som deltar, och hur många, innan du bestämmer dig"
    row3_body: "En löpande summa av bekräftade och avböjda betyder att du slipper gissa. Oavsett om du ger dig av i gryningen eller efter solnedgången ser du snabbt om det blir fullt gäng, en enda partner, eller ännu ingen — så du kan bestämma vad du gör härnäst."
    row3_li1: "Bekräfta eller avböj med ett tryck — inget fram-och-tillbaka-meddelande"
    row3_li2: "Live-antal deltagare så du kan fatta ett informerat beslut innan du ger dig av"
    row3_li3: "Återanvänd samma event för varje framtida löprunda — ingen ny uppsättning behövs"
    row4_tag: "Delning av live-position"
    row4_title: "Dela din live-position med människor du litar på, bara under löprundan"
    row4_body: "Starta delningen från aktiviteten och välj vem som kan följa dig: dess bekräftade deltagare eller säkerhetskontakter som har godkänt din förfrågan. Delning är bara möjlig runt aktiviteten, du kan sluta när som helst och det är ingen räddningstjänst."
    row4_li1: "Välj bekräftade deltagare eller dina godkända säkerhetskontakter"
    row4_li2: "Tillgänglig från en timme före aktivitetens start till dess slut"
    row4_li3: "Avsluta när du vill; delningen upphör också när tidsfönstret stängs"
    row4_alt: "Sports HQ-vy för delning av live-position med målgruppsval för bekräftade deltagare eller säkerhetskontakter"
    faq_tag: "Vanliga Frågor"
    faq_title: "Frågor om grupplöpning"
    faq1_q: "Hur hjälper Sports HQ mig att organisera en säkrare grupplöpning?"
    faq1_a: "Skapa ett event med personer du redan känner och litar på, markera det som privat om du vill att det stannar mellan er, föreslå tid och rutt för din nästa löprunda, och se i realtid vem som har bekräftat innan du ger dig av."
    faq2_q: "Kan jag markera mitt löpevent som privat?"
    faq2_a: "Ja. Event är offentliga som standard, men du kan när som helst markera ditt som privat så att bara de medlemmar du bjuder in kan se det eller gå med."
    faq3_q: "Vad händer om ingen bekräftar?"
    faq3_a: "Du ser det tydligt innan du ger dig av, så att du kan bestämma om du ska vänta, bjuda in någon direkt, eller välja en annan tid eller rutt. Sports HQ kan inte garantera att någon alltid är ledig att följa med."
    faq4_q: "Kan en vän följa med på cykel istället för att springa?"
    faq4_a: "Ja. Vilken medlem som helst i ditt event kan bekräfta för en löprunda, oavsett om de springer bredvid dig eller följer med på cykel som sällskap och ett extra par ögon."
    faq5_q: "Erbjuder Sports HQ delning av live-position, och är det en räddningstjänst?"
    faq5_a: "Ja på den första, nej på den andra. Under en aktivitet kan du välja att dela din live-position med dess bekräftade deltagare eller med säkerhetskontakter som har godkänt din förfrågan, och du kan sluta när som helst. Delning är bara möjlig runt aktiviteten – från en timme före start till slut – och avslutas när du trycker på Stopp eller tidsfönstret stängs. Sports HQ kontaktar inte räddningstjänst, skickar inga nödaviseringar och garanterar ingens säkerhet; ha telefonens nödfunktioner eller en särskild säkerhetstjänst nära till hands om du behöver dem."
    download_headline: "Vet vem som har bekräftat, <span class=\"download__accent\">innan du lämnar hemmet.</span>"
    download_sub: "Ladda ner Sports HQ gratis och bygg en pålitlig löparkrets du kan räkna med."
  youth_sports:
    badge: "För ungdomsklubbar, tränare & föräldrar"
    title: "Ungdomsidrott, <span>godkänd av föräldrar.</span>"
    sub: "Att leda ett ungdomslag betyder att jonglera föräldrar, tillstånd och ändringar i sista stund över ett dussin gruppchattar. Med Sports HQ hanterar vårdnadshavare barnets evenemangsmedlemskap och närvaro, medan tränare samlar schema och närvaro på ett ställe."
    intro: "du är tränare, ledare eller ideellt engagerad i en ungdomsklubb, ett skollag eller en helgakademi – och vill ha föräldrarna med i loopen, barnens profiler hanterade av en vuxen och ett enkelt sätt att se vem som kommer på träning."
    row1_tag: "Vårdnadshavarkonton"
    row1_title: "Föräldrar behåller kontrollen över barnets profil"
    row1_body: "Med vårdnadshavarkonton kan en förälder eller målsman hantera en minderårigs evenemangsmedlemskap och aktivitetsnärvaro och ta emot aviseringar å dennes vägnar. Barnen spelar; de vuxna håller sig informerade."
    row1_li1: "Ett vårdnadshavarkonto hanterar ungdomens profil"
    row1_li2: "Medlemsförfrågningar hanterade av vårdnadshavare inom ungdomsidrott"
    row1_li3: "Åldersfilter hjälper till att hålla evenemang lämpliga för åldersgruppen"
    row2_tag: "Godkännandeflöden"
    row2_title: "Styr vem som går med i ditt ungdomslag"
    row2_body: "Gör ditt lag eller pass privat och granska varje förfrågan att gå med. Dela en länk eller QR-kod i klubbstugan eller vid skolgrinden och godkänn de familjer du väntar dig."
    row2_step1_title: "Dela din länk eller QR-kod"
    row2_step1_body: "Skriv ut den till klubbstugan eller skicka den i föräldragruppen."
    row2_step2_title: "Familjer ansöker om att gå med"
    row2_step2_body: "Vårdnadshavare skickar medlemsförfrågningar för sitt barns räkning."
    row2_step3_title: "Du godkänner vilka som är med"
    row2_step3_body: "Admins granskar förfrågningar och håller koll på truppen."
    row3_tag: "Träningsdagen gjord enkel"
    row3_title: "Vet vem som kommer på träning innan du åker till planen"
    row3_body: "Återkommande pass skapas automatiskt från din mall. Föräldrar tackar ja eller nej med ett tryck, väntelistor tar hand om fulla grupper och lagfärger gör att du slipper västar."
    row3_li1: "Återkommande veckoträningar och matchdagar"
    row3_li2: "Platsbegränsningar och väntelistor för trupper och läger"
    row3_li3: "Valfri tilldelning av lagfärger – inga västar behövs"
    faq_tag: "Vanliga frågor"
    faq_title: "Frågor om ungdomsidrott på Sports HQ"
    faq1_q: "Hur hanterar föräldrar sitt barns profil på Sports HQ?"
    faq1_a: "Föräldrar och målsmän lägger till sitt barn på sitt eget konto. De kan sedan hantera barnets evenemangsmedlemskap och aktivitetsnärvaro och ta emot aviseringar å barnets vägnar. Ett barn som lagts till på detta sätt syns inte för andra användare, utom i evenemang och aktiviteter där en vårdnadshavare har anmält barnet."
    faq2_q: "Kan jag godkänna vem som går med i mitt ungdomslag?"
    faq2_a: "Ja. Gör ditt evenemang privat och granska medlemsförfrågningar innan någon går med. Inom ungdomsidrott hanteras förfrågningarna av barnets vårdnadshavare."
    faq3_q: "Kan tränare och föräldrar chatta i appen?"
    faq3_a: "Ja. Du kan aktivera en valfri chatt för valfritt evenemang, aktivitet eller anläggning, och admins styr vem som får posta och dela foton."
    faq4_q: "Passar Sports HQ för barn?"
    faq4_a: "Sports HQ har vårdnadshavarkonton, åldersfilter och privata evenemang som hjälper familjer att spela tryggt. Som med alla appar rekommenderar vi att föräldrar förblir delaktiga i de profiler och grupper deras barn går med i."
    download_headline: "Färre blanketter. <span class=\"download__accent\">Mer träning.</span>"
    download_sub: "Ladda ner Sports HQ gratis och samla föräldrar, spelare och tränare på ett ställe."
