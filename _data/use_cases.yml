    row4_li2: "Mitglieder auf der Warteliste werden sofort benachrichtigt, sobald ein Platz frei wird"
    row4_li3: "Funktioniert automatisch bei jeder wiederkehrenden Instanz"
    download_headline: "Führe dein Team ohne die <span class=\"download__accent\">Tabelle.</span>"
    download_sub: "Lade Sports HQ kostenlos herunter und plane deine nächste Session in Minuten."
  social_sports_group:
    meta_title: "Sportgruppen-App: Mitglieder & Zusagen verwalten | Sports HQ"
    meta_desc: "Leite eine große Sportgruppe ohne Chaos: öffentliche oder private Events, Beitrittslinks, Spielerlimits, Wartelisten, Zusagen und automatische Erinnerungen."
    crumb: "Soziale Sportgruppen"
    badge: "Für große soziale Sportgruppen"
    title: "Eine große Gruppe, ohne <span>Chaos.</span>"
    sub: "Sobald eine soziale Sportgruppe ein paar Dutzend Mitglieder überschreitet, funktionieren Gruppenchats nicht mehr — Nachrichten gehen unter, neue Mitglieder wissen nicht, wie sie beitreten, und niemand ist sicher, wer wirklich kommt. Sports HQ gibt deiner Gruppe Struktur: kontrollierte Mitgliedschaft, begrenzte Sessions und automatische Erinnerungen."
    intro: "du eine Sportgruppe administrierst, die über den Punkt hinausgewachsen ist, an dem ein Gruppenchat noch mithalten kann — eine Fußball-Sozialrunde, eine Touch-Rugby-Gruppe, eine Netball-Liga, ein Kletter-Meetup — mit Dutzenden oder Hunderten Mitgliedern über mehrere regelmäßige Sessions hinweg."
    row1_tag: "Mitgliedschaftskontrolle"
    row1_title: "Öffentlich, privat, oder irgendwo dazwischen"
    row1_body: "Lege die Aktivität deiner Gruppe als Event-Vorlage an. Mach sie öffentlich und auffindbar für organisches Wachstum, oder privat, damit die Mitgliedschaft vollständig kontrolliert ist — nur sichtbar für die, die du reinlässt."
    row1_li1: "Private Events sind komplett aus Suche und Auffindbarkeit ausgeblendet"
    row1_li2: "Sicherheits- und Mitgliedschaftseinstellungen werden pro Event konfiguriert"
    row1_li3: "Wechsle eine Gruppe jederzeit von \"nur auf Einladung\" zu offenem Wachstum"
    row2_tag: "Mühelose Aufnahme"
    row2_title: "Ein Link erledigt den ganzen Job"
    row2_body: "Teile einen einzigen Link in einer WhatsApp-Gruppe, einer E-Mail-Signatur oder einem Social-Post — oder drucke den passenden QR-Code für Poster und Schwarze Bretter. Beides bringt ein neues Mitglied mit einem Fingertipp oder Scan zur selben Beitrittsseite."
    row2_li1: "Schluss damit, jedem neuen Mitglied \"wie trete ich bei\" zu erklären"
    row2_li2: "Wähle Link oder QR-Code passend dazu, wo du gerade rekrutierst"
    row2_li3: "Funktioniert, egal ob der Empfänger Sports HQ schon hat oder nicht"
    row3_tag: "Terminplanung nach deiner Art"
    row3_title: "Manuelle Kontrolle, wiederkehrender Komfort"
    row3_body: "Plane Aktivitäten manuell für spontane Sessions, oder lege ein wiederkehrendes Muster für dein reguläres wöchentliches Match fest — und wechsle zwischen beidem, wie es der Kalender deiner Gruppe verlangt."
    row3_li1: "Push-Benachrichtigungen gehen an jedes Mitglied, sobald eine Session erstellt wird oder sich ändert"
    row3_li2: "Mitglieder sagen mit einem Fingertipp zu oder ab"
    row3_li3: "Erinnerungen gehen automatisch raus, sobald die Session näher rückt"
    row4_tag: "Kapazität & Wartelisten"
    row4_title: "Gruppengröße begrenzen, ohne jemanden abzuweisen"
    row4_body: "Lege eine maximale Teilnehmerzahl fest, die zu deinem Platz oder deiner Anlagenkapazität passt. Sobald eine Session voll ist, landen neue Anmeldungen automatisch auf einer Warteliste, statt verloren zu gehen."
    row4_step1_title: "Lege deine maximale Gruppengröße fest"
    row4_step1_body: "Sessions akzeptieren keine Zusagen mehr, sobald das Limit erreicht ist."
    row4_step2_title: "Zusätzliche Anmeldungen landen auf der Warteliste"
    row4_step2_body: "Niemand wird direkt abgewiesen — sie werden automatisch eingereiht."
    row4_step3_title: "Plätze füllen sich von selbst"
    row4_step3_body: "Sagt ein bestätigtes Mitglied ab, wird das nächste Mitglied auf der Warteliste sofort benachrichtigt."
