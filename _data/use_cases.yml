  safe_group_runs:
    meta_title: "Veiliger samen hardlopen voor vrouwen | Sports HQ"
    meta_desc: "Liever niet alleen hardlopen? Maak een evenement met vertrouwde looppartners, desgewenst privé, zie wie bevestigd heeft en deel optioneel je live locatie."
    crumb: "Veiliger Groep Hardlopen"
    badge: "Voor vrouwen en iedereen die liever niet alleen hardloopt"
    title: "Veiliger Groep Hardlopen <span>met Mensen die je Vertrouwt</span>"
    sub: "Hardlopen zou je een gevoel van vrijheid moeten geven, geen angst. Je zou je routine niet moeten hoeven aanpassen vanwege intimidatie — maar als je liever gezelschap hebt tijdens vroege ochtend-, avond- of rustigere routes, helpt Sports HQ je een event aan te maken met vrienden, familie en hardloopmaatjes die je vertrouwt, dit privé te zetten als je wilt dat het alleen tussen jullie blijft, en precies te zien wie heeft bevestigd voordat je de deur uit gaat."
    sub2: "Of ze nu naast je rennen of je op de fiets begeleiden, je weet wanneer iemand die je vertrouwt zich heeft gecommitteerd om mee te doen."
    cta_primary: "Maak je Hardloopevent"
    cta_secondary: "Bekijk Hoe Groep Hardlopen Werkt"
    intro: "je liever niet alleen hardloopt — vooral vroeg in de ochtend, na het donker, of op rustigere routes — maar de agenda's van je hardloopmaatjes nooit echt overeenkomen. Sports HQ coördineert mensen die je al kent en vertrouwt en kan, als je dat kiest, tijdens een activiteit je live locatie delen; het is geen alarmdienst en geen garantie voor veiligheid."
    row1_tag: "Jouw Vertrouwde Kring"
    row1_title: "Een event gebouwd rond mensen die je al vertrouwt, klaar wanneer jij het nodig hebt"
    row1_body: "Maak een event voor de mensen die je echt naast je zou willen hebben tijdens een hardloopsessie — trainingsmaatjes, vrienden, familie, of iemand die je op de fiets begeleidt, zoals de partner van een hardloopster in Gold Coast doet wanneer hij zelf niet kan meelopen. Voeg ze toe als leden, zet het event op privé als je wilt dat het alleen binnen jouw kring blijft, en het staat klaar om steeds opnieuw te gebruiken voor elke toekomstige hardloopsessie."
    row1_li1: "Zet je event op privé als je wilt dat het alleen zichtbaar is voor leden die je uitnodigt"
    row1_li2: "Voeg leden toe met een link of QR-code, zonder aparte accountaanmaak"
    row1_li3: "Werkt net zo goed voor één vaste hardloopmaatje als voor een hele buurtcrew"
    row2_tag: "Bevestigingen in Realtime"
    row2_title: "Heeft iemand tijd voor je volgende hardloopsessie? Weet het binnen seconden"
    row2_body: "Stel een hardloopsessie voor en je hele kring krijgt direct een melding. Terwijl reacties binnenkomen, zie je ze live worden bijgewerkt — geen mensen hoeven achterna te zitten voor een antwoord, en nooit de deur uit zonder te weten wie er, als iemand, meedoet."
    row2_step1_title: "Stel je volgende hardloopsessie voor"
    row2_step1_body: "Stel tijd, verzamelpunt en route in — elk lid kan dit doen."
    row2_step2_title: "Jouw kring krijgt direct een melding"
    row2_step2_body: "Een pushmelding bereikt iedereen op het moment dat deze wordt geplaatst."
    row2_step3_title: "Bevestigingen komen live binnen"
    row2_step3_body: "Bekijk wie er wel en niet bij is, live bijgewerkt tot het moment dat je vertrekt."
    row3_tag: "Live Aantal Aanwezigen"
    row3_title: "Zie wie er meedoet, en hoeveel, voordat je je vastlegt"
    row3_body: "Een live totaal van bevestigingen en afmeldingen betekent dat je niet hoeft te gokken. Of je nu bij zonsopgang of na zonsondergang vertrekt, je ziet in één oogopslag of het een volledige groep, één maatje, of nog niemand is — zodat je kunt beslissen wat je doet."
    row3_li1: "Bevestig of wijs af met één tik — geen heen-en-weer berichten"
    row3_li2: "Live aantal aanwezigen zodat je vóór vertrek een weloverwogen keuze kunt maken"
    row3_li3: "Hergebruik hetzelfde event voor elke toekomstige hardloopsessie — geen nieuwe opzet nodig"
    row4_tag: "Live locatie delen"
    row4_title: "Deel je live locatie met mensen die je vertrouwt, alleen voor de run"
    row4_body: "Start het delen vanuit de activiteit en kies wie je mag volgen: de bevestigde deelnemers of veiligheidscontacten die je verzoek hebben geaccepteerd. Delen is alleen mogelijk rond de activiteit, je kunt op elk moment stoppen en het is geen hulpdienst."
    row4_li1: "Kies bevestigde deelnemers of je geaccepteerde veiligheidscontacten"
    row4_li2: "Beschikbaar vanaf een uur voor de start van de activiteit tot het einde"
    row4_li3: "Stop wanneer je wilt; het eindigt ook als dat tijdvenster sluit"
    row4_alt: "Sports HQ-scherm voor het delen van je live locatie met publieksopties voor bevestigde deelnemers of veiligheidscontacten"
    faq_tag: "Veelgestelde Vragen"
    faq_title: "Vragen over groep hardlopen"
    faq1_q: "Hoe helpt Sports HQ me bij het organiseren van veiliger groep hardlopen?"
    faq1_a: "Maak een event met mensen die je al kent en vertrouwt, zet het op privé als je wilt dat het alleen tussen jullie blijft, stel een tijd en route voor je volgende hardloopsessie voor, en zie in realtime wie heeft bevestigd voordat je vertrekt."
    faq2_q: "Kan ik mijn hardloopevent op privé zetten?"
    faq2_a: "Ja. Events zijn standaard openbaar, maar je kunt die van jou op elk moment op privé zetten, zodat alleen de leden die je uitnodigt het kunnen zien of bijwonen."
    faq3_q: "Wat gebeurt er als niemand bevestigt?"
    faq3_a: "Dat zie je duidelijk voordat je vertrekt, zodat je kunt beslissen of je wacht, iemand direct uitnodigt, of een andere tijd of route kiest. Sports HQ kan niet garanderen dat er altijd iemand beschikbaar is om mee te gaan."
    faq4_q: "Kan een vriend(in) op de fiets meerijden in plaats van meelopen?"
    faq4_a: "Ja. Elk lid van je event kan bevestigen voor een hardloopsessie, of ze nu naast je rennen of je op de fiets begeleiden als gezelschap en een extra paar ogen."
    faq5_q: "Biedt Sports HQ live locatie delen, en is het een alarmdienst?"
    faq5_a: "Ja op het eerste, nee op het tweede. Tijdens een activiteit kun je ervoor kiezen je live locatie te delen met de bevestigde deelnemers of met veiligheidscontacten die je verzoek hebben geaccepteerd, en je kunt op elk moment stoppen. Delen is alleen mogelijk rond de activiteit — vanaf een uur voor de start tot het einde — en stopt als je op Stop tikt of het tijdvenster sluit. Sports HQ belt geen hulpdiensten, stuurt geen noodmeldingen en garandeert niemands veiligheid; houd zo nodig de noodfuncties van je telefoon of een speciale veiligheidsdienst bij de hand."
    download_headline: "Weet wie er heeft bevestigd, <span class=\"download__accent\">voordat je de deur uit gaat.</span>"
    download_sub: "Download Sports HQ gratis en bouw een vertrouwde hardloopkring op waar je op kunt rekenen."
