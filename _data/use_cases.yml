    sub: "Inget dödar en veckomatch som ett sent återbud. Sports HQ kan puffa på medlemmar som inte svarat, skicka \"en till behövs\"-aviseringar och meddela nästa person på väntelistan när en plats blir ledig – för att hjälpa en match för tio att nå tio."
    intro: "du arrangerar en veckovis fotbollsmatch, volleybollkväll, pickleballstege eller ligalag och ständigt letar ersättare en timme före avspark."
