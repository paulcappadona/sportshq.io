  fill_the_last_spot:
    meta_title: "Ache um substituto rápido: complete todas as vagas | Sports HQ"
    meta_desc: "Falta um jogador? Alertas de «falta um», lembretes para quem não confirmou e listas de espera ajudam seu racha ou liga a completar todas as vagas."
    badge: "Para organizadores que odeiam cancelar jogos"
    title: "Falta um jogador? <span>Complete todas as vagas.</span>"
    sub: "Nada acaba com o jogo semanal como uma desistência em cima da hora. O Sports HQ pode cutucar quem não respondeu, enviar alertas de \"falta um\" e avisar a próxima pessoa da lista de espera quando abre uma vaga — para ajudar um jogo de dez a chegar a dez."
    intro: "você organiza toda semana um racha de futebol, uma noite de vôlei, um ranking de pickleball ou um time de liga, e vive correndo atrás de um substituto uma hora antes do jogo."
