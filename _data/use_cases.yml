    cta_secondary: "Lihat Cara Kerja Lari Kelompok"
    intro: "kamu lebih suka tidak lari sendirian — terutama pagi-pagi buta, setelah gelap, atau di rute yang sepi — tapi jadwal partner larimu tidak pernah pas. Sports HQ mengoordinasikan orang-orang yang sudah kamu kenal dan percaya, dan jika kamu mau, bisa membagikan lokasi langsungmu selama aktivitas; ini bukan layanan darurat dan bukan jaminan keselamatan."
    row1_tag: "Lingkaran Terpercayamu"
    row1_title: "Event yang dibangun di sekitar orang-orang yang sudah kamu percaya, siap kapan pun kamu butuhkan"
    row1_body: "Buat event untuk orang-orang yang benar-benar ingin kamu ajak lari bareng — partner latihan, teman, keluarga, atau seseorang yang menemani dengan sepeda, seperti yang dilakukan pasangan seorang pelari di Gold Coast saat dia sendiri tidak bisa ikut lari. Tambahkan mereka sebagai anggota, tandai event sebagai privat kalau kamu ingin itu hanya untuk lingkaranmu, dan siap dipakai lagi untuk setiap lari berikutnya."
    row1_li1: "Tandai eventmu sebagai privat kalau kamu ingin hanya terlihat oleh anggota yang kamu undang"
    row1_li2: "Tambahkan anggota dengan link atau kode QR, tanpa perlu bikin akun terpisah"
    row1_li3: "Cocok untuk satu partner lari tetap maupun untuk satu geng tetangga"
    row2_tag: "Konfirmasi Real-Time"
    row2_title: "Ada yang senggang untuk lari berikutnya? Cari tahu dalam hitungan detik"
    row2_body: "Ajukan rencana lari dan seluruh lingkaranmu langsung dapat notifikasi. Saat balasan mulai masuk, kamu bisa lihat update-nya secara langsung — tidak perlu kejar-kejar orang untuk balas, dan tidak perlu keluar rumah tanpa tahu siapa, kalau ada, yang akan ikut."
    row2_step1_title: "Ajukan lari berikutnya"
    row2_step1_body: "Tentukan waktu, titik kumpul, dan rute — anggota mana pun bisa melakukannya."
    row2_step2_title: "Lingkaranmu langsung dapat notifikasi"
    row2_step2_body: "Notifikasi push sampai ke semua orang begitu diposting."
    row2_step3_title: "Konfirmasi masuk secara langsung"
    row2_step3_body: "Lihat siapa yang ikut dan siapa yang tidak, ter-update secara real-time, sampai saat kamu berangkat."
    row3_tag: "Hitungan Kehadiran Langsung"
    row3_title: "Lihat siapa yang ikut, dan berapa banyak, sebelum kamu memutuskan"
    row3_body: "Total langsung dari yang konfirmasi dan menolak berarti kamu tidak perlu menebak-nebak. Baik kamu berangkat saat subuh atau setelah matahari terbenam, kamu bisa lihat sekilas apakah rombongannya penuh, cuma satu partner, atau belum ada sama sekali — jadi kamu bisa memutuskan langkah selanjutnya."
    row3_li1: "Konfirmasi atau tolak dengan satu tap — tanpa pesan bolak-balik"
    row3_li2: "Hitungan peserta langsung supaya kamu bisa mengambil keputusan yang tepat sebelum berangkat"
    row3_li3: "Pakai lagi event yang sama untuk setiap lari berikutnya — tidak perlu mulai dari awal"
    row4_tag: "Berbagi Lokasi Langsung"
    row4_title: "Bagikan lokasi langsungmu dengan orang yang kamu percaya, hanya selama lari"
    row4_body: "Mulai berbagi dari aktivitas dan pilih siapa yang bisa mengikutimu: peserta yang sudah terkonfirmasi, atau kontak keselamatan yang sudah menerima permintaanmu. Berbagi hanya tersedia di sekitar aktivitas, bisa kamu hentikan kapan saja, dan bukan layanan darurat."
    row4_li1: "Pilih peserta terkonfirmasi atau kontak keselamatanmu yang sudah menerima"
    row4_li2: "Tersedia dari satu jam sebelum aktivitas dimulai hingga selesai"
    row4_li3: "Hentikan kapan saja; berbagi juga berakhir saat jendela waktunya habis"
    row4_alt: "Lembar berbagi lokasi langsung Sports HQ dengan pilihan audiens untuk peserta terkonfirmasi atau kontak keselamatan"
    faq_tag: "Pertanyaan Umum"
    faq_title: "Pertanyaan seputar lari kelompok"
    faq1_q: "Bagaimana Sports HQ membantuku mengatur lari kelompok yang lebih aman?"
    faq1_a: "Buat event bersama orang-orang yang sudah kamu kenal dan percaya, tandai sebagai privat kalau kamu ingin itu hanya untuk kalian, ajukan waktu dan rute untuk lari berikutnya, dan lihat secara real-time siapa yang sudah konfirmasi sebelum kamu berangkat."
    faq2_q: "Bisakah aku menandai event lariku sebagai privat?"
    faq2_a: "Bisa. Event bersifat publik secara default, tapi kamu bisa menandai eventmu sebagai privat kapan saja supaya hanya anggota yang kamu undang yang bisa melihat atau bergabung."
    faq3_q: "Apa yang terjadi kalau tidak ada yang konfirmasi?"
    faq3_a: "Kamu akan melihatnya dengan jelas sebelum berangkat, jadi kamu bisa memutuskan mau menunggu, mengundang seseorang langsung, atau memilih waktu atau rute lain. Sports HQ tidak bisa menjamin akan selalu ada orang yang senggang untuk menemanimu."
    faq4_q: "Bisakah teman menemaniku dengan sepeda, bukan ikut lari?"
    faq4_a: "Bisa. Anggota mana pun di eventmu bisa konfirmasi untuk sebuah lari, baik lari di sampingmu maupun menemani dengan sepeda sebagai teman dan pasangan mata ekstra."
    faq5_q: "Apakah Sports HQ menyediakan berbagi lokasi langsung, dan apakah ini layanan darurat?"
    faq5_a: "Ya untuk yang pertama, tidak untuk yang kedua. Selama aktivitas, kamu bisa memilih membagikan lokasi langsung dengan peserta yang sudah terkonfirmasi atau kontak keselamatan yang menerima permintaanmu, dan bisa berhenti kapan saja. Berbagi hanya tersedia di sekitar aktivitas — dari satu jam sebelum mulai hingga selesai — dan berhenti saat kamu mengetuk Berhenti atau jendela waktunya berakhir. Sports HQ tidak menghubungi layanan darurat, tidak mengirim peringatan darurat, dan tidak menjamin keselamatan siapa pun; siapkan fitur darurat ponselmu atau layanan keselamatan khusus jika membutuhkannya."
