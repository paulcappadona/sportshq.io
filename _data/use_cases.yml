    meta_title: "Bedrijfscompetitie-app: aanmeldingen & planning | Sports HQ"
    meta_desc: "Run je bedrijfssportcompetitie zonder spreadsheet: makkelijk aanmelden, terugkerende planning, aan- en afmeldingen, selecties en wachtlijsten in één gratis app."
