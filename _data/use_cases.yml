    row2_li1: "Chega de explicar \"como eu entro\" para cada novo membro"
    row2_li2: "Escolha link ou código QR de acordo com onde tu está recrutando"
    row2_li3: "Funciona tendo ou não a pessoa já instalado o Sports HQ"
    row3_tag: "Agende do Teu Jeito"
    row3_title: "Controle manual, praticidade recorrente"
    row3_body: "Agende atividades manualmente para sessões avulsas, ou defina um padrão recorrente para tua partida semanal de sempre — e alterne entre os dois conforme a agenda do teu grupo exigir."
    row3_li1: "Notificações push chegam a cada membro no momento em que uma sessão é criada ou muda"
    row3_li2: "Membros confirmam ou recusam presença com um único toque"
    row3_li3: "Lembretes saem automaticamente conforme a sessão se aproxima"
    row4_tag: "Capacidade e Listas de Espera"
    row4_title: "Limite o tamanho do grupo sem recusar ninguém"
    row4_body: "Defina um número máximo de participantes de acordo com a capacidade do teu campo, quadra, ou local. Assim que uma sessão lota, novas inscrições entram automaticamente numa lista de espera em vez de se perderem."
    row4_step1_title: "Defina o tamanho máximo do teu grupo"
    row4_step1_body: "As sessões param de aceitar confirmações assim que o limite é atingido."
    row4_step2_title: "Inscrições extras entram na lista de espera"
    row4_step2_body: "Ninguém é recusado diretamente — são colocados na fila automaticamente."
    row4_step3_title: "As vagas se preenchem sozinhas"
    row4_step3_body: "Quando um membro confirmado recusa, o próximo da lista de espera é notificado instantaneamente."
    download_headline: "Coloque ordem num <span class=\"download__accent\">grupo grande.</span>"
    download_sub: "Descarrega o Sports HQ grátis e dê ao teu grupo social esportivo a estrutura que já ficou grande demais para um chat em grupo."
  communal_field_community:
    crumb: "Comunidades de Campos Comunitários"
    badge: "Para Comunidades de Campos e Instalações Comunitárias"
    title: "Mesmo Campo. Mesmas Caras. <span>Agora uma Comunidade.</span>"
    sub: "Tu e alguns fiéis dividem a mesma quadra pública, campo de parque, ou campo comunitário — mas nunca chegaram a conhecer todo mundo que joga ali. O Sports HQ transforma esse espaço compartilhado numa comunidade real e organizada, sem precisar ser dono do local."
    intro: "tu joga regularmente no mesmo campo, quadra, ou parque comunitário — e não precisa ser dono do local para construir uma comunidade ali. Tu só precisa de uma forma de quem aparece se encontrar."
    row1_tag: "Comece"
    row1_title: "Crie teu evento, depois escolha como compartilhar"
    row1_body: "Crie teu evento no Sports HQ e tu recebe um código QR e um link de entrada para a mesma página. Imprima o QR e deixe uma cópia ou duas no campo — colada num poste, banco, ou placar — ou compartilhe o link no chat em grupo para quem ainda não está no local."
    row1_li1: "Não precisa ser dono do local nem passar por processo de inscrição para começar"
    row1_li2: "Código QR para o próprio campo; link para o chat em grupo — use um, ou os dois"
    row1_li3: "Novos jogadores entram no momento em que escaneiam ou tocam — sem esperar um administrador"
    row2_tag: "Capacidade de Descoberta"
    row2_title: "Encontrado por qualquer pessoa que busque por perto"
    row2_body: "Além do código QR, teu evento é descoberto por busca de localização — assim um corredor, jogador de futebol, ou basquete que passe pela região pode encontrar tua comunidade e aparecer para jogar."
    row2_li1: "Apareça nos resultados de busca do mapa para teu esporte e localização"
    row2_li2: "Faça teu grupo de fiéis crescer além de quem viu a placa por acaso"
    row2_li3: "Funciona junto com o código QR, não no lugar dele"
    row3_tag: "Comunidade de Verdade"
    row3_title: "Coloque nome nos rostos que tu vê toda semana"
    row3_body: "Depois que as pessoas se registam no evento do teu campo, elas podem ver os perfis umas das outras, seguir os fiéis, e mandar mensagem direto — transformando \"as pessoas que jogam no parque\" numa rede de verdade."
    row3_li1: "O diretório de membros mostra todos os registados no evento"
    row3_li2: "Mensagens integradas eliminam a necessidade de um chat em grupo separado"
    row3_li3: "Incentiva as pessoas a organizarem tuas próprias sessões de forma independente"
    row4_tag: "Coordenação"
    row4_title: "Coordenação fácil de atividades, sem sobrecarga administrativa"
    row4_body: "Agende uma corrida semanal recorrente, crie sessões avulsas, ou deixe qualquer membro confirmado propor uma nova atividade — presença, lembretes, e atualizações são tratados automaticamente."
    row4_li1: "Horários recorrentes mantêm teu horário de sempre rodando sem manutenção manual"
    row4_li2: "Notificações push avisam todo mundo sobre novas sessões ou mudanças na hora"
    row4_li3: "Confirmar/recusar com um toque mantém a contagem precisa"
    download_headline: "Construa uma comunidade em torno do teu <span class=\"download__accent\">campo.</span>"
    download_sub: "Descarrega o Sports HQ grátis, crie teu evento, e imprima teu primeiro código QR hoje mesmo."

- id: ru
  run_club:
    crumb: "Беговые клубы"
    badge: "Для спонтанных беговых клубов"
    title: "Меньше переписки. <span>Больше бега.</span>"
    sub: "Твой беговой клуб не живёт по расписанию — всё зависит от того, кто свободен сегодня вечером. Sports HQ заменяет бесконечный групповой чат мгновенными уведомлениями и подтверждением в один тап, чтобы ты тратил меньше времени на координацию и больше — на бег."
    intro: "ты организуешь беговой клуб, тренировочную группу, или любую групповую активность, которая предлагается в последний момент, а не планируется за недели вперёд — и тебе надоело писать \"кто сегодня бежит?\" в групповом чате."
    row1_tag: "Централизованное общение"
    row1_title: "Одно событие, одна команда, никакого шума"
    row1_body: "Создай свой беговой клуб как событие в Sports HQ один раз и добавь свою команду. С этого момента каждая активность, обновление и напоминание проходят через приложение — а не через три разных чата."
    row1_li1: "Настрой один раз — используй для каждой будущей пробежки"
    row1_li2: "Работает так же хорошо для любого вида спорта, не только бега"
    row1_li3: "Добавляй участников по ссылке в групповом чате или QR-коду на листе записи — как удобнее"
    row2_tag: "Мгновенные уведомления"
    row2_title: "Предложи сегодняшнюю пробежку, оповести всех мгновенно"
    row2_body: "Любой участник может создать активность для команды — предложить дату, время и маршрут, и каждый мгновенно получает push-уведомление. Никаких административных задержек, никакого ожидания, пока кто-то \"увидит\" сообщение."
    row2_step1_title: "Кто-то предлагает пробежку"
    row2_step1_body: "Любой участник может создать активность — не обязательно организатор."
    row2_step2_title: "Все оповещаются одновременно"
    row2_step2_body: "Push-уведомление отправляется в момент создания активности."
    row2_step3_title: "Ответы приходят мгновенно"
    row2_step3_body: "Подтверди или откажись в один тап — печатать ничего не нужно."
    row3_tag: "Мгновенное подтверждение"
    row3_title: "Узнай, кто бежит, ещё до выхода из дома"
    row3_body: "Смотри посещаемость сегодняшней пробежки в реальном времени — кто подтвердил, кто отказался, а кто ещё не ответил — не отправляя ни одного напоминания."
    row3_li1: "Подтверждение/отказ в один тап полностью убирает переписку туда-сюда"
    row3_li2: "Минимизирует организационную нагрузку, чтобы команда сосредоточилась на тренировках"
    row3_li3: "Тот же процесс работает для любого спорта или активности в Sports HQ"
    download_headline: "Меньше времени на организацию, <span class=\"download__accent\">больше времени на бег.</span>"
    download_sub: "Скачай Sports HQ бесплатно и организуй сегодняшнюю пробежку за секунды."
  venue_owners:
    crumb: "Владельцы площадок"
    badge: "Для владельцев площадок и объектов"
    title: "Преврати посетителей в <span>сообщество.</span>"
    sub: "Ты управляешь теннисным клубом, скалодромом, многофункциональным комплексом или общественным полем — и знаешь, что твои участники играли бы больше и оставались дольше, если бы знали друг друга. Sports HQ даёт каждому объекту встроенный слой сообщества: регистрация, поиск, планирование и общение — всё в одном приложении."
    cta_primary: "Зарегистрируй свою площадку"
    intro: "ты владеешь или управляешь объектом, комплексом или площадкой — теннисным клубом, спортзалом, спортивным залом, скалодромом или общественным полем — и хочешь построить активное, постоянное сообщество посетителей вместо разовых, анонимных бронирований."
    row1_tag: "Лёгкое подключение"
    row1_title: "Регистрация за секунды, а не бумажная волокита"
    row1_body: "Каждая площадка получает и QR-код, и ссылку для общего доступа к одной и той же странице регистрации — используй то, что подходит к формату. Распечатай QR-код для стойки регистрации, доски объявлений или у корта; отправь ссылку прямо в группу WhatsApp, письмо или пост в соцсетях. В любом случае посетители попадают на одну и ту же страницу и регистрируются за секунды."
    row1_li1: "QR-код для печати — постеры, таблички на столах, указатели у корта"
    row1_li2: "Ссылка для цифрового формата — WhatsApp, email, соцсети, твой сайт"
    row1_li3: "Новые участники автоматически появляются в списке зарегистрированных участников, независимо от способа входа"
    row2_tag: "Обнаружение"
    row2_title: "Тебя найдут спортсмены, которые уже рядом"
    row2_body: "Sports HQ показывает твою площадку спортсменам, которые ищут на карте место для игры. Каждый новый участник и каждое проведённое мероприятие увеличивают видимость твоей площадки для новых посетителей в твоём районе."
    row2_li1: "Появляйся в поиске по местоположению для своего вида спорта и района"
    row2_li2: "Покажи удобства — корты, душевые, шкафчики, парковку — на странице своей площадки"
    row2_li3: "Мероприятия на твоей площадке независимо обнаруживаются, привлекая посетителей, которые никогда не были здесь раньше"
    row3_tag: "Построение сообщества"
    row3_title: "Дай своим участникам найти друг друга"
    row3_body: "Список участников — это не просто административный инструмент, это основа сообщества. Участники могут смотреть, кто ещё играет на твоей площадке, подписываться друг на друга и организовывать собственные игры и встречи, всё привязано к твоему объекту."
    row3_li1: "Каталог с поиском зарегистрированных участников площадки"
    row3_li2: "Участники могут переписываться, подписываться и общаться прямо в приложении"
    row3_li3: "Стимулирует повторные визиты и органический рост через сарафанное радио"
    row4_tag: "Официальные мероприятия"
    row4_title: "Проводи мероприятия, которые заставляют людей возвращаться"
    row4_body: "Организуй еженедельную встречу участников, воскресную лигу или ежемесячный турнир — создай один раз как повторяющееся расписание и позволь Sports HQ автоматически генерировать каждый будущий экземпляр."
    row4_step1_title: "Создай повторяющееся расписание"
    row4_step1_body: "Укажи день, время и за сколько недель вперёд должны создаваться экземпляры."
    row4_step2_title: "Участники подтверждают или отказываются"
    row4_step2_body: "Push-уведомления отправляются автоматически по мере приближения каждого экземпляра."
    row4_step3_title: "Списки ожидания закрывают места в последний момент"
    row4_step3_body: "Если подтверждённый участник отменяет участие, следующий в очереди мгновенно получает уведомление."
    download_headline: "Отметь свою площадку на <span class=\"download__accent\">карте.</span>"
    download_sub: "Присоединяйся к владельцам площадок, которые уже используют Sports HQ, чтобы превратить случайных посетителей в лояльное, активное сообщество."
  office_sports_organizer:
    crumb: "Организаторы офисного спорта"
    badge: "Для организаторов офисного спорта"
    title: "Хватит гоняться за ответами в <span>Slack.</span>"
    sub: "Ты вызвался организовать офисный футбол, обеденную пробежку или пятничные посиделки — и как-то незаметно оказался управляющим трёх групповых чатов и таблицы. Sports HQ даёт тебе одно место для планирования, оповещения и отслеживания посещаемости, а push-уведомления делают напоминания за тебя."
    intro: "ты неофициальный организатор спортивной активности на работе — обеденной пробежки, футбольной команды, турнирной таблицы по бадминтону, лиги софтбола — и устал вручную анонсировать сессии и напоминать коллегам, которые не ответили."
    row1_tag: "Простая регистрация"
    row1_title: "Подключи всю команду одним сканированием"
    row1_body: "Опубликуй ссылку для вступления в Slack-канале команды или приветственном письме, или распечатай QR-код для доски объявлений в офисе — в обоих случаях одна и та же страница регистрации. Новые коллеги мгновенно присоединяются к твоему событию, без ручного ведения списков, без пропущенных имён."
    row1_li1: "Ссылка для Slack, Teams или email — один тап, чтобы присоединиться прямо со стола"
    row1_li2: "QR-код для доски объявлений или распечатанного приветственного набора"
    row1_li3: "Участие полностью управляется внутри приложения — никакой отдельной таблицы"
    row2_tag: "Гибкое планирование"
    row2_title: "Повторяющееся, разовое или и то, и другое"
    row2_body: "Задай повторяющийся еженедельный слот для обычной сессии, затем добавь разовые даты вручную для турниров, мероприятий или изменений расписания из-за праздников — всё в рамках одного события."
    row2_li1: "Автоматически генерируй недели экземпляров из непрерывного расписания"
    row2_li2: "Добавляй разовые активности вручную, которые не вписываются в шаблон"
    row2_li3: "Каждое создание или обновление вызывает push-уведомление для команды"
    row3_tag: "Учёт посещаемости"
    row3_title: "Узнай, кто придёт, не спрашивая"
    row3_body: "Смотри, как подтверждения и отказы поступают автоматически по мере того, как коллеги отвечают на push-уведомления. Больше никаких сообщений \"кто идёт на этой неделе?\" — количество сразу видно."
    row3_step1_title: "Активность публикуется"
    row3_step1_body: "Каждый участник получает push-уведомление в момент планирования или обновления сессии."
    row3_step2_title: "Поступают подтверждения"
    row3_step2_body: "Ты видишь счётчик в реальном времени и список тех, кто подтвердил, отказался или ещё не ответил."
    row3_step3_title: "Напомни в один тап"
    row3_step3_body: "Отправь push-напоминание всем, кто ещё не ответил — прямо из приложения."
    row4_tag: "Списки ожидания"
    row4_title: "Заполненные сессии управляют собой сами"
    row4_body: "Установи максимальную вместимость для своего футбола или бронирования корта. Как только мест не останется, новые записи автоматически попадают в список ожидания — и продвигаются, как только кто-то отказывается."
    row4_li1: "Больше никаких двойных бронирований и споров о том, у кого есть место"
    row4_li2: "Участники в списке ожидания мгновенно уведомляются об освободившемся месте"
    row4_li3: "Работает автоматически для каждого повторяющегося экземпляра"
    download_headline: "Управляй командой без <span class=\"download__accent\">таблицы.</span>"
    download_sub: "Скачай Sports HQ бесплатно и запланируй следующую сессию за считанные минуты."
  social_sports_group:
    crumb: "Социальные спортивные группы"
    badge: "Для больших социальных спортивных групп"
    title: "Большая группа без <span>хаоса.</span>"
    sub: "Как только социальная спортивная группа превышает несколько десятков участников, групповые чаты перестают справляться — сообщения теряются, новые участники не знают, как присоединиться, и никто не уверен, кто на самом деле придёт. Sports HQ даёт твоей группе структуру: контролируемое участие, ограниченные по числу мест сессии и автоматические напоминания."
    intro: "ты администрируешь спортивную группу, которая переросла возможности группового чата — социальную футбольную команду, группу тач-регби, лигу нетбола, встречи скалолазов — с десятками или сотнями участников на нескольких регулярных сессиях."
    row1_tag: "Контроль участия"
    row1_title: "Публично, приватно, или что-то среднее"
    row1_body: "Создай активность своей группы как шаблон события. Сделай его публичным и доступным для поиска для органического роста, или приватным, чтобы участие было полностью под контролем — видимым только тем, кого ты впустил."
    row1_li1: "Приватные события полностью скрыты от поиска и обнаружения"
    row1_li2: "Настройки безопасности и участия настраиваются для каждого события отдельно"
    row1_li3: "Переключи группу с \"только по приглашению\" на открытый рост, когда будешь готов"
    row2_tag: "Лёгкое подключение"
    row2_title: "Одна ссылка делает всю работу"
    row2_body: "Поделись одной ссылкой в группе WhatsApp, подписи email, или посте — или распечатай соответствующий QR-код для постеров и досок объявлений. В обоих случаях новый участник попадает на ту же страницу вступления одним тапом или сканированием."
    row2_li1: "Больше не нужно объяснять \"как мне присоединиться\" каждому новому участнику"
    row2_li2: "Выбирай ссылку или QR-код в зависимости от того, где ты набираешь людей"
    row2_li3: "Работает независимо от того, установлен ли у получателя Sports HQ"
    row3_tag: "Планирование по-своему"
    row3_title: "Ручной контроль, удобство повторения"
