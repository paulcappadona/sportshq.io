    row1_title: "Os pais mantêm o controle do perfil dos filhos"
    row1_body: "Contas de responsável permitem que pais ou cuidadores gerenciem as participações em eventos e a presença em atividades de um menor, e recebam alertas em nome dele. As crianças jogam; os adultos ficam por dentro."
