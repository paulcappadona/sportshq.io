    cta_primary: "注册你的场地"
    intro: "你拥有或管理一处设施、综合体或场地——网球俱乐部、健身房、体育馆、攀岩中心，或社区球场——并希望建立一个活跃、持续回访的顾客社区，而不是一次性的匿名预订。"
    row1_tag: "无摩擦上手"
    row1_title: "几秒钟完成注册，无需纸质流程"
    row1_body: "每个场地都能获得指向同一注册页面的二维码和可分享链接——用最适合场景的那个。把二维码打印出来贴在前台、公告栏或球场边；把链接直接发到 WhatsApp 群、邮件或社交媒体帖子里。无论哪种方式，顾客都会到达同一个页面，几秒钟内完成注册。"
    row1_li1: "可打印二维码——海报、桌牌、球场边标识"
    row1_li2: "数字用途链接——WhatsApp、邮件、社交媒体、你的网站"
    row1_li3: "无论以何种方式加入，新成员都会自动出现在你的注册成员列表中"
    row2_tag: "被发现"
    row2_title: "被已经在附近的运动员找到"
    row2_body: "Sports HQ 会把你的场地展示给正在地图上寻找场地的运动员。你引入的每一位成员，你举办的每一场活动，都会提升你的场地在当地新顾客中的曝光度。"
    row2_li1: "出现在你所在运动项目和地区的位置搜索结果中"
    row2_li2: "在场地页面展示设施——球场、淋浴间、储物柜、停车场"
    row2_li3: "在你场地举办的活动可被独立发现，吸引从未来过的新参与者"
    row3_tag: "建立社区"
    row3_title: "让你的会员彼此找到对方"
    row3_body: "会员列表不只是一个管理工具——它是社区的基础。会员可以浏览还有谁在你的场地打球，互相关注，并组织属于他们自己的比赛和聚会，一切都围绕你的场地展开。"
    row3_li1: "可搜索的已注册场地会员名录"
    row3_li2: "会员可以在应用内直接发消息、关注和建立联系"
    row3_li3: "推动回头客和口碑式的自然增长"
    row4_tag: "官方活动"
    row4_title: "举办让人们不断回来的活动"
    row4_body: "举办每周会员聚会、周日联赛，或每月锦标赛——只需创建一次周期性排期，Sports HQ 就会自动生成未来每一次活动。"
    row4_step1_title: "创建周期性排期"
    row4_step1_body: "设置星期几、时间，以及提前多少周生成实例。"
    row4_step2_title: "会员确认或拒绝"
    row4_step2_body: "每个实例临近时，推送通知会自动发出。"
    row4_step3_title: "候补名单填补最后时刻的空缺"
    row4_step3_body: "如果已确认的会员取消，队列中的下一位会立即收到通知。"
    download_headline: "让你的场地登上<span class=\"download__accent\">地图。</span>"
    download_sub: "加入已经在用 Sports HQ 把偶然顾客变成忠实、活跃社区的场地所有者行列。"
  office_sports_organizer:
    crumb: "办公室运动组织者"
    badge: "为办公室运动组织者打造"
    title: "别再在 <span>Slack</span> 上追着要回复。"
    sub: "你自告奋勇组织公司的五人制足球、午间跑步，或周五聚会——结果不知怎么就变成了要在三个群聊和一张表格里管理这一切。Sports HQ 给你一个地方来排期、宣传和追踪出席情况，推送通知替你完成催促工作。"
    intro: "你是公司运动活动的非正式组织者——午间跑步、五人制足球队、羽毛球排位赛、垒球联赛——并且已经厌倦了手动宣传场次，还要追着没回复的同事要答复。"
    row1_tag: "轻松注册"
    row1_title: "一次扫码，全员加入"
    row1_body: "在团队的 Slack 频道或欢迎邮件里发布加入链接，或为办公室公告栏打印二维码——两种方式都指向同一个注册页面。新同事立即加入你的活动，无需手动建名单，也不会漏掉名字。"
    row1_li1: "适用于 Slack、Teams 或邮件的链接——在办公桌前一键加入"
    row1_li2: "用于公告栏或打印版欢迎手册的二维码"
    row1_li3: "会员管理完全在应用内完成——无需另建表格"
    row2_tag: "灵活排期"
    row2_title: "周期性、单次，或两者兼顾"
    row2_body: "为常规场次设置每周固定的周期性时段，再为锦标赛、聚会或节假日调整手动添加单次日期——全部在同一活动中完成。"
    row2_li1: "从滚动排期中自动生成数周的活动实例"
    row2_li2: "插入不符合固定模式的手动单次活动"
    row2_li3: "每次创建或更新都会向团队触发一条推送通知"
    row3_tag: "出席追踪"
    row3_title: "不用问就知道谁会来"
    row3_body: "看着同事们回应推送通知，确认和拒绝自动汇总进来。再也不用发\"这周谁来？\"这样的消息——人数就摆在那里。"
    row3_step1_title: "活动发布上线"
    row3_step1_body: "场次一经安排或更新，每位成员立即收到推送通知。"
    row3_step2_title: "确认陆续到来"
    row3_step2_body: "你可以看到实时人数统计，以及谁确认了、拒绝了或仍在等待中。"
    row3_step3_title: "一键跟进"
    row3_step3_body: "直接从应用里向仍未回复的人发送提醒推送。"
    row4_tag: "候补名单"
    row4_title: "满员场次自动处理"
    row4_body: "为你的五人制足球或场地预订设置最大容量。一旦满员，新的报名会自动加入候补名单——一旦有人退出便自动递补。"
    row4_li1: "再也没有重复预订或争抢名额的问题"
    row4_li2: "名额一空出，候补名单上的成员立即收到通知"
    row4_li3: "在每一次周期性活动中自动生效"
    download_headline: "无需<span class=\"download__accent\">表格</span>管理团队。"
    download_sub: "免费下载 Sports HQ，几分钟内安排好下一场活动。"
  social_sports_group:
    crumb: "社交运动群组"
    badge: "为大型社交运动群组打造"
    title: "大群体，也能<span>井然有序。</span>"
    sub: "一旦社交运动群组的成员超过几十人，群聊就不再管用——消息被淹没，新成员不知道如何加入，也没人能确定到底谁会真的出现。Sports HQ 为你的群组带来结构：可控的成员管理、限额场次和自动提醒。"
    intro: "你管理的运动群组已经壮大到群聊无法应付的程度——社交足球队、触式橄榄球小组、netball 联赛、攀岩聚会——在多个常规场次中拥有数十甚至数百名成员。"
    row1_tag: "成员控制"
    row1_title: "公开、私密，或介于两者之间"
    row1_body: "把你群组的活动创建为一个活动模板。设为公开且可被发现以实现自然增长，或设为私密以完全掌控成员——只对你允许的人可见。"
    row1_li1: "私密活动完全从搜索和发现中隐藏"
    row1_li2: "安全和成员设置可按活动单独配置"
    row1_li3: "准备好时，随时把群组从仅限邀请切换为开放增长"
    row2_tag: "轻松上手"
    row2_title: "一个链接搞定一切"
    row2_body: "在 WhatsApp 群、邮件签名或社交媒体帖子中分享一个链接——或为海报和公告栏打印对应的二维码。两者都能让新成员通过一次点击或扫描到达同一个加入页面。"
    row2_li1: "再也不用向每个新成员解释\"我该怎么加入\""
    row2_li2: "根据招募渠道选择链接或二维码"
    row2_li3: "无论对方是否已安装 Sports HQ 都能生效"
    row3_tag: "按你的方式排期"
    row3_title: "手动掌控，周期性的便利"
    row3_body: "为临时场次手动排期，或为你常规的每周比赛设置周期性模式——并根据群组日历的需要在两者之间切换。"
    row3_li1: "场次一创建或变更，推送通知立即发给每位成员"
    row3_li2: "成员一键确认或拒绝出席"
    row3_li3: "场次临近时自动发送提醒"
    row4_tag: "容量与候补名单"
    row4_title: "限制群组规模，又不必拒绝任何人"
    row4_body: "根据你的球场、场地容量设置最大参与人数。一旦场次满员，新报名会自动加入候补名单，而不会石沉大海。"
    row4_step1_title: "设置你的最大群组规模"
    row4_step1_body: "达到上限后，场次将停止接受确认。"
    row4_step2_title: "额外报名进入候补名单"
    row4_step2_body: "没有人会被直接拒绝——他们会被自动排队等候。"
    row4_step3_title: "名额自动补齐"
    row4_step3_body: "当已确认的成员拒绝出席，候补名单中的下一位会立即收到通知。"
    download_headline: "为<span class=\"download__accent\">大群体</span>带来秩序。"
    download_sub: "免费下载 Sports HQ，为你的社交运动群组带来它早已超出群聊承受范围的结构化管理。"
  communal_field_community:
    crumb: "共用场地社区"
    badge: "为共用场地及设施社区打造"
    title: "同一片场地，同样的面孔，<span>现在是一个社区。</span>"
    sub: "你和几位常客共用同一个公共球场、公园场地，或社区球场——但你从未真正认识所有在那里打球的人。Sports HQ 把这个共享空间变成一个真实、有组织的社区，无需拥有该场地。"
    intro: "你经常在同一个共用球场、场地或公园打球——你不需要拥有这个场地就能在那里建立社区。你只需要一个方法，让出现的人能够彼此找到对方。"
    row1_tag: "开始使用"
    row1_title: "创建你的活动，然后选择分享方式"
    row1_body: "在 Sports HQ 中创建你的活动，你会得到一个二维码和指向同一页面的加入链接。打印二维码并在场地留下一两份——贴在围栏柱、长椅或公告栏上——或把链接发到群聊里，给还没到场的人。"
    row1_li1: "开始使用无需拥有场地或经过注册流程"
    row1_li2: "场地本身用二维码；群聊用链接——用其中一种，或两者都用"
    row1_li3: "新球员在扫码或点击的那一刻就能加入——无需等待管理员"
    row2_tag: "可被发现"
    row2_title: "被附近搜索的任何人找到"
    row2_body: "除了二维码，你的活动还可以通过基于位置的搜索被发现——这样路过该地区的跑者、足球运动员或篮球运动员都能找到你的社区并前来参与。"
    row2_li1: "出现在你所在运动项目和位置的地图搜索结果中"
    row2_li2: "让你的常客群体扩展到那些偶然看到告示牌的人之外"
    row2_li3: "与二维码协同工作，而不是取代它"
    row3_tag: "真正的社区"
    row3_title: "为每周见到的面孔叫出名字"
    row3_body: "一旦人们在你场地的活动中注册，他们就可以浏览彼此的资料、关注常客，并直接发消息——把\"在公园打球的人\"变成一个真正的网络。"
    row3_li1: "成员名录展示所有注册该活动的人"
    row3_li2: "内置消息功能省去了另建群聊的需要"
    row3_li3: "鼓励人们自发组织自己的临时场次"
    row4_tag: "协调"
    row4_title: "轻松协调活动，没有管理负担"
    row4_body: "安排每周一次的周期性跑步、设置单次场次，或让任何已确认的成员提议新活动——出席、提醒和更新都自动处理。"
    row4_li1: "周期性排期让你的常规时段无需手动维护就能持续进行"
    row4_li2: "推送通知即时告知所有人新场次或变更"
    row4_li3: "一键确认/拒绝让人数统计保持准确"
    download_headline: "围绕你的<span class=\"download__accent\">场地</span>建立一个社区。"
    download_sub: "免费下载 Sports HQ，创建你的活动，今天就打印出你的第一个二维码。"
