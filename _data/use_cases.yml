    faq5_a: "Отмечайте при регистрации, кто пришёл, а кто нет, и позвольте игрокам оценивать надёжность и пунктуальность друг друга. Со временем в профиле каждого игрока видно, кто приходит стабильно, поэтому вы знаете, на кого рассчитывать в составе. Напоминания и листы ожидания затем закрывают пробелы."
    faq6_q: "Как найти замену для лиги или команды?"
    faq6_a: "Сначала отправьте оповещение «нужен ещё один» своим участникам или расширьте его на игроков рядом, подходящих по виду спорта, уровню и времени. Первый, кто подтвердит, занимает место, а счётчик обновляется в реальном времени."
    faq7_q: "Для каких видов спорта это работает?"
    faq7_a: "Для любого из 60+ видов спорта в Sports HQ, включая футбол, баскетбол, волейбол, пиклбол, падел, теннис, хоккей, регби и крикет. Лучше всего подходит для игр с фиксированным числом игроков."
    download_headline: "Помогите каждой игре <span class=\"download__accent\">набрать нужный состав.</span>"
    download_sub: "Скачайте Sports HQ бесплатно и проще заполняйте места."
