  safe_group_runs:
    meta_title: "更安全的女性结伴跑步 | Sports HQ"
    meta_desc: "不想一个人跑？和信任的跑友创建活动，可设为私密，查看谁已确认，也可选择分享实时位置。"
    crumb: "更安全的团体跑步"
    badge: "献给女性，以及所有不想独自跑步的人"
    title: "与信任的人一起<span>更安全地团体跑步</span>"
    sub: "跑步应该让你感到自由，而不是害怕。你不应该因为骚扰而必须改变自己的日常习惯——但如果你在清晨、傍晚或人烟稀少的路线上想要有人陪伴，Sports HQ 能帮你和信任的朋友、家人及跑步伙伴创建活动，如果希望只留在你们之间，可以设为私密，并在出门前确切知道谁已经确认参加。"
    sub2: "无论他们是在你身边跑步，还是骑车陪同，你都能知道信任的人已经承诺会来。"
    cta_primary: "创建你的跑步活动"
    cta_secondary: "看看团体跑步怎么运作"
    intro: "你比较不想独自跑步——尤其是清晨、天黑之后，或人烟稀少的路线上——但跑步伙伴的时间总是凑不到一起。Sports HQ 帮你协调已经认识并信任的人，并可在你选择时于活动期间分享你的实时位置；它不是紧急救援服务，也不能保证安全。"
    row1_tag: "你的信任圈"
    row1_title: "围绕你已经信任的人创建活动，随时准备好"
    row1_body: "为那些你真心希望在跑步时陪在身边的人创建活动——训练伙伴、朋友、家人，或是骑车陪同的人，就像黄金海岸一位跑者的伴侣，在自己无法陪跑时所做的那样。把他们加为成员，如果想只留在你的圈子里，就把活动设为私密，之后每次跑步都能重复使用。"
    row1_li1: "如果只想让受邀成员看到，就把活动设为私密"
    row1_li2: "用链接或二维码添加成员，不需要另外创建账号"
    row1_li3: "无论是固定的一位跑步伙伴，还是整个街坊的跑团，都适用"
    row2_tag: "实时确认"
    row2_title: "下次跑步有人有空吗？几秒钟就能知道"
    row2_body: "发起一场跑步，你的整个圈子会立刻收到通知。回复陆续进来时，你能实时看到更新——不用追着谁要回复，也不用在不知道有没有人会来的情况下就出门。"
    row2_step1_title: "发起下一场跑步"
    row2_step1_body: "设定时间、集合地点和路线——任何成员都可以发起。"
    row2_step2_title: "你的圈子立刻收到通知"
    row2_step2_body: "一发布，推送通知就会马上送达所有人。"
    row2_step3_title: "确认实时涌入"
    row2_step3_body: "直到你出门前，随时查看谁要来、谁不来的实时更新。"
    row3_tag: "实时人数统计"
    row3_title: "在你决定之前，先看看谁会来、有多少人"
    row3_body: "实时的确认与婉拒总数，代表你不用再猜测。无论是天亮出门还是日落之后，你都能一眼看出是全员到齐、只有一位伙伴，还是目前还没人回应——再决定接下来怎么做。"
    row3_li1: "一键确认或婉拒——不用来回发消息"
    row3_li2: "实时参加人数，让你出门前做出明智的判断"
    row3_li3: "同一个活动可重复用于未来每一次跑步——不用每次重新设置"
    row4_tag: "实时位置共享"
    row4_title: "只在跑步期间，与你信任的人共享实时位置"
    row4_body: "在活动中开始共享，并选择谁可以跟随你：已确认的参与者，或已接受你请求的安全联系人。共享仅限活动前后，你可随时停止，且这不是紧急服务。"
    row4_li1: "选择已确认的参与者或已接受的安全联系人"
    row4_li2: "从活动开始前一小时起，到活动结束为止"
    row4_li3: "随时可停止；时间窗口结束时也会自动结束"
    row4_alt: "Sports HQ 实时位置共享面板，可选择已确认的参与者或安全联系人作为对象"
    faq_tag: "常见问题"
    faq_title: "关于团体跑步的常见问题"
    faq1_q: "Sports HQ 如何帮我筹办更安全的团体跑步？"
    faq1_a: "和你已经认识且信任的人创建活动，如果希望只留在你们之间就设为私密，提议下次跑步的时间和路线，并在出门前实时看到谁已经确认参加。"
    faq2_q: "我可以把跑步活动设为私密吗？"
    faq2_a: "可以。活动默认是公开的，但你随时可以把自己的活动设为私密，让只有受邀的成员能看到或加入。"
    faq3_q: "如果没有人确认怎么办？"
    faq3_a: "你会在出门前清楚看到这一点，可以决定要等待、直接邀请某人，或改选其他时间或路线。Sports HQ 无法保证一定会有人有空陪你。"
    faq4_q: "朋友可以骑车陪我，而不是一起跑步吗？"
    faq4_a: "可以。活动里的任何成员都能确认参加，无论是在你身边跑步，还是骑车陪同，作为陪伴和多一双留意周围的眼睛。"
    faq5_q: "Sports HQ 提供实时位置共享吗？它是紧急救援服务吗？"
    faq5_a: "前者是，后者不是。活动期间，你可以选择与已确认的参与者或已接受你请求的安全联系人共享实时位置，并可随时停止。共享仅限活动前后——从开始前一小时到活动结束——点击“停止”或时间窗口结束时即会停止。Sports HQ 不会联系紧急服务、发送紧急警报，也不保证任何人的安全；如有需要，请随时备好手机的紧急功能或专门的安全服务。"
    download_headline: "出门前，<span class=\"download__accent\">先知道谁已经确认。</span>"
    download_sub: "免费下载 Sports HQ，创建一个你可以依靠的信任跑步圈。"
