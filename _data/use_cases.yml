    title: "與信任的人一起<span>更安全地團體跑步</span>"
    sub: "跑步應該讓你感到自由，而不是害怕。你不應該因為騷擾而必須改變自己的日常習慣——但如果你在清晨、傍晚或人煙稀少的路線上想要有人陪伴，Sports HQ 能幫你和信任的朋友、家人及跑步夥伴建立活動，如果希望只留在你們之間，可以設為私密，並在出門前確切知道誰已經確認參加。"
