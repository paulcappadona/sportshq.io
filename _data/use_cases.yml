    row3_body: "Cuando un jugador confirmado se baja, se notifica a la siguiente persona de la lista de espera. Las valoraciones y el seguimiento de asistencia muestran quién aparece de forma fiable, para que sepas con quién contar."
    row3_li1: "Las listas de espera avisan a la siguiente persona cuando se libera una plaza"
    row3_li2: "Seguimiento de asistencia / ausencias en el check-in"
    row3_li3: "Fiabilidad, puntualidad y simpatía en los perfiles de jugador"
    faq_tag: "Preguntas frecuentes"
    faq_title: "Preguntas sobre cómo completar un partido"
    faq1_q: "¿Cómo encuentro un reemplazo con poca antelación?"
    faq1_a: "Activa las alertas inteligentes en tu evento. Sports HQ puede enviar alertas de «falta un jugador» y de reemplazo de última hora a tus miembros o a jugadores cercanos que encajen con tu deporte, nivel y disponibilidad."
    faq2_q: "¿Puede Sports HQ recordar a quienes no han respondido?"
    faq2_a: "Sí. Se envían recordatorios automáticos a los miembros que no han respondido, así no tienes que perseguirlos tú."
    faq3_q: "¿Qué pasa cuando alguien se da de baja?"
    faq3_a: "Si tu evento tiene lista de espera, se notifica a la siguiente persona en cuanto se libera una plaza."
    faq4_q: "¿Pueden los jugadores desactivar las alertas?"
    faq4_a: "Sí. Los jugadores pueden desactivar las alertas de los eventos en los que no participan."
    faq5_q: "¿Cómo reduzco las ausencias?"
    faq5_a: "Marca quién asistió y quién no al registrar la llegada, y deja que tus compañeros valoren la fiabilidad y puntualidad de los demás. Con el tiempo, el perfil de cada jugador muestra quién aparece siempre, así sabes con quién contar en tu plantilla. Los recordatorios y las listas de espera cubren los huecos."
    faq6_q: "¿Cómo encuentro un suplente para mi liga o equipo?"
    faq6_a: "Envía primero una alerta de «falta uno» a tus propios miembros o amplíala a jugadores cercanos que coincidan con tu deporte, nivel y disponibilidad. El primero en confirmar se queda con la plaza y el conteo se actualiza en vivo."
    faq7_q: "¿Para qué deportes funciona?"
    faq7_a: "Para cualquiera de los más de 60 deportes de Sports HQ, como fútbol, baloncesto, voleibol, pickleball, pádel, tenis, hockey, rugby y críquet. Funciona mejor en juegos con un número fijo de jugadores."
    download_headline: "Ayuda a que cada partido <span class=\"download__accent\">llegue al número de jugadores.</span>"
    download_sub: "Descarga Sports HQ gratis y cubre las plazas con más facilidad."
    alt1: "Pantalla de detalles de un evento de Sports HQ con próximas sesiones y botones de confirmar o rechazar"
    alt2: "Lista de miembros de una actividad de Sports HQ con miembros confirmados y pendientes y un botón para enviar recordatorio"
    alt3: "Pantalla de Sports HQ para programar una sesión"
    alt4: "Pantallas de Sports HQ con detalles del evento, horario recurrente y código QR para unirse"

