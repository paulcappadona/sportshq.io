  safe_group_runs:
    meta_title: "Lari Grup Lebih Aman untuk Perempuan | Sports HQ"
    meta_desc: "Lebih suka tak lari sendirian? Buat acara bersama teman lari tepercaya, privat jika mau, lihat siapa yang konfirmasi, dan bagikan lokasi langsung bila ingin."
    crumb: "Lari Kelompok yang Lebih Aman"
    badge: "Untuk perempuan dan siapa pun yang lebih suka tidak lari sendirian"
    title: "Lari Kelompok yang Lebih Aman <span>Bersama Orang yang Kamu Percaya</span>"
    sub: "Lari seharusnya terasa bebas, bukan menakutkan. Kamu tidak seharusnya harus mengubah rutinitasmu karena pelecehan — tapi kalau kamu lebih suka ditemani saat lari pagi-pagi buta, sore hari, atau di rute yang sepi, Sports HQ membantumu membuat event bersama teman, keluarga, dan partner lari yang kamu percaya, menandainya sebagai privat kalau kamu ingin itu hanya untuk kalian, dan melihat persis siapa yang sudah konfirmasi sebelum kamu keluar rumah."
