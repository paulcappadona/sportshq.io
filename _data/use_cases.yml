  communal_field_community:
    meta_title: "Comunidad de tu cancha o campo local: QR o enlace | Sports HQ"
    meta_desc: "Convierte un parque, cancha o campo compartido en comunidad local. Registro con QR o enlace, búsqueda cercana y encuentro fácil entre habituales."
    crumb: "Comunidades de Campos Comunitarios"
