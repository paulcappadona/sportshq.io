- id: fr
  run_club:
    crumb: "Clubs de Course"
    badge: "Pour les Clubs de Course Improvisés"
    title: "Moins de Messages. <span>Plus de Course.</span>"
    sub: "Votre club de course ne suit pas un horaire fixe — il dépend de qui est libre ce soir. Sports HQ remplace le chat de groupe interminable par des notifications instantanées et des confirmations en un geste, pour que vous passiez moins de temps à coordonner et plus de temps sur la route."
    intro: "vous organisez un club de course, un groupe d'entraînement, ou toute activité de groupe proposée à la dernière minute plutôt que planifiée des semaines à l'avance — et vous en avez assez de taper \"qui est partant ce soir ?\" dans un chat de groupe."
    row1_tag: "Communication Centralisée"
    row1_title: "Un événement, une équipe, zéro bruit"
    row1_body: "Créez votre club de course comme un événement dans Sports HQ une seule fois, et ajoutez votre équipe. Ensuite, chaque activité, mise à jour et rappel passe par l'application — pas par trois fils de discussion différents."
    row1_li1: "Configurez une fois, réutilisez pour chaque future sortie"
    row1_li2: "Fonctionne tout aussi bien pour n'importe quel sport ou activité, pas seulement la course"
    row1_li3: "Ajoutez des membres via un lien déposé dans le chat de groupe, ou un QR code sur une feuille d'inscription — selon ce qui est plus simple"
    row2_tag: "Notifications Instantanées"
    row2_title: "Proposez la course de ce soir, prévenez tout le monde instantanément"
    row2_body: "N'importe quel membre peut créer une activité pour l'équipe — proposer une date, une heure et un itinéraire, et chaque membre reçoit immédiatement une notification push. Pas de goulot d'étranglement administratif, pas d'attente pour que quelqu'un \"voie\" le message."
    row2_step1_title: "Quelqu'un propose une course"
    row2_step1_body: "N'importe quel membre peut créer l'activité — pas besoin d'être l'organisateur."
    row2_step2_title: "Tout le monde est notifié en même temps"
    row2_step2_body: "Une notification push part au moment où l'activité est créée."
    row2_step3_title: "Les réponses arrivent immédiatement"
    row2_step3_body: "Confirmez ou déclinez en un geste — sans avoir à taper de message."
    row3_tag: "Confirmation Instantanée"
    row3_title: "Sachez qui court avant de quitter la maison"
    row3_body: "Consultez la présence en direct pour la course de ce soir — qui a confirmé, qui a décliné, et qui n'a pas encore répondu — sans envoyer un seul message de relance."
    row3_li1: "Confirmer/décliner en un geste supprime totalement les allers-retours"
    row3_li2: "Réduit la charge administrative pour que l'équipe se concentre sur l'entraînement"
    row3_li3: "Le même fonctionnement s'applique à tout sport ou activité géré dans Sports HQ"
    download_headline: "Passez moins de temps à organiser, <span class=\"download__accent\">plus de temps à courir.</span>"
    download_sub: "Téléchargez Sports HQ gratuitement et organisez la course de ce soir en quelques secondes."
  venue_owners:
    crumb: "Propriétaires de Lieux"
    badge: "Pour les Propriétaires de Lieux & Installations"
    title: "Transformez vos Clients en <span>Communauté.</span>"
    sub: "Vous gérez un club de tennis, une salle d'escalade, un complexe multisports ou un terrain communautaire — et vous savez que vos membres joueraient plus, et resteraient plus longtemps, s'ils se connaissaient. Sports HQ donne à chaque lieu une couche communautaire intégrée : inscription, découverte, planification et communication, le tout dans une seule application."
    cta_primary: "Enregistrez Votre Lieu"
    intro: "vous possédez ou gérez une installation, un complexe ou un lieu — club de tennis, salle de sport, gymnase, centre d'escalade ou terrain communautaire — et vous voulez construire une communauté active et fidèle plutôt que des réservations ponctuelles et anonymes."
    row1_tag: "Intégration Sans Friction"
    row1_title: "Inscription en quelques secondes, pas de paperasse"
    row1_body: "Chaque lieu obtient à la fois un QR code et un lien partageable vers la même page d'inscription — utilisez celui qui convient au support. Imprimez le QR code pour l'accueil, un panneau d'affichage ou le bord du terrain ; déposez le lien directement dans un groupe WhatsApp, un e-mail ou une publication. Dans tous les cas, les clients arrivent sur la même page et s'inscrivent en quelques secondes."
    row1_li1: "QR code à imprimer — affiches, chevalets, signalétique au bord du terrain"
    row1_li2: "Lien pour le numérique — WhatsApp, e-mail, réseaux sociaux, votre site"
    row1_li3: "Les nouveaux membres apparaissent automatiquement dans votre liste de membres inscrits, quel que soit leur mode d'inscription"
    row2_tag: "Découvrabilité"
    row2_title: "Soyez trouvé par des sportifs déjà à proximité"
    row2_body: "Sports HQ fait remonter votre lieu auprès des sportifs qui cherchent un endroit où jouer sur la carte. Chaque membre que vous intégrez, et chaque événement que vous organisez, augmente la visibilité de votre lieu auprès de nouveaux clients dans votre zone."
    row2_li1: "Apparaissez dans la recherche géolocalisée pour votre sport et votre zone"
    row2_li2: "Mettez en avant vos équipements — terrains, douches, casiers, parking — sur votre page"
    row2_li3: "Les événements organisés chez vous sont découvrables indépendamment, attirant des participants qui ne sont jamais venus"
    row3_tag: "Construction de Communauté"
    row3_title: "Laissez vos membres se trouver entre eux"
    row3_body: "Une liste de membres n'est pas qu'un outil administratif — c'est le fondement d'une communauté. Les membres peuvent voir qui joue aussi chez vous, se suivre entre eux et organiser leurs propres matchs et sorties, tout ancré à votre établissement."
    row3_li1: "Annuaire consultable des membres inscrits au lieu"
    row3_li2: "Les membres peuvent échanger des messages, se suivre et se connecter directement dans l'application"
    row3_li3: "Favorise les visites répétées et la croissance organique par le bouche-à-oreille"
    row4_tag: "Événements Homologués"
    row4_title: "Organisez les événements qui font revenir les gens"
    row4_body: "Organisez une rencontre hebdomadaire entre membres, un championnat du dimanche, ou un tournoi mensuel — créez-le une fois comme planning récurrent et laissez Sports HQ générer automatiquement chaque future occurrence."
    row4_step1_title: "Créez le planning récurrent"
    row4_step1_body: "Définissez le jour, l'heure, et le nombre de semaines à l'avance pour la génération des occurrences."
    row4_step2_title: "Les membres confirment ou déclinent"
    row4_step2_body: "Les notifications push partent automatiquement à l'approche de chaque occurrence."
    row4_step3_title: "Les listes d'attente comblent les places de dernière minute"
    row4_step3_body: "Si un membre confirmé se désiste, la personne suivante sur la liste est notifiée instantanément."
    download_headline: "Mettez votre lieu sur la <span class=\"download__accent\">carte.</span>"
    download_sub: "Rejoignez les propriétaires de lieux qui utilisent déjà Sports HQ pour transformer des clients occasionnels en une communauté fidèle et active."
  office_sports_organizer:
    crumb: "Organisateurs de Sport en Entreprise"
    badge: "Pour les Organisateurs de Sport en Entreprise"
    title: "Arrêtez de Relancer sur <span>Slack.</span>"
    sub: "Vous vous êtes porté volontaire pour organiser le foot à cinq du bureau, la course du midi ou l'apéro du vendredi — et vous vous retrouvez à gérer ça via trois chats de groupe et un tableur. Sports HQ vous donne un seul endroit pour planifier, publier et suivre la présence, avec des notifications push qui font les relances à votre place."
    intro: "vous êtes l'organisateur officieux d'une activité sportive au travail — une course du midi, une équipe de foot à cinq, un tableau de badminton, une ligue de softball — et vous en avez assez de publier manuellement les sessions et de relancer des collègues qui n'ont pas répondu."
    row1_tag: "Inscription Facile"
    row1_title: "Intégrez toute l'équipe en un scan"
    row1_body: "Publiez un lien d'inscription dans le canal Slack de l'équipe ou l'e-mail de bienvenue, ou imprimez le QR code pour le panneau d'affichage du bureau — même page d'inscription dans les deux cas. Les nouveaux collègues rejoignent votre événement instantanément, sans liste manuelle, sans nom oublié."
    row1_li1: "Lien pour Slack, Teams ou e-mail — un geste pour rejoindre depuis son bureau"
    row1_li2: "QR code pour le panneau d'affichage ou le pack d'accueil imprimé"
    row1_li3: "L'adhésion est entièrement gérée dans l'application — pas de tableur séparé"
    row2_tag: "Planification Flexible"
    row2_title: "Récurrent, ponctuel, ou les deux"
    row2_body: "Définissez un créneau hebdomadaire récurrent pour la session habituelle, puis ajoutez des dates ponctuelles manuelles pour les tournois, événements sociaux, ou changements d'horaire liés aux jours fériés — le tout depuis le même événement."
    row2_li1: "Générez automatiquement des semaines d'occurrences à partir d'un planning glissant"
    row2_li2: "Insérez des activités ponctuelles manuelles qui ne suivent pas le schéma"
    row2_li3: "Chaque création ou modification déclenche une notification push à l'équipe"
    row3_tag: "Suivi de Présence"
    row3_title: "Sachez qui vient, sans avoir à demander"
    row3_body: "Regardez les confirmations et refus arriver automatiquement à mesure que les collègues répondent aux notifications push. Fini les messages \"qui est là cette semaine ?\" — le décompte est là, sous vos yeux."
    row3_step1_title: "L'activité est publiée"
    row3_step1_body: "Chaque membre reçoit une notification push dès qu'une session est planifiée ou modifiée."
    row3_step2_title: "Les confirmations arrivent"
    row3_step2_body: "Vous voyez un décompte en direct et la liste de qui a confirmé, décliné, ou est encore en attente."
    row3_step3_title: "Relancez en un geste"
    row3_step3_body: "Envoyez une notification push de rappel à ceux qui sont encore en attente — directement depuis l'application."
    row4_tag: "Listes d'Attente"
    row4_title: "Les sessions complètes se gèrent toutes seules"
    row4_body: "Définissez une capacité maximale pour votre foot à cinq ou votre réservation de terrain. Une fois complet, les nouvelles inscriptions rejoignent automatiquement une liste d'attente — et avancent dès qu'une place se libère."
    row4_li1: "Fini les doubles réservations ou les disputes sur qui a une place"
    row4_li2: "Les membres en liste d'attente sont notifiés instantanément dès qu'une place se libère"
    row4_li3: "Fonctionne automatiquement pour chaque occurrence récurrente"
    download_headline: "Gérez votre équipe sans <span class=\"download__accent\">tableur.</span>"
    download_sub: "Téléchargez Sports HQ gratuitement et planifiez votre prochaine session en quelques minutes."
  social_sports_group:
    crumb: "Groupes Sportifs Sociaux"
    badge: "Pour les Grands Groupes Sportifs Sociaux"
    title: "Un Grand Groupe, Géré <span>Sans Chaos.</span>"
    sub: "Une fois qu'un groupe sportif social dépasse quelques dizaines de membres, les chats de groupe cessent de fonctionner — les messages se perdent, les nouveaux membres ne savent pas comment rejoindre, et personne n'est sûr de qui vient vraiment. Sports HQ donne de la structure à votre groupe : adhésion contrôlée, sessions plafonnées et rappels automatiques."
    intro: "vous administrez un groupe sportif qui a dépassé le stade où un chat de groupe peut suivre — une équipe de foot social, un groupe de rugby à toucher, une ligue de netball, un groupe d'escalade — avec des dizaines ou des centaines de membres répartis sur plusieurs sessions régulières."
    row1_tag: "Contrôle de l'Adhésion"
    row1_title: "Public, privé, ou entre les deux"
    row1_body: "Créez l'activité de votre groupe comme un modèle d'événement. Rendez-le public et découvrable pour une croissance organique, ou privé pour que l'adhésion soit entièrement contrôlée — visible uniquement par les personnes que vous autorisez."
    row1_li1: "Les événements privés sont entièrement masqués de la recherche et de la découverte"
    row1_li2: "Les paramètres de sécurité et d'adhésion sont configurés par événement"
    row1_li3: "Passez un groupe de sur-invitation uniquement à croissance ouverte quand vous êtes prêt"
    row2_tag: "Intégration sans Effort"
    row2_title: "Un seul lien fait tout le travail"
    row2_body: "Partagez un lien unique dans un groupe WhatsApp, une signature e-mail ou une publication — ou imprimez le QR code correspondant pour affiches et panneaux. Les deux amènent un nouveau membre à la même page d'inscription en un geste ou un scan."
    row2_li1: "Fini d'expliquer \"comment je rejoins\" à chaque nouveau membre"
    row2_li2: "Choisissez lien ou QR code selon votre canal de recrutement"
    row2_li3: "Fonctionne que le destinataire ait déjà Sports HQ ou non"
    row3_tag: "Planification à Votre Façon"
    row3_title: "Contrôle manuel, commodité récurrente"
    row3_body: "Planifiez des activités manuellement pour des sessions ponctuelles, ou définissez un schéma récurrent pour votre match hebdomadaire habituel — et basculez entre les deux selon les besoins du calendrier de votre groupe."
    row3_li1: "Des notifications push partent à chaque membre dès qu'une session est créée ou modifiée"
    row3_li2: "Les membres confirment ou déclinent leur présence en un geste"
    row3_li3: "Des rappels partent automatiquement à l'approche de la session"
    row4_tag: "Capacité et Listes d'Attente"
    row4_title: "Plafonnez la taille du groupe sans refuser personne"
    row4_body: "Définissez un nombre maximum de participants correspondant à la capacité de votre terrain, court ou lieu. Une fois une session complète, les nouvelles inscriptions rejoignent automatiquement une liste d'attente au lieu d'être perdues."
    row4_step1_title: "Définissez la taille maximale de votre groupe"
    row4_step1_body: "Les sessions cessent d'accepter des confirmations une fois le plafond atteint."
    row4_step2_title: "Les inscriptions supplémentaires rejoignent la liste d'attente"
    row4_step2_body: "Personne n'est refusé directement — ils sont automatiquement mis en file d'attente."
    row4_step3_title: "Les places se remplissent toutes seules"
    row4_step3_body: "Quand un membre confirmé décline, le membre suivant sur la liste d'attente est notifié instantanément."
    download_headline: "Mettez de l'ordre dans un <span class=\"download__accent\">grand groupe.</span>"
    download_sub: "Téléchargez Sports HQ gratuitement et donnez à votre groupe sportif social la structure qu'un chat de groupe ne peut plus offrir."
  communal_field_community:
    crumb: "Communautés de Terrains Partagés"
    badge: "Pour les Communautés de Terrains & Installations Partagés"
    title: "Même Terrain. Mêmes Visages. <span>Maintenant une Communauté.</span>"
    sub: "Vous et quelques habitués partagez le même terrain public, court de parc ou terrain communautaire — mais vous n'avez jamais vraiment rencontré tous ceux qui y jouent. Sports HQ transforme cet espace partagé en une communauté réelle et organisée, sans nécessiter la propriété du lieu."
    intro: "vous jouez régulièrement sur le même terrain, court ou parc communautaire — et vous n'avez pas besoin de posséder le lieu pour y construire une communauté. Il vous faut juste un moyen pour que les gens qui viennent se trouvent entre eux."
    row1_tag: "Démarrer"
    row1_title: "Créez votre événement, puis choisissez comment le partager"
    row1_body: "Créez votre événement dans Sports HQ et vous obtenez un QR code et un lien d'inscription vers la même page. Imprimez le QR code et laissez-en une ou deux copies sur le terrain — collé sur un poteau, un banc ou un panneau d'affichage — ou déposez le lien dans le chat de groupe pour ceux qui ne sont pas encore sur place."
    row1_li1: "Aucune propriété du lieu ni processus d'inscription requis pour démarrer"
    row1_li2: "QR code pour le terrain lui-même ; lien pour le chat de groupe — utilisez l'un, ou les deux"
    row1_li3: "Les nouveaux joueurs rejoignent dès qu'ils scannent ou cliquent — sans attendre un administrateur"
    row2_tag: "Découvrabilité"
    row2_title: "Trouvé par quiconque cherche à proximité"
    row2_body: "Au-delà du QR code, votre événement est découvrable via la recherche géolocalisée — un coureur, un footballeur ou un basketteur de passage dans la zone peut ainsi trouver votre communauté et venir jouer."
    row2_li1: "Apparaissez dans les résultats de recherche cartographique pour votre sport et lieu"
    row2_li2: "Développez vos habitués au-delà de ceux qui ont vu le panneau par hasard"
    row2_li3: "Fonctionne en complément du QR code, pas à sa place"
    row3_tag: "Vraie Communauté"
    row3_title: "Mettez un nom sur les visages que vous voyez chaque semaine"
    row3_body: "Une fois inscrites à l'événement de votre terrain, les personnes peuvent consulter les profils des autres, suivre les habitués et échanger des messages directement — transformant \"les gens qui jouent au parc\" en un véritable réseau."
    row3_li1: "L'annuaire des membres affiche tous ceux inscrits à l'événement"
    row3_li2: "La messagerie intégrée supprime le besoin d'un chat de groupe séparé"
    row3_li3: "Encourage les gens à organiser leurs propres sessions de façon autonome"
    row4_tag: "Coordination"
    row4_title: "Coordination facile des activités, sans charge administrative"
    row4_body: "Planifiez une sortie hebdomadaire récurrente, organisez des sessions ponctuelles, ou laissez tout membre confirmé proposer une nouvelle activité — présence, rappels et mises à jour sont tous gérés automatiquement."
    row4_li1: "Les plannings récurrents maintiennent votre créneau habituel sans entretien manuel"
    row4_li2: "Les notifications push informent immédiatement tout le monde des nouvelles sessions ou changements"
    row4_li3: "Confirmer/décliner en un geste garde le décompte précis"
    download_headline: "Construisez une communauté autour de votre <span class=\"download__accent\">terrain.</span>"
    download_sub: "Téléchargez Sports HQ gratuitement, créez votre événement, et imprimez votre premier QR code dès aujourd'hui."

- id: hi
  run_club:
    crumb: "रन क्लब"
    badge: "एडहॉक रन क्लब्स के लिए"
    title: "कम मैसेज। <span>ज़्यादा रनिंग।</span>"
    sub: "आपका रन क्लब किसी तय शेड्यूल पर नहीं चलता — यह इस पर निर्भर करता है कि आज शाम किसे समय है। Sports HQ अंतहीन ग्रुप चैट को इंस्टेंट नोटिफिकेशन और वन-टैप कन्फर्मेशन से बदल देता है, ताकि आप कोऑर्डिनेट करने में कम और दौड़ने में ज़्यादा समय बिताएं।"
    intro: "आप एक रन क्लब, ट्रेनिंग क्रू, या ऐसी कोई भी ग्रुप एक्टिविटी ऑर्गनाइज़ करते हैं जो हफ्तों पहले प्लान करने के बजाय आखिरी मिनट में प्रपोज़ होती है — और आप ग्रुप चैट में \"आज रात कौन आ रहा है?\" टाइप करते-करते थक चुके हैं।"
    row1_tag: "केंद्रीकृत कम्युनिकेशन"
    row1_title: "एक इवेंट, एक क्रू, ज़ीरो शोर"
    row1_body: "अपने रन क्लब को Sports HQ में एक बार इवेंट के रूप में बनाएं, और अपना क्रू जोड़ें। इसके बाद, हर एक्टिविटी, अपडेट और रिमाइंडर ऐप के ज़रिए आता है — तीन अलग-अलग मैसेज थ्रेड्स के ज़रिए नहीं।"
    row1_li1: "एक बार सेट करें; हर भविष्य की दौड़ के लिए फिर से इस्तेमाल करें"
    row1_li2: "किसी भी खेल या एक्टिविटी के लिए उतना ही अच्छा काम करता है, सिर्फ़ रनिंग के लिए नहीं"
    row1_li3: "ग्रुप चैट में डाले गए लिंक से, या साइन-अप शीट पर QR कोड से मेंबर्स जोड़ें — जो भी आसान हो"
    row2_tag: "इंस्टेंट नोटिफिकेशन"
    row2_title: "आज रात की दौड़ प्रपोज़ करें, सबको तुरंत बताएं"
    row2_body: "कोई भी मेंबर क्रू के लिए एक्टिविटी बना सकता है — तारीख, समय और रूट प्रपोज़ करें, और हर मेंबर को तुरंत पुश नोटिफिकेशन मिलती है। कोई एडमिन बॉटलनेक नहीं, किसी के मैसेज \"देखने\" का इंतज़ार नहीं।"
    row2_step1_title: "कोई दौड़ प्रपोज़ करता है"
    row2_step1_body: "कोई भी मेंबर एक्टिविटी बना सकता है — ऑर्गनाइज़र होना ज़रूरी नहीं।"
    row2_step2_title: "सबको एक साथ नोटिफाई किया जाता है"
    row2_step2_body: "एक्टिविटी बनते ही पुश नोटिफिकेशन चली जाती है।"
    row2_step3_title: "जवाब तुरंत आते हैं"
    row2_step3_body: "एक टैप में कन्फर्म या डिक्लाइन करें — टाइप करने की ज़रूरत नहीं।"
    row3_tag: "इंस्टेंट कन्फर्मेशन"
    row3_title: "घर से निकलने से पहले जानें कौन दौड़ रहा है"
    row3_body: "आज रात की दौड़ के लिए लाइव अटेंडेंस देखें — किसने कन्फर्म किया, किसने डिक्लाइन किया, और किसने अभी तक जवाब नहीं दिया — बिना एक भी फॉलो-अप मैसेज भेजे।"
    row3_li1: "वन-टैप कन्फर्म/डिक्लाइन आगे-पीछे की बातचीत को पूरी तरह खत्म कर देता है"
    row3_li2: "ओवरहेड को कम करता है ताकि क्रू असल में ट्रेनिंग पर फोकस कर सके"
    row3_li3: "यही फ्लो Sports HQ में मैनेज की गई किसी भी खेल या एक्टिविटी के लिए काम करता है"
    download_headline: "ऑर्गनाइज़ करने में कम समय, <span class=\"download__accent\">दौड़ने में ज़्यादा समय।</span>"
    download_sub: "Sports HQ मुफ्त डाउनलोड करें और आज रात की दौड़ सेकंडों में तय करें।"
  venue_owners:
    crumb: "वेन्यू मालिक"
    badge: "वेन्यू और फैसिलिटी मालिकों के लिए"
    title: "आगंतुकों को <span>कम्युनिटी</span> में बदलें।"
    sub: "आप एक टेनिस क्लब, क्लाइम्बिंग जिम, मल्टी-कोर्ट कॉम्प्लेक्स, या कम्युनिटी पिच चलाते हैं — और आप जानते हैं कि अगर आपके मेंबर्स एक-दूसरे को जानते तो वे ज़्यादा खेलते, और ज़्यादा देर रुकते। Sports HQ हर वेन्यू को एक बिल्ट-इन कम्युनिटी लेयर देता है: रजिस्ट्रेशन, डिस्कवरी, शेड्यूलिंग, और कम्युनिकेशन, सब एक ही ऐप में।"
    cta_primary: "अपना वेन्यू रजिस्टर करें"
    intro: "आप किसी फैसिलिटी, कॉम्प्लेक्स, या वेन्यू के मालिक हैं या उसे मैनेज करते हैं — टेनिस क्लब, जिम, स्पोर्ट्स हॉल, क्लाइम्बिंग सेंटर, या कम्युनिटी फील्ड — और आप एक बार की, अनाम बुकिंग्स की बजाय आगंतुकों की एक सक्रिय, लौटने वाली कम्युनिटी बनाना चाहते हैं।"
    row1_tag: "आसान ऑनबोर्डिंग"
    row1_title: "सेकंडों में रजिस्ट्रेशन, कागज़ी काम नहीं"
    row1_body: "हर वेन्यू को एक ही रजिस्ट्रेशन पेज के लिए QR कोड और शेयर करने योग्य लिंक दोनों मिलते हैं — जो भी माध्यम के हिसाब से सही हो उसका इस्तेमाल करें। रिसेप्शन, नोटिसबोर्ड, या कोर्टसाइड के लिए QR कोड प्रिंट करें; लिंक सीधे WhatsApp ग्रुप, ईमेल, या सोशल पोस्ट में डालें। किसी भी तरह, आगंतुक एक ही पेज पर पहुंचते हैं और सेकंडों में रजिस्टर करते हैं।"
    row1_li1: "प्रिंट के लिए QR कोड — पोस्टर, टेबल टेंट, कोर्टसाइड साइनेज"
    row1_li2: "डिजिटल के लिए लिंक — WhatsApp, ईमेल, सोशल, आपकी वेबसाइट"
    row1_li3: "नए मेंबर्स चाहे जैसे भी जुड़ें, अपने आप आपकी रजिस्टर्ड मेंबर्स लिस्ट में दिखते हैं"
    row2_tag: "डिस्कवरी"
    row2_title: "पास में मौजूद एथलीट्स द्वारा खोजे जाएं"
    row2_body: "Sports HQ आपके वेन्यू को उन एथलीट्स के सामने लाता है जो मैप पर खेलने की जगह ढूंढ रहे हैं। जितने मेंबर्स आप ऑनबोर्ड करते हैं, और जितने इवेंट्स आप होस्ट करते हैं, आपके क्षेत्र में नए आगंतुकों के लिए आपके वेन्यू की विज़िबिलिटी उतनी बढ़ती है।"
    row2_li1: "अपने खेल और क्षेत्र के लिए लोकेशन-बेस्ड सर्च में दिखें"
    row2_li2: "अपने वेन्यू पेज पर सुविधाएं दिखाएं — कोर्ट्स, शावर, लॉकर्स, पार्किंग"
    row2_li3: "आपके वेन्यू पर होस्ट किए गए इवेंट्स स्वतंत्र रूप से डिस्कवर होने योग्य हैं, जो कभी न आए हुए अटेंडीज़ को लाते हैं"
    row3_tag: "कम्युनिटी बिल्डिंग"
    row3_title: "अपने मेंबर्स को एक-दूसरे को ढूंढने दें"
    row3_body: "मेंबरशिप लिस्ट सिर्फ़ एक एडमिन टूल नहीं है — यह कम्युनिटी की नींव है। मेंबर्स देख सकते हैं कि आपके वेन्यू पर और कौन खेलता है, एक-दूसरे को फॉलो कर सकते हैं, और अपने खुद के गेम्स और सोशल्स ऑर्गनाइज़ कर सकते हैं, सब आपकी फैसिलिटी से जुड़े हुए।"
    row3_li1: "रजिस्टर्ड वेन्यू मेंबर्स की सर्च करने योग्य डायरेक्टरी"
    row3_li2: "मेंबर्स सीधे ऐप में मैसेज, फॉलो, और कनेक्ट कर सकते हैं"
    row3_li3: "बार-बार विज़िट और वर्ड-ऑफ-माउथ ग्रोथ को ऑर्गेनिकली बढ़ावा देता है"
    row4_tag: "मान्यता प्राप्त इवेंट्स"
    row4_title: "ऐसे इवेंट्स होस्ट करें जो लोगों को वापस लाते रहें"
    row4_body: "साप्ताहिक मेंबर सोशल, संडे लीग, या मासिक टूर्नामेंट चलाएं — इसे एक बार रिकरिंग शेड्यूल के रूप में बनाएं और Sports HQ को हर भविष्य का इंस्टेंस अपने आप जेनरेट करने दें।"
    row4_step1_title: "रिकरिंग शेड्यूल बनाएं"
    row4_step1_body: "दिन, समय, और कितने हफ्ते पहले इंस्टेंस जेनरेट होने चाहिए, सेट करें।"
    row4_step2_title: "मेंबर्स कन्फर्म या डिक्लाइन करते हैं"
    row4_step2_body: "हर इंस्टेंस नज़दीक आते ही पुश नोटिफिकेशन अपने आप चली जाती हैं।"
    row4_step3_title: "वेटलिस्ट आखिरी मिनट के गैप भरती है"
    row4_step3_body: "अगर कोई कन्फर्म्ड मेंबर हट जाए, तो लाइन में अगले व्यक्ति को तुरंत सूचित किया जाता है।"
    download_headline: "अपने वेन्यू को <span class=\"download__accent\">मैप पर लाएं।</span>"
    download_sub: "उन वेन्यू मालिकों से जुड़ें जो पहले से Sports HQ का इस्तेमाल कैज़ुअल आगंतुकों को एक वफादार, सक्रिय कम्युनिटी में बदलने के लिए कर रहे हैं।"
  office_sports_organizer:
    crumb: "ऑफिस स्पोर्ट्स ऑर्गनाइज़र"
    badge: "ऑफिस स्पोर्ट्स ऑर्गनाइज़र्स के लिए"
    title: "<span>Slack</span> पर RSVPs के पीछे भागना बंद करें।"
    sub: "आपने ऑफिस के फाइव-अ-साइड, लंच टाइम रन, या फ्राइडे सोशल को चलाने के लिए वॉलंटियर किया — और किसी तरह तीन ग्रुप चैट्स और एक स्प्रेडशीट के ज़रिए इसे मैनेज करते-करते फंस गए। Sports HQ आपको शेड्यूल करने, पब्लिसाइज़ करने, और अटेंडेंस ट्रैक करने के लिए एक जगह देता है, जहां पुश नोटिफिकेशन आपके लिए पीछा करने का काम करती हैं।"
    intro: "आप किसी वर्कप्लेस स्पोर्ट्स एक्टिविटी के अनऑफिशियल ऑर्गनाइज़र हैं — लंच टाइम रन, फाइव-अ-साइड टीम, बैडमिंटन लैडर, सॉफ्टबॉल लीग — और आप मैन्युअली सेशंस पब्लिसाइज़ करने और जवाब न देने वाले कलीग्स के पीछे भागते-भागते थक चुके हैं।"
    row1_tag: "आसान रजिस्ट्रेशन"
    row1_title: "एक स्कैन में पूरी टीम को ऑनबोर्ड करें"
    row1_body: "टीम के Slack चैनल या वेलकम ईमेल में जॉइन लिंक पोस्ट करें, या ऑफिस नोटिसबोर्ड के लिए QR कोड प्रिंट करें — दोनों ही तरीकों में एक ही रजिस्ट्रेशन पेज। नए कलीग्स तुरंत आपके इवेंट में जुड़ जाते हैं, कोई मैन्युअल लिस्ट बनाना नहीं, कोई नाम छूटना नहीं।"
    row1_li1: "Slack, Teams, या ईमेल के लिए लिंक — डेस्क से जुड़ने के लिए एक टैप"
    row1_li2: "नोटिसबोर्ड या प्रिंटेड वेलकम पैक के लिए QR कोड"
    row1_li3: "मेंबरशिप पूरी तरह ऐप के अंदर मैनेज होती है — कोई अलग स्प्रेडशीट नहीं"
    row2_tag: "फ्लेक्सिबल शेड्यूलिंग"
    row2_title: "रिकरिंग, वन-ऑफ, या दोनों"
    row2_body: "नियमित सेशन के लिए एक रिकरिंग साप्ताहिक स्लॉट सेट करें, फिर टूर्नामेंट्स, सोशल्स, या पब्लिक हॉलिडेज़ के आसपास शेड्यूल बदलावों के लिए मैन्युअल वन-ऑफ तारीखें जोड़ें — सब एक ही इवेंट से।"
    row2_li1: "रोलिंग शेड्यूल से अपने आप हफ्तों के इंस्टेंसेस जेनरेट करें"
    row2_li2: "मैन्युअल वन-ऑफ एक्टिविटीज़ फिट करें जो पैटर्न में नहीं आतीं"
    row2_li3: "हर क्रिएशन या अपडेट टीम को पुश नोटिफिकेशन भेजता है"
    row3_tag: "अटेंडेंस ट्रैकिंग"
    row3_title: "बिना पूछे जानें कौन आ रहा है"
    row3_body: "कलीग्स के पुश नोटिफिकेशंस का जवाब देते ही कन्फर्मेशन और डिक्लाइन अपने आप आते देखें। \"इस हफ्ते कौन आ रहा है?\" जैसे मैसेज अब नहीं — हेडकाउंट वहीं मौजूद है।"
    row3_step1_title: "एक्टिविटी लाइव हो जाती है"
    row3_step1_body: "सेशन शेड्यूल या अपडेट होते ही हर मेंबर को पुश नोटिफिकेशन मिलती है।"
    row3_step2_title: "कन्फर्मेशन आते हैं"
    row3_step2_body: "आप लाइव काउंट और लिस्ट देखते हैं कि किसने कन्फर्म किया, डिक्लाइन किया, या अभी भी पेंडिंग है।"
    row3_step3_title: "एक टैप में फॉलो-अप करें"
    row3_step3_body: "जो अभी भी पेंडिंग हैं उन्हें रिमाइंडर पुश नोटिफिकेशन भेजें — सीधे ऐप से।"
    row4_tag: "वेटलिस्ट"
    row4_title: "पूरी तरह भरे सेशन खुद संभल जाते हैं"
    row4_body: "अपने फाइव-अ-साइड या कोर्ट बुकिंग के लिए मैक्सिमम कैपेसिटी सेट करें। एक बार भर जाने पर, नए साइन-अप्स अपने आप वेटलिस्ट में जुड़ जाते हैं — और कोई हटते ही आगे बढ़ जाते हैं।"
    row4_li1: "अब कोई डबल-बुकिंग या किसके पास स्पॉट है इस पर बहस नहीं"
    row4_li2: "जगह खाली होते ही वेटलिस्टेड मेंबर्स को तुरंत सूचित किया जाता है"
    row4_li3: "हर रिकरिंग इंस्टेंस में अपने आप काम करता है"
    download_headline: "बिना <span class=\"download__accent\">स्प्रेडशीट</span> के अपनी टीम मैनेज करें।"
    download_sub: "Sports HQ मुफ्त डाउनलोड करें और मिनटों में अपना अगला सेशन शेड्यूल करें।"
  social_sports_group:
    crumb: "सोशल स्पोर्ट्स ग्रुप्स"
    badge: "बड़े सोशल स्पोर्ट्स ग्रुप्स के लिए"
    title: "एक बड़ा ग्रुप, बिना <span>अफरा-तफरी।</span>"
    sub: "जैसे ही कोई सोशल स्पोर्ट्स ग्रुप कुछ दर्जन मेंबर्स को पार कर जाता है, ग्रुप चैट्स काम करना बंद कर देती हैं — मैसेज दब जाते हैं, नए मेंबर्स को नहीं पता कि कैसे जुड़ें, और कोई भी निश्चित नहीं होता कि असल में कौन आएगा। Sports HQ आपके ग्रुप को स्ट्रक्चर देता है: नियंत्रित मेंबरशिप, कैप्ड सेशंस, और ऑटोमेटिक रिमाइंडर्स।"
    intro: "आप एक ऐसा स्पोर्ट्स ग्रुप एडमिन करते हैं जो उस पॉइंट से आगे बढ़ चुका है जहां ग्रुप चैट संभाल सके — एक सोशल फुटबॉल क्रू, टच रग्बी ग्रुप, नेटबॉल लीग, क्लाइम्बिंग मीटअप — कई नियमित सेशंस में दर्जनों या सैकड़ों मेंबर्स के साथ।"
    row1_tag: "मेंबरशिप कंट्रोल"
    row1_title: "पब्लिक, प्राइवेट, या बीच में कहीं"
    row1_body: "अपने ग्रुप की एक्टिविटी को इवेंट टेम्पलेट के रूप में बनाएं। ऑर्गेनिक ग्रोथ के लिए इसे पब्लिक और डिस्कवर करने योग्य बनाएं, या प्राइवेट ताकि मेंबरशिप पूरी तरह नियंत्रित हो — केवल उन्हें दिखे जिन्हें आप अंदर आने देते हैं।"
    row1_li1: "प्राइवेट इवेंट्स सर्च और डिस्कवरी से पूरी तरह छिपे रहते हैं"
    row1_li2: "सिक्योरिटी और मेंबरशिप सेटिंग्स हर इवेंट के हिसाब से कॉन्फ़िगर होती हैं"
    row1_li3: "जब आप तैयार हों तब ग्रुप को इनवाइट-ओनली से ओपन ग्रोथ में बदलें"
    row2_tag: "आसान ऑनबोर्डिंग"
    row2_title: "एक लिंक पूरा काम करता है"
    row2_body: "एक ही लिंक किसी WhatsApp ग्रुप, ईमेल सिग्नेचर, या सोशल पोस्ट में शेयर करें — या पोस्टर्स और नोटिसबोर्ड्स के लिए मैचिंग QR कोड प्रिंट करें। दोनों ही नए मेंबर को एक टैप या स्कैन में उसी जॉइन पेज पर ले जाते हैं।"
    row2_li1: "हर नए मेंबर को \"मैं कैसे जुड़ूं\" समझाना अब बंद"
    row2_li2: "आप कहां से भर्ती कर रहे हैं उसके हिसाब से लिंक या QR कोड चुनें"
    row2_li3: "चाहे रिसीवर के पास पहले से Sports HQ हो या न हो, काम करता है"
    row3_tag: "अपने तरीके से शेड्यूलिंग"
    row3_title: "मैन्युअल कंट्रोल, रिकरिंग सुविधा"
    row3_body: "एडहॉक सेशंस के लिए एक्टिविटीज़ को मैन्युअली शेड्यूल करें, या अपने नियमित साप्ताहिक फिक्सचर के लिए रिकरिंग पैटर्न सेट करें — और अपने ग्रुप के कैलेंडर की मांग के अनुसार दोनों के बीच स्विच करें।"
    row3_li1: "सेशन बनते या बदलते ही हर मेंबर को पुश नोटिफिकेशन जाती है"
    row3_li2: "मेंबर्स एक ही टैप में अटेंडेंस कन्फर्म या डिक्लाइन करते हैं"
    row3_li3: "सेशन नज़दीक आते ही रिमाइंडर अपने आप जाते हैं"
    row4_tag: "क्षमता और वेटलिस्ट"
    row4_title: "किसी को मना किए बिना ग्रुप का साइज़ सीमित करें"
    row4_body: "अपने पिच, कोर्ट, या वेन्यू की क्षमता से मेल खाती अटेंडीज़ की मैक्सिमम संख्या सेट करें। एक बार सेशन भर जाने पर, नए साइन-अप्स खो जाने के बजाय अपने आप वेटलिस्ट में जुड़ जाते हैं।"
    row4_step1_title: "अपना मैक्सिमम ग्रुप साइज़ सेट करें"
    row4_step1_body: "कैप पहुंचते ही सेशंस कन्फर्मेशन लेना बंद कर देते हैं।"
    row4_step2_title: "एक्स्ट्रा साइन-अप्स वेटलिस्ट में जुड़ते हैं"
    row4_step2_body: "किसी को सीधे मना नहीं किया जाता — उन्हें अपने आप कतार में लगा दिया जाता है।"
    row4_step3_title: "स्पॉट्स खुद भर जाते हैं"
    row4_step3_body: "जब कोई कन्फर्म्ड मेंबर डिक्लाइन करता है, तो वेटलिस्ट का अगला मेंबर तुरंत सूचित हो जाता है।"
    download_headline: "एक <span class=\"download__accent\">बड़े ग्रुप</span> में व्यवस्था लाएं।"
    download_sub: "Sports HQ मुफ्त डाउनलोड करें और अपने सोशल स्पोर्ट्स ग्रुप को वह स्ट्रक्चर दें जो ग्रुप चैट अब नहीं दे सकती।"
  communal_field_community:
    crumb: "कम्युनल फील्ड कम्युनिटीज़"
    badge: "कम्युनल फील्ड और फैसिलिटी कम्युनिटीज़ के लिए"
    title: "वही मैदान। वही चेहरे। <span>अब एक कम्युनिटी।</span>"
    sub: "आप और कुछ नियमित खिलाड़ी एक ही पब्लिक कोर्ट, पार्क पिच, या कम्युनिटी फील्ड शेयर करते हैं — लेकिन आप कभी असल में उन सबसे नहीं मिले जो वहां खेलते हैं। Sports HQ उस शेयर्ड स्पेस को एक असली, ऑर्गनाइज़्ड कम्युनिटी में बदल देता है, बिना वेन्यू की ओनरशिप की ज़रूरत के।"
    intro: "आप नियमित रूप से एक ही कम्युनल फील्ड, कोर्ट, या पार्क में खेलते हैं — और वहां कम्युनिटी बनाने के लिए आपको वेन्यू का मालिक होने की ज़रूरत नहीं है। आपको बस एक तरीका चाहिए जिससे आने वाले लोग एक-दूसरे को ढूंढ सकें।"
    row1_tag: "शुरू करें"
    row1_title: "अपना इवेंट बनाएं, फिर तय करें कि इसे कैसे शेयर करना है"
    row1_body: "Sports HQ में अपना इवेंट बनाएं और आपको उसी पेज के लिए QR कोड और जॉइन लिंक मिलता है। QR कोड प्रिंट करें और फील्ड पर एक या दो कॉपी छोड़ें — किसी फेंस पोस्ट, बेंच, या नोटिसबोर्ड पर चिपकाकर — या जो अभी साइट पर नहीं हैं उनके लिए ग्रुप चैट में लिंक डालें।"
    row1_li1: "शुरू करने के लिए वेन्यू ओनरशिप या साइन-अप प्रोसेस की ज़रूरत नहीं"
    row1_li2: "फील्ड के लिए ही QR कोड; ग्रुप चैट के लिए लिंक — कोई एक इस्तेमाल करें, या दोनों"
    row1_li3: "स्कैन या टैप करते ही नए खिलाड़ी जुड़ जाते हैं — किसी एडमिन का इंतज़ार नहीं"
    row2_tag: "डिस्कवरेबिलिटी"
    row2_title: "पास में सर्च करने वाला कोई भी आपको ढूंढ ले"
    row2_body: "QR कोड के अलावा, आपका इवेंट लोकेशन-बेस्ड सर्च के ज़रिए डिस्कवर हो सकता है — ताकि इलाके से गुज़रता कोई धावक, फुटबॉलर, या बास्केटबॉलर आपकी कम्युनिटी ढूंढ सके और खेलने आ सके।"
    row2_li1: "अपने खेल और लोकेशन के लिए मैप सर्च रिज़ल्ट्स में दिखें"
    row2_li2: "जिन्होंने संयोग से साइन देखा उनसे आगे अपने नियमित खिलाड़ियों को बढ़ाएं"
    row2_li3: "QR कोड के साथ मिलकर काम करता है, उसकी जगह नहीं"
    row3_tag: "असली कम्युनिटी"
    row3_title: "हर हफ्ते दिखने वाले चेहरों को नाम दें"
    row3_body: "एक बार लोग आपके फील्ड के इवेंट में रजिस्टर हो जाएं, तो वे एक-दूसरे की प्रोफाइल ब्राउज़ कर सकते हैं, नियमित खिलाड़ियों को फॉलो कर सकते हैं, और सीधे मैसेज कर सकते हैं — \"पार्क में खेलने वाले लोगों\" को एक असली नेटवर्क में बदलते हुए।"
    row3_li1: "मेंबर डायरेक्टरी इवेंट में रजिस्टर हर किसी को दिखाती है"
    row3_li2: "बिल्ट-इन मैसेजिंग अलग ग्रुप चैट की ज़रूरत खत्म कर देती है"
    row3_li3: "लोगों को अपने खुद के पिकअप सेशंस स्वतंत्र रूप से ऑर्गनाइज़ करने के लिए प्रोत्साहित करता है"
    row4_tag: "कोऑर्डिनेशन"
    row4_title: "आसान एक्टिविटी कोऑर्डिनेशन, बिना एडमिन ओवरहेड के"
