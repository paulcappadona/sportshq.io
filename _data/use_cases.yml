    sub: "Tú y unos cuantos habituales compartís la misma cancha pública, cancha de parque o campo comunitario — pero nunca habéis llegado a conoceros todos los que jugáis ahí. Sports HQ convierte ese espacio compartido en una comunidad real y organizada, sin necesidad de ser propietario de la instalación."
    intro: "juegas habitualmente en el mismo campo, cancha o parque comunitario — y no necesitas ser propietario de la instalación para construir una comunidad ahí. Solo necesitas una forma de que quienes aparecen se encuentren entre sí."
