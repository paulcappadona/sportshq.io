    row2_title: "Föreslå kvällens löprunda, meddela alla direkt"
    row2_body: "Vilken medlem som helst kan skapa en aktivitet för gänget — föreslå datum, tid och rutt, och alla får omedelbart en pushnotis. Ingen administrativ flaskhals, inget väntande på att någon ska \"se\" meddelandet."
