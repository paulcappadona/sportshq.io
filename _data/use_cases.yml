    cta_primary: "Cadastre Seu Local"
    intro: "você é dono ou administra uma instalação, complexo, ou local — um clube de tênis, academia, ginásio esportivo, centro de escalada, ou campo comunitário — e quer construir uma comunidade ativa e recorrente de clientes em vez de reservas anônimas e pontuais."
