    row4_body: "अपने पिच, कोर्ट, या वेन्यू की क्षमता से मेल खाती अटेंडीज़ की मैक्सिमम संख्या सेट करें। एक बार सेशन भर जाने पर, नए साइन-अप्स खो जाने के बजाय अपने आप वेटलिस्ट में जुड़ जाते हैं।"
    row4_step1_title: "अपना मैक्सिमम ग्रुप साइज़ सेट करें"
    row4_step1_body: "कैप पहुंचते ही सेशंस कन्फर्मेशन लेना बंद कर देते हैं।"
    row4_step2_title: "एक्स्ट्रा साइन-अप्स वेटलिस्ट में जुड़ते हैं"
    row4_step2_body: "किसी को सीधे मना नहीं किया जाता — उन्हें अपने आप कतार में लगा दिया जाता है।"
    row4_step3_title: "स्पॉट्स खुद भर जाते हैं"
    row4_step3_body: "जब कोई कन्फर्म्ड मेंबर डिक्लाइन करता है, तो वेटलिस्ट का अगला मेंबर तुरंत सूचित हो जाता है।"
    download_headline: "एक <span class=\"download__accent\">बड़े ग्रुप</span> में व्यवस्था लाएं।"
    download_sub: "Sports HQ मुफ्त डाउनलोड करें और अपने सोशल स्पोर्ट्स ग्रुप को वह स्ट्रक्चर दें जो ग्रुप चैट अब नहीं दे सकती।"
  communal_field_community:
    meta_title: "लोकल कोर्ट और मैदान कम्युनिटी — QR या लिंक | Sports HQ"
    meta_desc: "साझा पार्क, कोर्ट या मैदान को लोकल कम्युनिटी बनाएँ। QR कोड या लिंक से साइन-अप, आस-पास खोज और नियमित खिलाड़ियों के एक-दूसरे को खोजने का आसान तरीका।"
    crumb: "कम्युनल फील्ड कम्युनिटीज़"
    badge: "कम्युनल फील्ड और फैसिलिटी कम्युनिटीज़ के लिए"
    title: "वही मैदान। वही चेहरे। <span>अब एक कम्युनिटी।</span>"
    sub: "आप और कुछ नियमित खिलाड़ी एक ही पब्लिक कोर्ट, पार्क पिच, या कम्युनिटी फील्ड शेयर करते हैं — लेकिन आप कभी असल में उन सबसे नहीं मिले जो वहां खेलते हैं। Sports HQ उस शेयर्ड स्पेस को एक असली, ऑर्गनाइज़्ड कम्युनिटी में बदल देता है, बिना वेन्यू की ओनरशिप की ज़रूरत के।"
    intro: "आप नियमित रूप से एक ही कम्युनल फील्ड, कोर्ट, या पार्क में खेलते हैं — और वहां कम्युनिटी बनाने के लिए आपको वेन्यू का मालिक होने की ज़रूरत नहीं है। आपको बस एक तरीका चाहिए जिससे आने वाले लोग एक-दूसरे को ढूंढ सकें।"
    row1_tag: "शुरू करें"
    row1_title: "अपना इवेंट बनाएं, फिर तय करें कि इसे कैसे शेयर करना है"
    row1_body: "Sports HQ में अपना इवेंट बनाएं और आपको उसी पेज के लिए QR कोड और जॉइन लिंक मिलता है। QR कोड प्रिंट करें और फील्ड पर एक या दो कॉपी छोड़ें — किसी फेंस पोस्ट, बेंच, या नोटिसबोर्ड पर चिपकाकर — या जो अभी साइट पर नहीं हैं उनके लिए ग्रुप चैट में लिंक डालें।"
    row1_li1: "शुरू करने के लिए वेन्यू ओनरशिप या साइन-अप प्रोसेस की ज़रूरत नहीं"
    row1_li2: "फील्ड के लिए ही QR कोड; ग्रुप चैट के लिए लिंक — कोई एक इस्तेमाल करें, या दोनों"
    row1_li3: "स्कैन या टैप करते ही नए खिलाड़ी जुड़ जाते हैं — किसी एडमिन का इंतज़ार नहीं"
    row2_tag: "डिस्कवरेबिलिटी"
    row2_title: "पास में सर्च करने वाला कोई भी आपको ढूंढ ले"
    row2_body: "QR कोड के अलावा, आपका इवेंट लोकेशन-बेस्ड सर्च के ज़रिए डिस्कवर हो सकता है — ताकि इलाके से गुज़रता कोई धावक, फुटबॉलर, या बास्केटबॉलर आपकी कम्युनिटी ढूंढ सके और खेलने आ सके।"
    row2_li1: "अपने खेल और लोकेशन के लिए मैप सर्च रिज़ल्ट्स में दिखें"
    row2_li2: "जिन्होंने संयोग से साइन देखा उनसे आगे अपने नियमित खिलाड़ियों को बढ़ाएं"
    row2_li3: "QR कोड के साथ मिलकर काम करता है, उसकी जगह नहीं"
    row3_tag: "असली कम्युनिटी"
    row3_title: "हर हफ्ते दिखने वाले चेहरों को नाम दें"
    row3_body: "एक बार लोग आपके फील्ड के इवेंट में रजिस्टर हो जाएं, तो वे एक-दूसरे की प्रोफाइल ब्राउज़ कर सकते हैं, नियमित खिलाड़ियों को फॉलो कर सकते हैं, और सीधे मैसेज कर सकते हैं — \"पार्क में खेलने वाले लोगों\" को एक असली नेटवर्क में बदलते हुए।"
    row3_li1: "मेंबर डायरेक्टरी इवेंट में रजिस्टर हर किसी को दिखाती है"
    row3_li2: "बिल्ट-इन मैसेजिंग अलग ग्रुप चैट की ज़रूरत खत्म कर देती है"
    row3_li3: "लोगों को अपने खुद के पिकअप सेशंस स्वतंत्र रूप से ऑर्गनाइज़ करने के लिए प्रोत्साहित करता है"
    row4_tag: "कोऑर्डिनेशन"
    row4_title: "आसान एक्टिविटी कोऑर्डिनेशन, बिना एडमिन ओवरहेड के"
    row4_body: "एक रिकरिंग साप्ताहिक रन शेड्यूल करें, वन-ऑफ सेशंस सेट करें, या किसी भी कन्फर्म्ड मेंबर को नई एक्टिविटी प्रपोज़ करने दें — अटेंडेंस, रिमाइंडर्स, और अपडेट्स सब अपने आप हैंडल होते हैं।"
    row4_li1: "रिकरिंग शेड्यूल्स आपके नियमित स्लॉट को बिना मैन्युअल मेंटेनेंस के चलाते रहते हैं"
    row4_li2: "पुश नोटिफिकेशंस सबको नए सेशंस या बदलावों के बारे में तुरंत बताती हैं"
    row4_li3: "वन-टैप कन्फर्म/डिक्लाइन हेडकाउंट को सटीक रखता है"
    download_headline: "अपने <span class=\"download__accent\">मैदान</span> के आसपास एक कम्युनिटी बनाएं।"
    download_sub: "Sports HQ मुफ्त डाउनलोड करें, अपना इवेंट बनाएं, और आज ही अपना पहला QR कोड प्रिंट करें।"

  safe_group_runs:
    meta_title: "महिलाओं के लिए ज़्यादा सुरक्षित ग्रुप रन | Sports HQ"
    meta_desc: "अकेले दौड़ना पसंद नहीं? भरोसेमंद रनिंग पार्टनर के साथ इवेंट बनाएँ, चाहें तो उसे निजी रखें, देखें कौन कन्फ़र्म हुआ और चाहें तो अपनी लाइव लोकेशन साझा करें।"
    crumb: "सुरक्षित ग्रुप रन"
    badge: "महिलाओं और अकेले न दौड़ने को प्राथमिकता देने वाले सभी के लिए"
    title: "भरोसेमंद लोगों के साथ <span>सुरक्षित ग्रुप रन</span>"
    sub: "दौड़ना आपको आज़ादी का एहसास दे, डर का नहीं। उत्पीड़न की वजह से आपको अपनी दिनचर्या नहीं बदलनी चाहिए — लेकिन अगर आप सुबह जल्दी, शाम या शांत रास्तों पर साथ पसंद करते हैं, तो Sports HQ आपको उन दोस्तों, परिवार और रनिंग पार्टनर्स के साथ एक इवेंट बनाने में मदद करता है जिन पर आप भरोसा करते हैं, चाहें तो इसे प्राइवेट सेट करें ताकि यह सिर्फ आप लोगों के बीच रहे, और घर से निकलने से पहले ठीक-ठीक देखें कि किसने कन्फर्म किया है।"
    sub2: "चाहे वे आपके साथ दौड़ें या साइकिल पर साथ चलें, आपको पता होगा कि आपका भरोसेमंद कोई व्यक्ति साथ आने के लिए कमिट कर चुका है।"
    cta_primary: "अपना रनिंग इवेंट बनाएं"
    cta_secondary: "देखें ग्रुप रन कैसे काम करता है"
    intro: "आप अकेले दौड़ना पसंद नहीं करते — खासकर सुबह जल्दी, अंधेरा होने के बाद, या शांत रास्तों पर — लेकिन आपके रनिंग पार्टनर्स के शेड्यूल कभी मेल नहीं खाते। Sports HQ उन लोगों को कोऑर्डिनेट करता है जिन्हें आप पहले से जानते और भरोसा करते हैं, और आप चाहें तो किसी गतिविधि के दौरान आपकी लाइव लोकेशन भी साझा कर सकता है; यह इमरजेंसी सेवा नहीं है और न ही सुरक्षा की गारंटी।"
    row1_tag: "आपका भरोसेमंद सर्कल"
    row1_title: "उन लोगों के इर्द-गिर्द बना एक इवेंट जिन पर आप पहले से भरोसा करते हैं, जब भी ज़रूरत हो तैयार"
    row1_body: "उन लोगों के लिए एक इवेंट बनाएं जिन्हें आप वाकई दौड़ते वक्त अपने साथ चाहते हैं — ट्रेनिंग पार्टनर, दोस्त, परिवार, या कोई जो साइकिल पर साथ चले, जैसे गोल्ड कोस्ट की एक रनर के पार्टनर करते हैं जब वे खुद उसके साथ नहीं दौड़ पाते। उन्हें मेंबर के तौर पर जोड़ें, इवेंट को प्राइवेट सेट करें अगर आप इसे सिर्फ अपने सर्कल तक रखना चाहते हैं, और यह हर आने वाली दौड़ के लिए फिर से इस्तेमाल के लिए तैयार रहेगा।"
    row1_li1: "अगर आप चाहते हैं कि सिर्फ इनवाइट किए गए मेंबर्स ही इसे देख सकें, तो अपने इवेंट को प्राइवेट सेट करें"
    row1_li2: "लिंक या QR कोड से मेंबर्स जोड़ें, अलग से अकाउंट सेटअप की ज़रूरत नहीं"
    row1_li3: "यह एक तय रनिंग पार्टनर के लिए भी उतना ही काम करता है जितना पूरे मोहल्ले की क्रू के लिए"
    row2_tag: "रीयल-टाइम कन्फर्मेशन"
    row2_title: "क्या आपकी अगली दौड़ के लिए कोई फ्री है? सेकंडों में पता लगाएं"
    row2_body: "एक दौड़ प्रपोज़ करें और आपका पूरा सर्कल तुरंत नोटिफाई हो जाता है। जैसे-जैसे जवाब आते हैं, आप उन्हें लाइव अपडेट होते देखते हैं — किसी से जवाब मांगने की ज़रूरत नहीं, और यह जाने बिना घर से नहीं निकलना कि कोई साथ आ रहा है या नहीं।"
    row2_step1_title: "अपनी अगली दौड़ प्रपोज़ करें"
    row2_step1_body: "समय, मीटिंग पॉइंट और रूट सेट करें — कोई भी मेंबर यह कर सकता है।"
    row2_step2_title: "आपका सर्कल तुरंत नोटिफाई हो जाता है"
    row2_step2_body: "पोस्ट होते ही सभी को तुरंत पुश नोटिफिकेशन मिल जाता है।"
    row2_step3_title: "कन्फर्मेशन लाइव आते हैं"
    row2_step3_body: "देखें कौन आ रहा है और कौन नहीं, रीयल-टाइम में अपडेट होता हुआ, आपके निकलने तक।"
    row3_tag: "लाइव हेडकाउंट"
    row3_title: "कमिट करने से पहले देखें कौन आ रहा है, और कितने"
    row3_body: "कन्फर्म और डिक्लाइन किए गए लोगों का लाइव टोटल मतलब आपको अंदाज़ा नहीं लगाना पड़ता। चाहे आप सुबह जल्दी निकलें या सूरज ढलने के बाद, एक नज़र में देख सकते हैं कि पूरा ग्रुप है, सिर्फ एक पार्टनर है, या अभी कोई नहीं — ताकि आप तय कर सकें आगे क्या करना है।"
