    row1_title: "圍繞你已經信任的人建立活動，隨時準備好"
    row1_body: "為那些你真心希望在跑步時陪在身邊的人建立活動——訓練夥伴、朋友、家人，或是騎單車陪同的人，就像黃金海岸一位跑者的伴侶，在自己無法陪跑時所做的那樣。把他們加為成員，如果想只留在你的圈子裡，就把活動設為私密，之後每次跑步都能重複使用。"
    row1_li1: "如果只想讓受邀成員看到，就把活動設為私密"
    row1_li2: "用連結或 QR code 新增成員，不需要另外建立帳號"
    row1_li3: "無論是固定的一位跑步夥伴，還是整個街坊的跑團，都適用"
    row2_tag: "即時確認"
    row2_title: "下次跑步有人有空嗎？幾秒鐘就能知道"
    row2_body: "發起一場跑步，你的整個圈子會立刻收到通知。回覆陸續進來時，你能即時看到更新——不用追著誰要回覆，也不用在不知道有沒有人會來的情況下就出門。"
    row2_step1_title: "發起下一場跑步"
    row2_step1_body: "設定時間、集合地點和路線——任何成員都可以發起。"
