    alt3: "Ajustes de privacidad de un evento de Sports HQ con evento privado y restricciones de ingreso"
    alt4: "Ajustes de horario de sesiones recurrentes en Sports HQ"
  fill_the_last_spot:
    meta_title: "Encuentra un reemplazo rápido: completa cada plaza | Sports HQ"
    meta_desc: "¿Falta un jugador? Alertas de «falta uno», recordatorios a quienes no confirmaron y listas de espera ayudan a que tu partido o liga llene cada plaza."
    badge: "Para organizadores que odian cancelar partidos"
    title: "¿Falta un jugador? <span>Completa todas las plazas.</span>"
    sub: "Nada arruina un partido semanal como una baja de última hora. Sports HQ puede avisar a quienes no han respondido, enviar alertas de «falta uno» y notificar a la siguiente persona de la lista de espera cuando se libera una plaza, para ayudar a que un partido de diez llegue a diez."
    intro: "organizas cada semana un partido de fútbol, una noche de voleibol, una escalera de pickleball o un equipo de liga, y siempre acabas buscando un reemplazo una hora antes del inicio."
    row1_tag: "Alertas inteligentes de actividad"
    row1_title: "Activa las alertas y deja que la app haga el trabajo de insistir"
    row1_body: "Activa las alertas inteligentes en cualquier evento. Sports HQ envía alertas de «falta un jugador» y de reemplazo de última hora, además de recordatorios automáticos a quienes aún no han respondido."
    row1_li1: "Alertas de «falta uno» y de reemplazo de última hora"
    row1_li2: "Recordatorios automáticos para quienes no han respondido"
    row1_li3: "Los jugadores pueden desactivar las alertas de eventos en los que no participan"
    row2_tag: "Llega a jugadores cercanos"
    row2_title: "Ve más allá de tu grupo cuando lo necesites"
    row2_body: "Avisa solo a tus miembros o llega a jugadores cercanos que encajen con el deporte, el nivel y la disponibilidad que necesitas. Cubre el hueco con alguien que de verdad quiere jugar."
    row2_step1_title: "Elige a quién avisar"
    row2_step1_body: "Solo a tus miembros, o a jugadores cercanos que encajen."
    row2_step2_title: "Se notifica a los jugadores adecuados"
    row2_step2_body: "Se tienen en cuenta el deporte, el nivel y la disponibilidad."
    row2_step3_title: "Confirma con un toque"
    row2_step3_body: "La plaza se cubre y el recuento se actualiza en directo."
    row3_tag: "Listas de espera y fiabilidad"
    row3_title: "Suplentes listos y una visión más clara de quién aparece"
    row3_body: "Cuando un jugador confirmado se baja, se notifica a la siguiente persona de la lista de espera. Las valoraciones y el seguimiento de asistencia muestran quién aparece de forma fiable, para que sepas con quién contar."
    row3_li1: "Las listas de espera avisan a la siguiente persona cuando se libera una plaza"
    row3_li2: "Seguimiento de asistencia / ausencias en el check-in"
    row3_li3: "Fiabilidad, puntualidad y simpatía en los perfiles de jugador"
    faq_tag: "Preguntas frecuentes"
    faq_title: "Preguntas sobre cómo completar un partido"
    faq1_q: "¿Cómo encuentro un reemplazo con poca antelación?"
    faq1_a: "Activa las alertas inteligentes en tu evento. Sports HQ puede enviar alertas de «falta un jugador» y de reemplazo de última hora a tus miembros o a jugadores cercanos que encajen con tu deporte, nivel y disponibilidad."
    faq2_q: "¿Puede Sports HQ recordar a quienes no han respondido?"
    faq2_a: "Sí. Se envían recordatorios automáticos a los miembros que no han respondido, así no tienes que perseguirlos tú."
    faq3_q: "¿Qué pasa cuando alguien se da de baja?"
    faq3_a: "Si tu evento tiene lista de espera, se notifica a la siguiente persona en cuanto se libera una plaza."
    faq4_q: "¿Pueden los jugadores desactivar las alertas?"
    faq4_a: "Sí. Los jugadores pueden desactivar las alertas de los eventos en los que no participan."
    faq5_q: "¿Cómo reduzco las ausencias?"
    faq5_a: "Marca quién asistió y quién no al registrar la llegada, y deja que tus compañeros valoren la fiabilidad y puntualidad de los demás. Con el tiempo, el perfil de cada jugador muestra quién aparece siempre, así sabes con quién contar en tu plantilla. Los recordatorios y las listas de espera cubren los huecos."
    faq6_q: "¿Cómo encuentro un suplente para mi liga o equipo?"
    faq6_a: "Envía primero una alerta de «falta uno» a tus propios miembros o amplíala a jugadores cercanos que coincidan con tu deporte, nivel y disponibilidad. El primero en confirmar se queda con la plaza y el conteo se actualiza en vivo."
    faq7_q: "¿Para qué deportes funciona?"
    faq7_a: "Para cualquiera de los más de 60 deportes de Sports HQ, como fútbol, baloncesto, voleibol, pickleball, pádel, tenis, hockey, rugby y críquet. Funciona mejor en juegos con un número fijo de jugadores."
