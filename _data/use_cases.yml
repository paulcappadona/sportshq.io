    row3_li2: "Medlemmar kan skicka meddelanden, följa, och koppla upp sig direkt i appen"
    row3_li3: "Driver återkommande besök och organisk tillväxt genom mun-till-mun"
    row4_tag: "Sanktionerade Event"
    row4_title: "Håll i eventen som får folk att komma tillbaka"
    row4_body: "Kör ett veckovis medlemsumgänge, en söndagsliga, eller en månatlig turnering — skapa det en gång som ett återkommande schema och låt Sports HQ generera varje framtida instans automatiskt."
