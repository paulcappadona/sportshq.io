    row2_step1_body: "Imprima para o clube ou envie no grupo dos pais."
    row2_step2_title: "As famílias pedem para entrar"
    row2_step2_body: "Os responsáveis enviam pedidos de participação em nome dos filhos."
    row2_step3_title: "Você aprova quem entra"
