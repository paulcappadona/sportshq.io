  feature_7_title: "Juega con gente con la que puedes contar"
  feature_7_body: "Valora a tus compañeros después de cada partido y comprueba quién aparece de verdad. La fiabilidad, la puntualidad y la simpatía se reflejan en el perfil de cada jugador."
