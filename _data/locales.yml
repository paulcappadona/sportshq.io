  uc_card_office_sports_organizer_title: "Organizadores de Deporte en la Oficina"
  uc_card_office_sports_organizer_desc: "Publica, programa y controla la asistencia de actividades deportivas en el trabajo sin perseguir a tus compañeros por email o chat."
  uc_card_social_sports_group_title: "Grandes Grupos Deportivos Sociales"
  uc_card_social_sports_group_desc: "Membresía pública o privada, enlaces para compartir y listas de espera para grandes grupos sociales recurrentes."
  uc_card_communal_field_community_title: "Comunidades de Campos Comunitarios"
  uc_card_communal_field_community_desc: "Convierte un parque, cancha o campo compartido en una comunidad descubrible con códigos QR y búsqueda por ubicación."
  uc_card_run_club_title: "Clubes de Running Improvisados"
  uc_card_run_club_desc: "Coordina carreras grupales de última hora con notificaciones instantáneas y confirmación/rechazo con un toque."
