  feature_8_li_2: "Recordatorios para quienes aún no han respondido"
  feature_8_li_3: "Llega a jugadores cercanos que encajan en deporte, nivel y disponibilidad"
  feature_9_title: "Chatea con tu grupo"
  feature_9_body: "Mantén la conversación donde está el juego. Escribe a jugadores, crea chats de grupo o activa chats para cualquier evento, actividad o recinto."
