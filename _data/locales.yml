  uc_card_safe_group_runs_desc: "Crea un círculo de carrera de confianza y ve quién ha confirmado antes de salir."
  uc_hub_title: "Problemas Reales. <span>Soluciones Reales.</span>"
  uc_hub_sub: "Ya sea que dirijas un club de tenis, organices una liga de oficina, mantengas unido un grupo social o simplemente intentes sacar a tu club de running a tiempo — Sports HQ sustituye las hojas de cálculo, los chats grupales y los correos por una sola app pensada para comunidades deportivas."
  uc_hub_cta_browse: "Explorar Casos de Uso"
  uc_hub_section_tag: "Encuentra tu Caso"
  uc_hub_section_title: "Diseñado para todo tipo de <em class=\"features__title-accent\">comunidad deportiva</em>"
  uc_hub_section_sub: "Elige el escenario más parecido al tuyo para ver exactamente cómo te ayuda Sports HQ."
  faqs_label: "Preguntas Frecuentes"
  faqs_title: "Preguntas <span>Frecuentes</span>"
