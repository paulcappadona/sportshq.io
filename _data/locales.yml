  feature_9_li_2: "Chats opcionales de evento, actividad y recinto"
  feature_9_li_3: "Controles de administrador para publicar y compartir fotos"
  feature_7_alt: "Perfil de jugador de Sports HQ con un resumen de fiabilidad"
  feature_8_alt: "Ajustes de alertas de actividad de Sports HQ para alertas de «falta uno» y recordatorios"
  feature_9_alt: "Conversación de chat de grupo en Sports HQ"
