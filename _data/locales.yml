  faq_delete_account_a: "Instrucciones paso a paso para eliminar permanentemente tu cuenta de Sports HQ y tus datos."
  faqs_contact: "¿Sigues teniendo dudas? <a href=\"mailto:support@sportshq.io\">Contacta con soporte</a> y te responderemos."
