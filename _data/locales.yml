  ad_headline: "Elimina tu <span>Cuenta</span>"
  ad_sub: "Elimina permanentemente tu cuenta de Sports HQ y todos los datos asociados — perfil, membresías de eventos, chats, listas de seguimiento y valoraciones. Así es exactamente cómo funciona el proceso, en tres pasos."
  ad_warning_lead: "Esto no se puede deshacer."
  ad_warning_body: "Eliminar tu cuenta borra todos tus datos de nuestro sistema — incluyendo listas de seguimiento y valoraciones, membresías de eventos, chats y datos de perfil. Una vez confirmada la eliminación, no hay forma de recuperar tu cuenta."
