  feature_3_li_1: "एथलीटों को फॉलो करें और उनकी गतिविधि देखें"
  feature_3_li_2: "स्किल और एबिलिटी रेटिंग"
  feature_3_li_3: "म्यूचुअल कनेक्शन रिक्वेस्ट"
  feature_4_body: "कोर्ट, मैदान, जिम और सुविधाएं रजिस्टर करें। QR से शेयर करें, सदस्यता प्रबंधित करें और स्थानीय समुदाय में वेन्यू प्रमोट करें।"
  feature_4_li_1: "कमर्शियल, पब्लिक और प्राइवेट वेन्यू"
  feature_4_li_2: "QR कोड और लिंक शेयरिंग"
  feature_4_li_3: "एथलीट रजिस्ट्रेशन और चेक-इन"
  feature_4_li_4: "सदस्य एंगेजमेंट बढ़ाएं"
  feature_5_body: "इवेंट्स, एक्टिविटी अपडेट और नए जॉइनर्स के लिए पुश नोटिफिकेशन से जुड़े रहें। कोई भी गेम अपडेट न चूकें।"
  feature_5_li_1: "एक्टिविटी अपडेट अलर्ट"
  feature_5_li_2: "इंस्टेंट जॉइन नोटिफिकेशन"
  feature_5_li_3: "इवेंट रिमाइंडर शेड्यूलिंग"
  feature_6_body: "अभिभावक खाते माता-पिता को नाबालिगों की प्रोफ़ाइल को पूरी दृश्यता और नियंत्रण के साथ प्रबंधित करने देते हैं। सुरक्षा संपर्क और लाइव लोकेशन शेयरिंग गतिविधियों के दौरान भरोसेमंद लोगों को जानकारी में रखते हैं।"
  feature_6_li_1: "माता-पिता / गार्जियन अकाउंट"
  feature_6_li_2: "माइनर प्रोफाइल नियंत्रण"
  feature_6_li_3: "सभी इवेंट्स पर आयु और लिंग फिल्टर"
  venues_feature_1_sub: "अपने क्षेत्र में खेलने की जगह ढूंढ रहे एथलीटों के लिए मैप सर्च में दिखाई दें।"
  venues_feature_2_sub: "एथलीटों को QR कोड से मौके पर रजिस्टर करने दें — कोई कागजी काम नहीं।"
  venues_feature_3_sub: "देखें कौन रजिस्टर है, एक्सेस प्रबंधित करें और अपने समुदाय से संवाद करें।"
  venues_feature_4_sub: "वेन्यू इवेंट बनाएं और प्रमोट करें जो अपने आप फॉलोअर्स और स्थानीय एथलीटों तक पहुंचें।"
