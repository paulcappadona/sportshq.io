  uc_card_communal_field_community_title: "कम्युनल फील्ड कम्युनिटीज़"
  uc_card_communal_field_community_desc: "QR कोड्स और लोकेशन-बेस्ड सर्च के साथ किसी साझा पार्क, कोर्ट या मैदान को एक डिस्कवर करने योग्य कम्युनिटी में बदलें।"
  uc_card_run_club_title: "एडहॉक रन क्लब्स"
  uc_card_run_club_desc: "इंस्टेंट नोटिफिकेशन और वन-टैप कन्फर्म/डिक्लाइन के साथ आखिरी समय के ग्रुप रन कोऑर्डिनेट करें।"
  uc_card_safe_group_runs_title: "सुरक्षित ग्रुप रन"
  uc_card_safe_group_runs_desc: "एक भरोसेमंद रनिंग सर्कल बनाएं और निकलने से पहले देखें किसने कन्फर्म किया है।"
  uc_hub_title: "असली समस्याएं। <span>असली समाधान।</span>"
  uc_hub_sub: "चाहे आप टेनिस क्लब चलाते हों, ऑफिस लीग ऑर्गनाइज़ करते हों, एक सोशल ग्रुप को साथ रखते हों, या बस अपने रन क्लब को समय पर निकालने की कोशिश कर रहे हों — Sports HQ स्प्रेडशीट्स, ग्रुप चैट्स और ईमेल थ्रेड्स की जगह स्पोर्ट्स कम्युनिटीज़ के लिए बनी एक ही ऐप देता है।"
  uc_hub_cta_browse: "यूज़ केस देखें"
  uc_hub_section_tag: "अपना फिट खोजें"
  uc_hub_section_title: "हर तरह की <em class=\"features__title-accent\">स्पोर्ट्स कम्युनिटी</em> के लिए बनाया गया"
  uc_hub_section_sub: "अपने सबसे नज़दीकी परिदृश्य को चुनें और देखें कि Sports HQ बिल्कुल कैसे मदद करता है।"
  faqs_label: "सामान्य प्रश्न"
  faqs_title: "सामान्य <span>प्रश्न</span>"
  faqs_sub: "सबसे ज़्यादा पूछे जाने वाले सवालों के त्वरित जवाब। जो ढूंढ रहे हैं वह नहीं मिला? सपोर्ट से संपर्क करें।"
  faq_delete_account_q: "मैं अपना अकाउंट कैसे डिलीट करूं?"
  faq_delete_account_a: "अपने Sports HQ अकाउंट और डेटा को स्थायी रूप से डिलीट करने के लिए स्टेप-बाय-स्टेप निर्देश।"
  faqs_contact: "अभी भी कोई सवाल है? <a href=\"mailto:support@sportshq.io\">सपोर्ट से संपर्क करें</a>, हम आपको जवाब देंगे।"
  feature_6_li_4: "सुरक्षा संपर्क और लाइव लोकेशन शेयरिंग"
  feature_7_title: "उनके साथ खेलें जिन पर आप भरोसा कर सकें"
  feature_7_body: "हर खेल के बाद साथी खिलाड़ियों को रेट करें और देखें कि कौन सच में आता है। भरोसेमंदी, समय की पाबंदी और मिलनसारिता हर खिलाड़ी की प्रोफ़ाइल में जुड़ती जाती है।"
  feature_7_li_1: "समय की पाबंदी, मिलनसारिता और खेल स्तर को रेट करें"
  feature_7_li_2: "उपस्थित / अनुपस्थित की ट्रैकिंग"
  feature_7_li_3: "प्रोफ़ाइल पर भरोसेमंदी का सारांश"
  feature_8_title: "हर जगह भरें"
  feature_8_body: "स्मार्ट गतिविधि अलर्ट खेलों को आख़िरी समय में भी ज़रूरी खिलाड़ी जुटाने में मदद करते हैं।"
  feature_8_li_1: "\"एक और खिलाड़ी चाहिए\" और रिप्लेसमेंट अलर्ट"
  feature_8_li_2: "जिन सदस्यों ने जवाब नहीं दिया उनके लिए रिमाइंडर"
  feature_8_li_3: "खेल, स्तर और उपलब्धता से मेल खाते आस-पास के खिलाड़ियों तक पहुँचें"
  feature_9_title: "अपने ग्रुप से चैट करें"
  feature_9_body: "बातचीत वहीं रखें जहाँ खेल होता है। खिलाड़ियों को संदेश भेजें, ग्रुप चैट शुरू करें, या किसी भी इवेंट, गतिविधि या वेन्यू के लिए चैट चालू करें।"
  feature_9_li_1: "डायरेक्ट मैसेज और ग्रुप चैट"
  feature_9_li_2: "वैकल्पिक इवेंट, गतिविधि और वेन्यू चैट"
  feature_9_li_3: "पोस्ट और फ़ोटो के लिए एडमिन नियंत्रण"
  feature_7_alt: "भरोसेमंद होने के सारांश के साथ Sports HQ का खिलाड़ी प्रोफ़ाइल"
  feature_8_alt: "\"एक और खिलाड़ी चाहिए\" अलर्ट और रिमाइंडर के लिए Sports HQ की गतिविधि अलर्ट सेटिंग्स"
  feature_9_alt: "Sports HQ में ग्रुप चैट बातचीत"
  uc_card_youth_sports_title: "युवा खेल"
  uc_card_youth_sports_desc: "अभिभावकों द्वारा प्रबंधित जूनियर प्रोफ़ाइल, निजी टीमें और माता-पिता के अनुकूल उपस्थिति।"
  uc_card_fill_the_last_spot_title: "हर जगह भरें"
  uc_card_fill_the_last_spot_desc: "\"एक और खिलाड़ी चाहिए\" अलर्ट, रिमाइंडर और वेटलिस्ट ताकि आपके खेल को ज़रूरी खिलाड़ी जुटाने में मदद मिले।"

