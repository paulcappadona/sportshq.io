<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: "Sports HQ" }}</title>
  <meta name="description" content="{{ page.description | default: "Find your game. Build your team." }}" />
  {% if page.keywords %}<meta name="keywords" content="{{ page.keywords }}" />{% endif %}
  <meta property="og:title" content="{{ page.title | default: "Sports HQ" }}" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Sports HQ" />
  <meta property="og:image" content="https://storage.googleapis.com/sportshub-static/shub.png" />
  <link rel="shortcut icon" type="image/x-icon" href="/fav.ico" />
  <link rel="icon" href="/fav.ico" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-10KZEKEN6S"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-10KZEKEN6S');
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  {% if page.extra_css %}<link rel="stylesheet" href="{{ page.extra_css }}" />{% endif %}
</head>
<body>

  {% include nav.html %}

  {{ content }}

  {% include footer.html %}

  <script src="/js/main.js"></script>
  {% if page.toc %}
  <script>
    (function () {
      const tocLinks = document.querySelectorAll('.legal-toc__list a');
      const sections = document.querySelectorAll('.legal-body section[id]');
      function updateToc() {
        let current = '';
        sections.forEach(s => { if (s.getBoundingClientRect().top <= 120) current = s.id; });
        tocLinks.forEach(a => { a.classList.toggle('toc-active', a.getAttribute('href') === '#' + current); });
      }
      window.addEventListener('scroll', updateToc, { passive: true });
      updateToc();
    })();
  </script>
  {% endif %}

</body>
</html>
