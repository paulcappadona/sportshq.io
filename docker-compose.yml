services:
  jekyll:
    image: ruby:3.3
    working_dir: /srv/jekyll
    command: >
      bash -c "apt-get update && apt-get install -y --no-install-recommends git &&
               git config --global --add safe.directory /srv/jekyll &&
               gem install bundler --no-document &&
               bundle install &&
               bundle exec jekyll serve --livereload --host 0.0.0.0 --force_polling"
    ports:
      - "8800:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - bundle_cache:/usr/local/bundle
      # Explicitly mount the exact absolute path of the current worktree
      - ${WORKTREE_DIR:-.}:/workspace      
      # Explicitly mount the absolute path of the main git repo metadata
      - ${GIT_COMMON_DIR}:${GIT_COMMON_DIR}:ro

volumes:
  bundle_cache:
